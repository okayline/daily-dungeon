name = "daily-dungeon-board"
main = "worker.js"
compatibility_date = "2024-11-01"

# The game's page (repo files minus .assetsignore), so dungeon.88x31.app keeps working; the board is at the workers.dev address.
[assets]
directory = ".."

[[d1_databases]]
binding = "DB"
database_name = "daily-dungeon-board"
database_id = "PASTE-THE-ID-FROM-wrangler-d1-create"

[vars]
# The pages allowed to post scores (reads are open to anyone). The game's real address, no trailing slash;
# several are fine, comma-separated. Blank means any page. If posting says "not allowed", the game shows the address it came from.
ALLOW_ORIGIN = "https://okayline.github.io,https://html-classic.itch.zone,https://dungeon.88x31.app"
# The exchange (v1.00): "1" puts the bots' trades in the live market with everyone's; "0" keeps them to
# themselves (only the admin key sees them). Anonymous either way.
BOTS_PUBLIC = "1"
# Optional: comma-separated words a name may not contain (lowercase).
BLOCKLIST = ""
