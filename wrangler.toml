name = "daily-dungeon-board"
main = "leaderboard/worker.js"
compatibility_date = "2024-11-01"

# Lives at the repo root so Workers Builds finds it (a build run from the root with no config here uploads the files only,
# with no Worker code, D1 or bindings). The game's page (repo files minus .assetsignore), so dungeon.88x31.app keeps working; the board is at the workers.dev address.
[assets]
directory = "."

[[d1_databases]]
binding = "DB"
database_name = "daily-dungeon-board"
database_id = "a6dedccb-27e0-4988-84ea-64c7cd71c0ee"

[vars]
# The pages allowed to post scores (reads are open to anyone). The game's real address, no trailing slash;
# several are fine, comma-separated. Blank means any page. If posting says "not allowed", the game shows the address it came from.
ALLOW_ORIGIN = "https://okayline.github.io,https://html-classic.itch.zone,https://dungeon.88x31.app"
# The exchange (v1.00): "1" puts the bots' trades in the live market with everyone's; "0" keeps them to
# themselves (only the admin key sees them). Anonymous either way.
BOTS_PUBLIC = "1"
# Optional: comma-separated words a name may not contain (lowercase).
BLOCKLIST = ""
# Pages that may use player accounts (save codes, passkeys, cloud save), comma-separated. Must be https and under 88x31.app
# (the shared passkeys belong to 88x31.app). The page keeps its login token itself, so this Worker can stay on workers.dev.
ACCOUNT_ORIGINS = "https://dungeon.88x31.app"

# Save codes and passkeys: the shared Accounts service (the dungeon-items Worker, `Accounts` entrypoint; see its ACCOUNTS.md).
[[services]]
binding = "ACCOUNTS"
service = "dungeon-items"
entrypoint = "Accounts"

# (v1.14) The shared copy registry (dungeon-items, `Registry` entrypoint): a signed-in player's finds become numbered copies.
[[services]]
binding = "REGISTRY"
service = "dungeon-items"
entrypoint = "Registry"
