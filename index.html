    };

    if (animate && lines.length > 1 && !e.stage) {     // play the round back: the > moves to whoever acts
      // The round plays one line at a time. After each, a blinking _ waits for a click (or Enter / Space) before the next line rolls in.
      let n = 1;
      const show = () => { replayWait = true; frame(n, isDemon(lines[n - 1]) ? "demon" : null, false); replayWait = false; };
      replayAdvance = () => {
        n++;
        if (n >= lines.length) { replayTimer = null; replayAdvance = null; frame(lines.length, null, true); return; }
        show();
      };
      replayTimer = -1;                       // a stand-in: "a replay is waiting" (clearInterval on it is harmless)
      show();
      return true;
    }
    frame(lines.length, null, true);
    return true;
  }

  // The countdown beside the breath bar: seconds until she may act again, to a tenth, shown only while she is out
  // of breath. Five cells, blank otherwise.
  const breathTimer = () => { const ms = save && save.dungeon && !save.dead && RULES.breathNext ? RULES.breathNext(save) : null; return (ms === null ? "" : (ms / 1000).toFixed(1) + "s").padStart(5); };
  setInterval(() => { const el = document.getElementById("breathT"); if (el && !atTitle) { const t = breathTimer(); if (el.textContent !== t) el.textContent = t; } }, 100);   // only its own five cells change: the screen is not redrawn
  let seenBreath = null, seenLog = null;        // what the last frame showed, to notice a breath being spent
  let squeezeUntil = 0;                         // the > < that press on the breath bar for a second after a search
  const squeeze = () => { squeezeUntil = Date.now() + 1000; setTimeout(draw, 1050); };
  let searchWait = null, searchGo = false;      // the moment a wall search takes before its result shows
  function act(name) {
    // The only way act() is ever reached while atTitle is a NEW RUN confirm answered from the title
    // screen (resetBox() -> answerConfirm(true) -> act("reset")); that's the title's own exit into the game.
    if (atTitle) leaveTitle();
    if (save && worldLines.length) save.world = worldLines;      // word of everyone else, for the status line
    const okHold = holdOK, okReset = resetOK; holdOK = resetOK = false;      // a confirmation is good for this one call only
    if (replayTimer) finishReplay();
    prevDemonHp = save && save.encounter ? save.encounter.hp : null;
    prevKuraHp = save && save.encounter && save.party && save.party[0] ? save.party[0].hp : null;
    // [^] toward a bare wall is just a search of that wall; toward a door it takes the step.
    if (name === "forward" && save) {
      if (save.encounter) return;                  // in a fight, running is the [R]UN button in the fight box
      if (save.look) name = "search"; else       // looking up, [^] asks the moon
      name = !RULES.available(save).door[save.facing] ? "search" : "go-" + save.facing;
    }
    // Searching a bare wall, or listening at a locked door, takes a moment: "KURA is searching" (or "listening"),
    // a dot at a time, then the result. Nothing else can be pressed meanwhile. Only the log line changes: no
    // dimming or other visual effect, ever. (Every wall and every door, open or shut. Not looking up, and not when she is out of breath.)
    if (searchWait) return;
    if (name === "search" && save && !searchGo && !save.encounter && !save.dead && !save.look && !save.question
        && RULES.breath(save) >= 1) {
      const was = save.log, doing = RULES.available(save).locked[save.facing] ? "listening" : "searching"; let dots = 0;
      const paint = () => { save.log = `> KURA is ${doing}` + " .".repeat(dots); draw(); };
      paint();
      searchWait = setInterval(() => {
        if (++dots <= 3) return paint();
        clearInterval(searchWait); searchWait = null; save.log = was;
        squeeze();
        searchGo = true; try { act("search"); } finally { searchGo = false; }
        // The result comes up in a small box over the view and waits for its [ OK ] (unless something else opened).
        if (save && !save.dead && !save.encounter && !save.question && !(save.altar && save.altar.open) && document.getElementById("found").hidden) resultBox();
      }, 250 + (6 - Math.min(6, RULES.breath(save))) * 50);   // slower as she tires: a second in all at full breath, two on her last
      return;
    }
    // Every other search is instant (scrying the moon, or being out of breath). A result gets the same box; being
    // refused for want of breath only shows its line.
    if (name === "search" && save && !searchGo && !save.encounter && !save.dead && !save.question) {
      const before = RULES.breath(save);
      searchGo = true; try { act("search"); } finally { searchGo = false; }
      if (save && (before < 1 || RULES.breath(save) < before)) squeeze();
      if (save && before >= 1 && !save.dead && !save.encounter && !save.question && !(save.altar && save.altar.open) && document.getElementById("found").hidden) resultBox();
      return;
    }
    if (save && save.encounter && (name === "left" || name === "right" || name === "look")) return;      // no turning around mid-fight
    if ((name === "qyes" || name === "qno" || name === "qsilent") && save) {
      const log = save.log, partyBefore = (save.party || []).map(p => p.name);
      save = RULES.reply(save, name === "qsilent" ? "silent" : name === "qyes");
      heldExtra = null;                    // the answer's line goes up at once, not behind the old question
      remember(log); persist(); draw();
      const gone = partyBefore.filter(n => !(save.party || []).some(p => p.name === n));
      if (gone.length) noticeBox([`${gone.join(" and ")} leaves the party.`, save.extra.replace(/^> /, "")]);      // someone left over the answer
      return;
    }
    // A party member's question waits for [Y]ES or [N]O: nothing else moves the game on until it's answered
    // (the bag, codex, log, help and password still open, so the player can think it over).
    if (save && save.question && /^(search|hold|left|right|look|forward|run|fight|talk|altar|go-)/.test(name)) {
      document.querySelectorAll(".btn.ask").forEach(el => { el.classList.remove("nudge"); void el.offsetWidth; el.classList.add("nudge"); });
      return;
    }
    if (name === "run" && save && save.encounter && save.encounter.ranTried) { save.log = "> KURA already tried to run. FIGHT, TALK, or GIVE."; persist(); draw(); encounterBox(); return; }
    if (name === "run" && save && save.encounter) {
      // Running takes any way out, whichever way KURA faces: an open door first, a locked one (it takes the key) if that's all there is.
      const can = RULES.available(save), out = ["N", "E", "S", "W"].filter(d => can[d]), free = out.filter(d => !can.locked[d]);
      const pool = free.length ? free : out;
      if (!pool.length) { save.log = "> There is no way out today. FIGHT, TALK, or GIVE."; persist(); draw(); encounterBox(); return; }
      name = "go-" + pool[Math.floor(Math.random() * pool.length)];
    }
    if (name !== "invoke" && name !== "codex") logGlow = false;
    if (name.startsWith("go-") && save) {
      const dir = name.slice(3);
      if (armed !== dir && RULES.available(save)[dir] && RULES.isLocked(save, dir)) {   // only a locked door asks: it takes the key
        disarm(); armed = dir;
        draw(); confirmBox(dir);
        return;
      }
    }
    disarm();
    if (name === "invoke") {
      const closing = !document.getElementById("inv").hidden;
      if (save && save.encounter && !closing) document.getElementById("found").hidden = true;   // the fight box comes back after
      showInv(!closing);
      if (closing && save && save.encounter) encounterBox();   // closing the bag from the menu brings the fight box back too
      return;
    }
    if (name === "log") return toggleLog();
    if (name === "board") return LEADERBOARD_URL ? toggleBoard() : undefined;
    if (name === "about") return showAbout(document.getElementById("about").hidden);
    if (name === "codex") { codexSel = -1; return showCodex(document.getElementById("codex").hidden); }
    if (name === "backup") return backup();
    if (!save) return;
    if (name === "reset") { if (!okReset) { resetBox(); return; } }
    if (name === "hold") { if (!okHold) { holdBox(); return; } }
    const log = save.log, steps = save.steps, exBefore = save.extra, ranBefore = !!(save.encounter && save.encounter.ranTried), partyBefore = (save.party || []).map(p => p.name);
    const before = { items: (save.items || []).slice(), silver: save.silver };
    save = name === "yes" ? RULES.answer(save, true) : name === "no" ? RULES.answer(save, false) : name === "silent" ? RULES.answer(save, "silent")
      : name.startsWith("give-") ? RULES.give(save, name === "give-none" ? null : Number(name.slice(5)))
      : name.startsWith("offer-") ? RULES.offerGive(save, name === "offer-none" ? null : Number(name.slice(6)))
      : name.startsWith("swap-") ? RULES.swap(save, name === "swap-none" ? null : Number(name.slice(5)))
      : name === "altar" ? RULES.altarOpen(save)
      : name === "altar-next" ? RULES.altarNext(save)
      : name.startsWith("altar-") ? RULES.altarGive(save, name === "altar-none" ? null : Number(name.slice(6)))
      : name === "left" ? RULES.turn(save, "L") : name === "right" ? RULES.turn(save, "R") : name === "look" ? RULES.turn(save, "U")
      : name.startsWith("go-") ? RULES.go(save, name.slice(3)) : RULES[name](save);
    if (name === "reset") {
      save.history = [];
      if (altarTimer) { clearInterval(altarTimer); altarTimer = null; }
      heldExtra = null; logGlow = false; invSel = 0; queuedNotice = null;
    }
    remember(name === "reset" || save.steps !== steps ? "" : log);
    persist(); draw();
    if (name === "reset" && nameBox()) return;
    // A blocked run says so in a box that waits for [ OK ]; then the fight box plays the demon's reply.
    if (name !== "reset" && save.encounter && save.encounter.ranTried && !ranBefore && !save.dead) {
      blockedRun = true; noticeBox([`${save.encounter.name} blocked your way.`]);
      return;
    }
    if (name !== "reset" && !encounterBox(true) && !altarBox()) {
      foundBox(before);
      // Nothing else opened: if this action brought something significant, say so in a box.
      if (!save.encounter) {
        const lines = [];
        // Someone left the party (the log line can be hidden behind a repeat, so go by the party itself).
        const gone = partyBefore.filter(n => !(save.party || []).some(p => p.name === n));
        if (gone.length) lines.push(`${gone.join(" and ")} leaves the party.`);
        else if (save.log !== log && SIGNIFICANT.test(save.log)) lines.push(save.log.replace(/^> /, ""));
        if (save.extra && save.extra !== exBefore && (gone.length || SIGNIFICANT.test(save.extra))) lines.push(save.extra.replace(/^> /, ""));
        if (lines.length) {
          if (document.getElementById("found").hidden) noticeBox(lines);
          else if (gone.length) queuedNotice = lines;      // something else is open (a find, say): the exit waits its turn
        }
      }
    }
  }

  document.getElementById("screen").addEventListener("click", e => {
    const fb = document.getElementById("found");
    if (!fb.hidden && fb.dataset.mode !== "encounter") return;   // a box waiting for its answer: the buttons behind it do nothing
    if (atTitle) {
      const b = e.target.closest(".btn");
      if (b && !b.classList.contains("off")) titleAction(b.dataset.act);
      return;
    }
    const b = e.target.closest(".btn");
    if (!b || (b.classList.contains("off") && b.dataset.act !== "forward")) return;
    act(b.dataset.act);
  });
  document.getElementById("log").addEventListener("click", e => {
    if (e.target.closest("[data-submit]")) return submitScore();
    if (e.target.closest("[data-board]")) { toggleLog(false); return toggleBoard(true); }
    if (e.target.closest(".submitrow")) return;                      // typing a name must not close the log
    if (e.target.closest("[data-download]")) return downloadLog();
    if (e.target.closest("[data-copy]")) return copyLog(e.target.closest("[data-copy]"));
    const sel = window.getSelection && window.getSelection();
    if (sel && !sel.isCollapsed && String(sel).trim()) return;      // dragging to select log text is not a click to close
    toggleLog(false);          // [C]LOSE, C, L, Esc, or any other click on the page
  });
  document.getElementById("board").addEventListener("click", () => toggleBoard(false));   // no other interactive bits in here: any click closes
  document.getElementById("found").addEventListener("click", e => {
    if (document.getElementById("found").dataset.mode === "name") { if (e.target.closest("[data-namego]")) confirmName(); return; }
    if (replayTimer) return replayAdvance ? replayAdvance() : finishReplay();     // a click brings in the next line
    if (e.target.closest("[data-intro]")) return introOK();
    const mode = document.getElementById("found").dataset.mode;
    if (mode === "intro") return;
    const pa = e.target.closest("[data-pact]");
    if (pa && passAct) return passAct(pa.dataset.pact);
    if (mode === "pass") return;                 // clicking a field to paste must not close the box
    const c = e.target.closest("[data-cact]");
    if (c) return answerConfirm(c.dataset.cact === "yes");
    if (mode === "confirm") return;                  // only its YES / NO buttons (or the keys): a stray click is not an answer
    const b = e.target.closest("[data-fact]");
    if (b) act(b.dataset.fact);
    else if (mode === "found" || mode === "done") { if (e.target.closest(".btn")) closeFound(); }   // only its [ OK ]
    else if (mode === "altar" && save.altar && save.altar.script && !save.altar.result && save.altar.page < save.altar.script.length - 1) act("altar-next");   // a click brings the terminal's next line
    else if (mode === "altar" || mode === "encounter") return;                   // their own buttons only
    else if (e.target.closest(".btn")) closeFound();   // any other box: only its [ OK ]
  });
  // Clicking an item chooses it; clicking the chosen one again uses it. Only [C]LOSE, I or Esc closes it.
  document.getElementById("inv").addEventListener("click", e => {
    if (e.target.closest("[data-use]")) return useInv(invSel);
    if (e.target.closest("[data-close]")) { showInv(false); if (save && save.encounter) encounterBox(); return; }
    if (e.target.closest("[data-codex]")) { showInv(false); codexSel = -1; return showCodex(true); }
    if (e.target.closest("[data-hold]")) return holdAction();
    const line = e.target.closest("[data-i]");
    if (ichorPick >= 0) { if (!line) { ichorPick = -1; return showInv(true); } const n = Number(line.dataset.i); if (n === ichorPick) return useInv(invSel, n || "0"); ichorPick = n; return showInv(true); }
    if (!line) { showInv(false); if (save && save.encounter) encounterBox(); return; }   // any other click closes, same as [C]LOSE
    const i = Number(line.dataset.i);
    if (i === invSel) useInv(i); else { invSel = i; showInv(true); }
  });
  document.getElementById("codex").addEventListener("click", e => {
    const tab = e.target.closest("[data-tab]"), line = e.target.closest("[data-i]");
    if (tab) { codexTab = tab.dataset.tab; codexSel = -1; showCodex(true); }
    else if (line) { codexSel = Number(line.dataset.i); showCodex(true); }
    else showCodex(false);     // [C]LOSE, Esc, or any other click on the page
  });
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const key = e.key.toLowerCase();
    if (e.target && e.target.tagName === "INPUT") { if (key === "enter") { e.preventDefault(); confirmName(); } return; }   // typing the name
    if (!atTitle && needsName()) { const i = document.getElementById("playername"); if (i) i.focus(); if (key === "enter") confirmName(); return; }   // nothing else works until the run has a name
    const fbox = document.getElementById("found");
    if (!fbox.hidden && fbox.dataset.mode === "intro") { e.preventDefault(); if (key === "enter") introOK(); return; }
    if (!fbox.hidden && fbox.dataset.mode === "pass") { if (key === "escape") passAct("close"); return; }   // typing and pasting go to the fields
    if (!fbox.hidden) {
      if (!/^(tab|f\d+)$/.test(key)) e.preventDefault();
      if (e.repeat) return;                        // holding a key can't answer a box
      if (fbox.dataset.mode === "confirm") {
        answerConfirm(key === "enter" || key === "y" || (key === "arrowup" && !!armed));     // anything else is NO
        return;
      }
      if (fbox.dataset.mode === "altar") {
        const A = save.altar || {};
        let k;
        const speaking = !A.result && !A.used && A.script && A.page < A.script.length - 1;
        if (speaking) k = { enter: "altar-next", " ": "altar-next", escape: "altar-none", b: "altar-none" }[key];
        else if (A.result || A.used) k = { enter: "altar-none", " ": "altar-none", escape: "altar-none", b: "altar-none" }[key];
        else k = /^[1-6]$/.test(key) ? "altar-" + (Number(key) - 1) : { b: "altar-none", escape: "altar-none" }[key];
        if (k) act(k);
        return;
      }
      if (fbox.dataset.mode === "encounter" && replayAdvance && (key === "enter" || key === " ")) { e.preventDefault(); replayAdvance(); return; }
      if (fbox.dataset.mode === "encounter") {
        const st2 = save.encounter && save.encounter.stage;
        let k;
        if (st2 === "gift") k = /^[1-8]$/.test(key) ? "give-" + (Number(key) - 1) : { n: "give-none", escape: "give-none" }[key];
        else if (st2 === "offer") k = /^[1-8]$/.test(key) ? "offer-" + (Number(key) - 1) : { b: "offer-none", n: "offer-none", escape: "offer-none" }[key];
        else if (st2 === "chat") k = { y: "yes", enter: "yes", n: "no", s: "silent", escape: "no" }[key];
        else if (st2 === "ask" || st2 === "join") k = { y: "yes", enter: "yes", n: "no", escape: "no" }[key];
        else if (st2 === "swap") k = { "2": "swap-1", "3": "swap-2", "4": "swap-3", n: "swap-none", escape: "swap-none" }[key];
        else k = { f: "fight", t: "talk", g: "offer", i: "invoke", r: "run" }[key];
        if (k) act(k);
      } else if (fbox.dataset.mode === "found" || fbox.dataset.mode === "done") { if (key === "enter") closeFound(); }   // a find only closes on its [ OK ] (Enter or a click), never by a stray key
      else if (key === "enter" || key === " " || key === "escape") closeFound();
      return;
    }
    if (!document.getElementById("about").hidden) {
      e.preventDefault();
      if (key === "?" || key === "escape") showAbout(false);
      else if (key === "c") { showAbout(false); codexSel = -1; showCodex(true); }
      else if (key === "b" && LEADERBOARD_URL) { showAbout(false); toggleBoard(true); }
      return;
    }
    if (!document.getElementById("codex").hidden) {
      e.preventDefault();
      if (key === "c" || key === "escape") showCodex(false);
      else if (key === "d" || key === "i") { codexTab = key === "d" ? "demons" : "items"; codexSel = -1; showCodex(true); }
      else if (key === "arrowdown" || key === "arrowup") { codexSel += key === "arrowdown" ? 1 : -1; showCodex(true); }
      else if (key === "arrowleft" || key === "arrowright") { codexTab = codexTab === "demons" ? "items" : "demons"; codexSel = -1; showCodex(true); }
      return;
    }
    if (!document.getElementById("inv").hidden) {
      if (ichorPick >= 0) {
        e.preventDefault();
        const n = save.party.length;
        if (key === "escape") ichorPick = -1;
        else if (key === "arrowdown" || key === "arrowup") ichorPick = (ichorPick + (key === "arrowdown" ? 1 : n - 1)) % n;
        else if (/^[1-9]$/.test(key) && Number(key) <= n) ichorPick = Number(key) - 1;
        else if (key === "enter") return useInv(invSel, ichorPick || "0");
        return showInv(true);
      }
      if (key === "i" || key === "c" || key === "escape") { e.preventDefault(); showInv(false); if (save && save.encounter) encounterBox(); }
      else if (key === "h") { e.preventDefault(); holdAction(); }
      else if (/^[1-9]$/.test(key)) { e.preventDefault(); invSel = Number(key) - 1; showInv(true); }
      else if (key === "arrowdown" || key === "arrowup") { e.preventDefault(); invSel += key === "arrowdown" ? 1 : -1; showInv(true); }
      else if (key === "enter") { e.preventDefault(); useInv(invSel); }
      return;
    }
    if (!document.getElementById("board").hidden) {
      e.preventDefault();
      if (key === "c" || key === "b" || key === "escape") toggleBoard(false);
      else if (save && save.freeSteps && boardData && (key === "arrowdown" || key === "arrowup")) { boardSel = (boardSel + (key === "arrowdown" ? 1 : boardData.rows.length - 1)) % Math.max(1, boardData.rows.length); renderBoard(); }
      else if (key === "d" && save && save.freeSteps) deleteEntry();
      return;
    }
    if (!document.getElementById("log").hidden) {
      if (key === "l" || key === "c" || key === "escape") { e.preventDefault(); toggleLog(false); }
      else if (key === "enter" || key === "p") { e.preventDefault(); submitScore(); }
      else if (key === "o") { e.preventDefault(); copyLog(document.querySelector("#log [data-copy]")); }
      else if (key === "d") { e.preventDefault(); downloadLog(); }
      return;
    }
    if (atTitle) {
      const a = { n: "title-new", c: "title-continue", b: "title-board", "?": "title-about" }[key];
      if (a) { e.preventDefault(); titleAction(a); }      // every other key (F5, Tab, F12...) is left to the browser
      return;
    }
    // S is SEARCH now; the day's step is [^] or the up arrow (the compass keys are gone with the NSEW buttons).
    if (save && save.question && (key === "y" || key === "n" || key === "s")) { e.preventDefault(); return act(key === "y" ? "qyes" : key === "n" ? "qno" : "qsilent"); }
    const k = { "?": "about", c: "codex", f: "fight", t: "talk", i: "invoke", l: "log", b: "board", p: "backup", r: "reset",
      s: "search", g: "altar", m: "look", arrowdown: save && save.look ? "look" : null, arrowup: "forward", arrowleft: "left", arrowright: "right" }[key];
    if (key === "x") { e.preventDefault(); return act(e.shiftKey ? "next" : "freesteps"); }   // testing cheats: X toggles infinite steps, Shift+X jumps a day
    if (k) { e.preventDefault(); act(k); }
  });

  start();
  // Live clock: redraw the moment the minute turns over (the colon blinks on its own),
  // and catch up with the real date so midnight brings the new day.
  let shownMinute = SMT.now().getMinutes();
  // The moon strip opens again as KURA gets her breath back: redraw when the count changes.
  setInterval(() => {
    if (atTitle || searchWait || !save || !save.dungeon || save.breathNow === undefined) return;
    const n = RULES.breath(save);
    if (n !== save.breathNow) { save.breathNow = n; draw(); }
  }, 250);
  setInterval(() => {
    const m = SMT.now().getMinutes();
    if (m !== shownMinute && !searchWait) { shownMinute = m; if (!atTitle) tick(); draw(); }   // on the title, only the title redraws; the run waits for CONTINUE
  }, 1000);
</script>
</body>
</html>
