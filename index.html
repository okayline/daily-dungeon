<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090a;
    --fg: #e4e4df;
    --dim: #4f5d52;
    --trail: #8f8f8a;
    --bright: #ffffff;
    --demon: #e0564a;
    --gold: #e3b341;
    --moon: #9fc4ff;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    font-family: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  .frame { max-width: 100%; overflow-x: auto; }
  pre {
    margin: 0; font-family: inherit; line-height: 1.05;
    font-size: clamp(6px, calc((100vw - 32px) / 49), 22px); white-space: pre;
    text-shadow: 0 0 4px rgba(228, 228, 223, 0.2);
  }
  .you { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .demon { color: var(--demon); }
  .gold { color: var(--gold); }
  .visited { color: var(--dim); }
  .moon { color: var(--moon); }
  .stairs { color: var(--moon); }
  .goal { color: var(--gold); text-shadow: 0 0 6px var(--gold); }
  /* Map symbols like □ ⋰ ⋱ ↑ ↓ can be wider or narrower than letters in some fonts.
     Boxing each one to exactly one character keeps the grid lined up. */
  /* .cell keeps the screen's own font so 1ch equals exactly one character of the grid;
     only the glyph inside it switches to a font that has the symbol. */
  .cell { display: inline-block; width: 1ch; text-align: center; overflow: visible; white-space: nowrap; }
  .cell .g { font-family: "DejaVu Sans Mono", Menlo, Consolas, "Segoe UI Symbol", monospace; line-height: 0; }
  .room { color: var(--trail); }
  .door { color: var(--trail); }
  /* The diagonal-dot stairs (⋰ ⋱) are tiny math symbols in most fonts, so the page
     draws them as three stepped dots that fill one character cell. */
  .dots svg { width: 1ch; height: 1em; vertical-align: -0.15em; fill: currentColor; }
  .btn { cursor: pointer; color: var(--bright); }
  .btn:hover { background: var(--fg); color: var(--bg); }
  .note { margin-top: 12px; color: var(--dim); font-size: clamp(13px, 3vw, 20px); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="frame"><pre id="screen">LOADING SAVE...</pre></div>
  <div class="note" id="note"></div>
<script src="screen.js"></script>
<script src="floor.js"></script>
<script src="rules.js"></script>
<script>
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let save = null;
  const dots = pts => `<svg viewBox="0 0 10 20" aria-hidden="true">${pts.map(([x, y]) =>
    `<rect x="${x}" y="${y}" width="2.6" height="2.6"/>`).join("")}</svg>`;
  const DOTS_UP = dots([[0.5, 14], [3.7, 9.5], [6.9, 5]]);     // steps rising to the right
  const DOTS_DOWN = dots([[0.5, 5], [3.7, 9.5], [6.9, 14]]);   // steps falling to the right

  // Color only the minimap rows (right panel) and the moon marker.
  function colorize(text) {
    const lines = text.split("\n");
    return lines.map((line, i) => {
      if (i >= 16 && i <= 20) {
        const left = esc(line.slice(0, 49)), right = line.slice(49);
        const map = right.replace(/[@^<>v&$?□⋰⋱↑↓╫═]/g, ch => {
          const cls = { "@": "you", "^": "you", "<": "you", ">": "you", "v": "you",
            "&": "demon", "$": "gold", "?": "goal", "□": "room",
            "⋰": "stairs dots", "⋱": "stairs dots", "↑": "stairs", "↓": "stairs", "╫": "door", "═": "door" }[ch];
          // Plain keyboard characters (? > < ^ v $ &) stay in the screen font;
          // only real Unicode symbols switch to the fallback symbol font.
          const inner = ch === "⋰" ? DOTS_UP : ch === "⋱" ? DOTS_DOWN
            : ch.charCodeAt(0) < 128 ? esc(ch) : `<span class="g">${esc(ch)}</span>`;
          return `<span class="cell ${cls}">${inner}</span>`;
        });
        return left + map;
      }
      if (i === 4) return esc(line).replace("^^^", '<span class="moon">^^^</span>');
      if (i === lines.length - 2) return esc(line)
        .replace("[G]O", '<span class="btn" data-act="go">[G]O</span>')
        .replace("SE[A]RCH", '<span class="btn" data-act="search">SE[A]RCH</span>');
      if (i === lines.length - 1) return esc(line)
        .replace("[N]EXT", '<span class="btn" data-act="next">[N]EXT</span>')
        .replace("[L]OAD", '<span class="btn" data-act="load">[L]OAD</span>')
        .replace("[R]ST", '<span class="btn" data-act="reset">[R]ST</span>');
      return esc(line);
    }).join("\n");
  }

  function draw() {
    if (!save) return;
    document.getElementById("screen").innerHTML = colorize(SMT.renderScreen(save, save.extra || ""));
  }

  // The saved game lives in save.json on GitHub. GO, SEARCH, NEXT and RST only change this browser's
  // copy (nothing is saved); LOAD throws that away and loads the saved game again.
  let dirty = false;
  function showNote() {
    document.getElementById("note").textContent = dirty
      ? "NOT SAVED  -  [L]OAD TO RETURN TO THE SAVED GAME"
      : (save && save.saved ? `LAST SAVED ${save.saved}` : "");
  }

  function load() {
    return fetch("save.json?t=" + Date.now(), { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(s => { save = s; dirty = false; draw(); showNote(); })
      .catch(() => {
        if (save) draw();   // keep showing the last good save if a check fails
        else document.getElementById("screen").textContent = "NO SAVE FOUND.";
      });
  }

  // GO and SEARCH use up a day; turning (arrow keys) is free. NEXT lets the game pick the day's action.
  function act(name) {
    if (name === "load") return load();
    if (!save) return;
    save = name === "left" ? RULES.turn(save, "L") : name === "right" ? RULES.turn(save, "R") : RULES[name](save);
    dirty = true; draw(); showNote();
  }

  document.getElementById("screen").addEventListener("click", e => {
    const b = e.target.closest(".btn"); if (b) act(b.dataset.act);
  });
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = { n: "next", l: "load", r: "reset", g: "go", a: "search", arrowup: "go",
      arrowleft: "left", arrowright: "right" }[e.key.toLowerCase()];
    if (k) { e.preventDefault(); act(k); }
  });

  load();
  // Once a minute: pick up a new save, or just redraw the clock while showing unsaved rolls.
  setInterval(() => (dirty ? draw() : load()), 60000);
</script>
</body>
</html>
