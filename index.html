<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Digital Demon Dungeon</title>
<style>
  /* VT323, self-hosted (fonts/OFL.txt has its license). */
  @font-face { font-family: "VT323"; src: url("fonts/VT323-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
  :root {
    --bg: #07090a;
    --fg: #e4e4df;
    --dim: #4f5d52;
    --trail: #8f8f8a;
    --bright: #ffffff;
    --demon: #e0564a;
    --gold: #e3b341;
    --moon: #9fc4ff;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { -webkit-user-select: none; user-select: none; }      /* clicks never highlight the screen text */
  textarea, input, #log pre { -webkit-user-select: text; user-select: text; }   /* but the password box and the log can still be selected and copied */
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    font-family: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-variant-ligatures: none;      /* VT323 joins fl, fi and ff into one cell, which pulls that row's border a column left */
  }
  .frame { max-width: 100%; overflow-x: auto; }
  pre {
    margin: 0; font-family: inherit; line-height: 1.05;
    font-size: clamp(6px, calc((100vw - 32px) / 49), 22px); white-space: pre;
    text-shadow: 0 0 4px rgba(228, 228, 223, 0.2);
  }
  .you { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .demon { color: var(--demon); }
  .gold { color: var(--gold); }
  .moon { color: var(--moon); }
  /* The clock's colon blinks slowly (1s on, 1s off); hidden, it still keeps its space. */
  .colon { animation: blink 2s steps(1) infinite; }
  /* The weekday kanji takes exactly two character cells, so the frame stays straight. */
  /* Like .cell: the box keeps the screen font so 2ch is two grid cells; only the glyph switches font. */
  .kanji { display: inline-block; width: 2ch; text-align: center; overflow: visible; white-space: nowrap; }
  .kanji .g { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "MS Gothic", sans-serif; line-height: 0; font-size: 0.8em; }   /* a little smaller than the letters, still centered in its two cells */
  @keyframes blink { 50% { opacity: 0; } }   /* opacity (not visibility) so a blinking button still takes clicks while it is dark */
  .stairs { color: var(--moon); }
  .goal { color: var(--gold); text-shadow: 0 0 6px var(--gold); }
  /* Map symbols like □ ⋰ ⋱ ↑ ↓ can be wider or narrower than letters in some fonts.
     Boxing each one to exactly one character keeps the grid lined up. */
  /* .cell keeps the screen's own font so 1ch equals exactly one character of the grid;
     only the glyph inside it switches to a font that has the symbol. */
  .cell { display: inline-block; width: 1ch; text-align: center; overflow: visible; white-space: nowrap; }
  /* The moon strip: shorter blocks, so the row is not taller than its neighbours. */
  .ph .g { display: inline-block; transform: scale(1.3, 0.62); }
  .mk { position: relative; z-index: 1; }
  .wm .g { display: inline-block; transform: scale(0.82, 1); }   /* the wordmark's blocks: the fallback font's are wider than a cell */
  .cell .g { font-family: "DejaVu Sans Mono", Menlo, Consolas, "Segoe UI Symbol", monospace; line-height: 0; }
  .room { color: var(--trail); }
  .door { color: var(--trail); }
  .door.focus { color: #ffffff; text-shadow: none; }   /* the locked door KURA faces: flat white, no glow */
  .door .g { position: relative; left: -0.1em; }   /* the fallback font draws || a touch right of its cell */
  .wall { color: var(--dim); opacity: 0.6; }
  .btn { cursor: pointer; color: var(--bright); }
  .btn:hover { background: var(--fg); color: var(--bg); }
  .btn.off { color: var(--dim); }
  .btn.armed { background: var(--gold); color: var(--bg); }
  .btn.flee { color: var(--bright); animation: blink 1.2s steps(1) infinite; }
  .unsaved { color: var(--gold); }
  .frame { position: relative; }
  /* The title logo: an image over the banner's rows, sized in the screen's own units (same font size as the pre), so it
     scales with the text. Half a row down from the banner's top, eight rows tall; the column comes from SMT.LOGO. */
  .titlelogo { position: absolute; pointer-events: none; font-size: clamp(6px, calc((100vw - 32px) / 49), 22px);
    top: calc(6.5 * 1.05em); height: calc(8 * 1.05em); width: auto; }
  .logview { position: absolute; inset: 0; background: rgba(7, 9, 10, 0.96); overflow: auto; cursor: pointer;
    border: 1px solid var(--trail); box-sizing: border-box; padding: 1.5em 2ch; }
  .logview pre { white-space: pre-wrap; }
  .logview .sel { color: var(--bright); }
  /* INVOKE opens inside the 3D view (rows 6-22, columns 1-47); placeInView() sizes it to that area. */
  .viewpop { position: absolute; background: var(--bg); overflow: auto; cursor: pointer; box-sizing: border-box;
    outline: 1px solid var(--trail); }
  .viewpop pre { white-space: pre; display: flex; flex-direction: column; min-height: 100%; margin: 0; }
  .viewpop pre > div { flex: none; }
  .viewpop pre > div:last-child { margin-top: auto; position: sticky; bottom: 0; background: var(--bg); }   /* the [ENTER] use row sits at the foot, so it never moves when the list or the box changes size */
  .logview .dim { color: var(--trail); }
  .foundbox { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); background: var(--bg);
    border: 1px solid var(--gold); padding: 1em 3ch; cursor: pointer; }   /* a gold border and no glow around it: no box in the game has one */
  /* A search result's color, by what it turned up. No glow on any of them. */
  .q-plain { color: var(--trail); }   /* nothing, or a common or uncommon thing: grey */
  .q-silver { color: #d6e8ff; }       /* SILVER: cooler and brighter than the log's own off-white */
  .q-rare { color: #6aa6e8; }         /* rare: blue */
  .q-mythic { color: #f5c542; }       /* mythic, and the deep find: a bright gold */
  .q-moon { color: #c9b6ff; }         /* a moon thing: lavender */
  #ticker { display: inline-block; width: 76ch; overflow: hidden; white-space: pre; vertical-align: top; }
  .foundbox pre { white-space: pre; text-align: center; }
  .foundbox .gold { color: var(--gold); }
  .nameinput { background: var(--bg); color: var(--fg); border: 1px solid var(--trail); font: inherit; width: 11ch; padding: 0 4px; text-transform: uppercase; }
  .nameinput.bad { border-color: var(--demon); }
  .passfield { display: block; width: 100%; box-sizing: border-box; background: var(--bg); color: var(--fg); border: 1px solid var(--trail); font: inherit; resize: none; margin: 4px 0; }
  /* The fight box sits inside the 3D view (rows 6-20, columns 1-47), like the bag, so the party and map stay in sight. */
  .foundbox.inframe { left: auto; top: auto; transform: none; border: none; outline: 1px solid var(--trail); box-shadow: none;
    box-sizing: border-box; overflow: hidden; cursor: default; }
  .foundbox.inframe pre { text-align: left; }
  .foundbox.fight pre { padding: 0 2ch; }   /* the fight box's text sits in from the edge */
  .foundbox.inframe .brow { display: flex; justify-content: space-between; }
  .foundbox .artframe { color: var(--trail); }
  .exframe { color: var(--trail); }
  .bdot { transform: scale(1.5); transform-origin: 50% 70%; }   /* the breath dots over the bar (v1.01.1): a little bigger, in place */   /* the exchange window's screen frame (v1.00) */
  .foundbox .arrow { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  /* Rarity colors, Diablo-style. */
  .lit { color: var(--moon); text-shadow: 0 0 6px var(--moon); animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.55; text-shadow: 0 0 2px var(--moon); } }
  .mframe { color: var(--trail); }
  .cres { color: var(--moon); }
  .logline { display: inline-block; width: 78ch; overflow: hidden; vertical-align: top; white-space: pre; }
  .wait { animation: blink 1s steps(1) infinite; }   /* the _ that waits for a click */
  .caret2 { display: inline-block; transform: scale(1.35); transform-origin: 50% 62%; }   /* the action button's caret: a little bigger, without moving anything */
  .caret { display: inline-block; position: relative; left: calc(-1ch / 6); width: calc(1ch / 1.5); font-size: 1.5em; line-height: 0.6; vertical-align: middle; text-shadow: none; }   /* just the ^ is bigger; its cell stays one column wide */
  .btn.nudge { animation: blink 0.35s steps(1) 2; }   /* two flashes when keys are pressed while a question waits */
  /* The build number, small, under the screen's lower right corner. */
  .ver { white-space: pre-line; text-align: right; font-size: 12px; line-height: 14px; color: var(--trail); padding: 2px 1ch 0 0; letter-spacing: 0.05em; }
  .cheat { text-align: left; padding: 2px 0 0 1ch; margin-top: -16px; }   /* the X cheat menu: three lines, left-justified; the build number stays at the right */
  .cheat:empty { display: none; }
  .pull { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .t-ICHOR { color: var(--demon); }
  .foundbox .demon { color: var(--demon); }
  .facing { color: var(--bright); }
  .saved { color: var(--fg); }
</style>
</head>
<body>
  <div class="frame"><pre id="screen">LOADING...</pre><img id="logo" class="titlelogo" src="title-logo.png" alt="Daily Digital Demon Dungeon" hidden>
    <div id="log" class="logview" role="dialog" aria-modal="true" aria-label="Adventure log" hidden><pre></pre></div>
    <div id="inv" class="viewpop" role="dialog" aria-modal="true" aria-label="Invoke: your bag" hidden><pre></pre></div>
    <div id="exch" class="viewpop" role="dialog" aria-modal="true" aria-label="Exchange: trading with other players" hidden><pre></pre></div>
    <div id="codex" class="logview" role="dialog" aria-modal="true" aria-label="Codex" hidden><pre></pre></div>
    <div id="board" class="logview" role="dialog" aria-modal="true" aria-label="Leaderboard" hidden><pre></pre></div>
    <div id="about" class="logview" role="dialog" aria-modal="true" aria-label="About" hidden><pre></pre></div>
    <div id="ver" class="ver"></div>
    <div id="cheat" class="ver cheat"></div>
    <div id="found" class="foundbox" role="dialog" aria-modal="true" aria-live="polite" hidden><pre></pre></div></div>
<script src="screen.js"></script>
<script src="floor.js"></script>
<script src="rules.js"></script>
<script>
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let save = null;
  // TITLE SCREEN: shown first on every load (even over a save in progress -- CONTINUE is the explicit
  // resume). atTitle gates the click/keydown handlers over at the bottom of this file.
  let worldLines = [];                 // the title feed's lines, lent to the run's status line now and then (see RULES report)
  let atTitle = true, titleTimer = null, titleOffset = 0, titleCards = [], titleLean = null, titleDeep = null, titleStats = null, titleEvents = [];

  // Color only the minimap rows (right panel) and the moon marker.
  function colorize(text) {
    const lines = text.split("\n");
    return lines.map((line, i) => {
      if (i >= 15 && i <= 19) {
        const left = esc(line.slice(0, 49)), right = line.slice(49);
        // [^] and [v] inside brackets are stairs; a bare ^ v < > next to @ is KURA's facing arrow.
        // The locked door KURA faces gets a slightly brighter #: it sits in the gap beside her @ on that side.
        const ctr = (lines[17] || "").slice(49).indexOf("@"), face = save && save.facing;
        const focus = ctr < 0 ? null : face === "N" ? [16, ctr] : face === "S" ? [18, ctr] : face === "E" ? [17, ctr + 2] : face === "W" ? [17, ctr - 2] : null;
        const map = right.replace(/[\[)][\^v][\](]|[@^v<>&$?□=‖#+\-|]/g, (m, at) => {
          // The outline walls (+ - |) are dim; a # is a locked door and stays bright. The panel's own edges are left alone.
          if (/[+\-|]/.test(m)) {
            if (at === 0 || at === right.length - 1) return m;
            const l = right[at - 1], r = right[at + 1], gap = c => c === " " || c === "[" || c === "]";
            return `<span class="wall">${m}</span>`;
          }
          if (m.length === 3) return m[0] + `<span class="cell stairs">${m[1]}</span>` + m[2];
          const ch = m;
          const cls = { "@": "you", "^": "you", "v": "you", "<": "you", ">": "you",
            "&": "demon", "$": "gold", "?": "goal", "□": "room", "=": "door", "‖": "door", "#": "door" }[ch];
          // Plain keyboard characters (? > < ^ v $ &) stay in the screen font;
          // only real Unicode symbols switch to the fallback symbol font.
          const inner = ch.charCodeAt(0) < 128 ? esc(ch) : `<span class="g">${esc(ch)}</span>`;
          const lit = ch === "#" && focus && i === focus[0] && at === focus[1] ? " focus" : "";
          return `<span class="cell ${cls}${lit}">${inner}</span>`;
        });
        return left + map;
      }
      // Turn controls under the 3D view (only the left 48 columns, so the map is never touched).
      if (i === 21 || i === 22) {
        const left = esc(line.slice(0, 48))
          .replace("[ &lt; ]", `<span class="btn${save && save.encounter ? " off" : ""}" data-act="left">[ &lt; ]</span>`)
          .replace("[ &gt; ]", `<span class="btn${save && save.encounter ? " off" : ""}" data-act="right">[ &gt; ]</span>`)
          // [^] takes the day's step forward; dim when that way is a wall or the step is spent, and in a fight
          // (running is a button in the fight box).
          .replace("[  ^  ]", `<span class="btn" data-act="forward">[  <span class="caret">^</span>  ]</span>`)
          .replace(/(<\/span>)(\s+)([NESWU?])(\s+)(<span)/, '$1$2<span class="facing">$3</span>$4$5');
        // The moon strip (row 21, right panel): each block glyph boxed to one cell, like the moon icon.
        // The moon strip (the breath bar) on row 21; at its right end, the seconds until the next breath is back.
        const glyphs = s => esc(s).replace(/[░▒▓█]/g, ch => `<span class="cell ph"><span class="g">${ch}</span></span>`)
          // the > and < that press on the bar after a search: kept above the bar and a little outside it, so the bar's wider blocks never cover them
          .replace("&gt;", '<span class="mk" style="left:-.25ch;top:-1px">&gt;</span>').replace("&lt;", '<span class="mk" style="left:calc(.5ch + 2px);top:-1px">&lt;</span>');
        // (v1.00.2: the bar sits about two thirds of a column left of the panel's middle in text columns, so its row is nudged right by that much.)
        const tail = i === 21 ? esc(line.slice(48, 49)) + `<span style="position:relative;left:.65ch">${glyphs(line.slice(49, 73))}</span>` + `<span id="breathT">${breathTimer()}</span>` + esc(line.slice(78)) : glyphs(line.slice(48));
        return left + tail;
      }
      // The v over today's phase (row 20, right panel).
      // The breath dots over the bar (row 20): nudged the same .65ch as the bar below them, so they sit centered over it.
      // Drawn half again as big (scaled in place, so the row keeps its 80 columns); an odd count is nudged half a column more (see screen.js).
      if (i === 20) { const odd = ((line.slice(48).match(/\./g) || []).length) % 2 === 1;
        return esc(line.slice(0, 48)) + esc(line.slice(48)).replace(/\./g, `<span class="cell bdot" style="position:relative;left:${odd ? "1.15ch" : ".65ch"}">.</span>`); }
      // The block moon (rows 1-4): each box or shade glyph boxed to one cell; the lit part glows and breathes.
      const moonBox = t => t.replace(/[╭╮╰╯─│░▒▓█]/g, ch => `<span class="cell ${/[░▒▓█]/.test(ch) ? "lit" : "mframe"}"><span class="g">${ch}</span></span>`);
      if (i === 1) return moonBox(esc(line)).replace(/(\d\d):(\d\d)/, '$1<span class="colon">:</span>$2')
        .replace(/([一-鿿])/g, '<span class="kanji"><span class="g">$1</span></span>');
      if (i === 2 || i === 3) return moonBox(esc(line));
      if (i === 4) return moonBox(esc(line)).replace("^^^", '<span class="moon">^^^</span>');
      // The three log lines: their text sits in a box exactly 78 cells wide, so the right border stays
      // straight even if a glyph in the font (an apostrophe, say) isn't exactly one cell wide.
      // Line 2 glows gold right after using an item.
      if (i >= lines.length - 6 && i <= lines.length - 4) {
        let inner = esc(line.slice(1, -1)); const gold = false;
        // A party member's question: [Y]ES and [N]O sit at the right end of the top line and answer it.
        // The bottom line is the ticker: the status report, this run's news and word of everyone else, typed out a line at a time.
        if (i === lines.length - 4) return `|<span class="logline"> <span id="ticker">${tickerHtml()}</span> </span>|`;
        if (i === lines.length - 6) inner = inner
          .replace("[Y]ES", '<span class="btn ask" data-act="qyes">[Y]ES</span>')
          .replace(/\[N\]O(?![A-Z])/, '<span class="btn ask" data-act="qno">[N]O</span>')
          .replace("[S]ILENT", '<span class="btn ask" data-act="qsilent">[S]ILENT</span>');
        // The middle line, after a search: "KURA searches the WEST wall..." stays as it is, and what came of it follows
        // in its quality's color (grey for nothing or a common or uncommon thing, silver for SILVER, blue for a rare
        // thing, gold for a mythic one or the deep find, lavender for a moon thing).
        if (i === lines.length - 5) {
          const m = /^( &gt; KURA (?:searches|scries) the [^.]+\.+) (.+?)(\s*)$/.exec(inner);
          if (m) inner = `${m[1]} <span class="${resultClass(m[2])}">${m[2]}</span>${m[3]}`;
        }
        return `|<span class="logline${gold ? " " + gold : ""}">${inner}</span>|`;
      }
      if (i === lines.length - 2) {
        // Daily actions dim once used (or when there's no door that way).
        const can = save ? RULES.available(save) : {};
        const b = (txt, act, ok) => `<span class="btn${ok ? "" : " off"}" data-act="${act}">${txt}</span>`;
        return esc(line)
          .replace("[F]IGHT", '<span class="btn" data-act="fight">[F]IGHT</span>')
          .replace("[T]ALK", '<span class="btn" data-act="talk">[T]ALK</span>')
          .replace("[I]NVOKE", '<span class="btn" data-act="invoke">[I]NVOKE</span>')
          .replace(/\[S\]EARCH|\[S\]CRY/, m => b(m, "search", can.search))
          .replace("[M]OON", b("[M]OON", "look", !!save && !save.encounter && !save.dead))
          .replace(/\[([NSEW])\](ORTH|OUTH|AST|EST)/g, (m, x) =>
            b(m, "go-" + x, can[x]).replace('class="btn', 'class="btn' + (armed === x ? " armed" : save && save.encounter && can[x] ? " flee" : "")));
      }
      if (i === lines.length - 1) return esc(line)
        // SAVED / NOT SAVED shows for a few seconds after each action, then fades back into the border.
        .replace(/ (NOT SAVED|SAVED \d{4}-\d\d-\d\d) /, (m, t) => Date.now() < statusUntil
          ? ` <span class="${t === "NOT SAVED" ? "unsaved" : "saved"}">${t}</span> ` : "=".repeat(m.length))
        .replace("[?]", '<span class="btn" data-act="about">[?]</span>')
        .replace("[L]OG", '<span class="btn" data-act="log">[L]OG</span>')
        .replace("[R]ESET", '<span class="btn" data-act="reset">[R]ESET</span>');
      return esc(line);
    }).join("\n")
      // The exchange's screen in the room view (v1.00): its cells are drawn as U+2800; each row of them becomes a
      // span the market timer fills (see exTick), top row first.
      .replace(/\u2800+/g, m => `<span class="exq">${" ".repeat(m.length)}</span>`)
      // The ALIGN arrow (which way the last action pulled KURA) glows white.
      .replace(/&lt;( ?\[(?:KPT|STR|FRL)\])/, '<span class="pull">&lt;</span>$1')
      .replace(/(\[(?:KPT|STR|FRL)\] ?)&gt;/, '$1<span class="pull">&gt;</span>');
  }
  // The title screen's own colorizer: the header (rows 0-5) is identical to the in-run screen's and
  // gets the same treatment; everything below it is new (no minimap, no party, no [Y]/[N] questions).
  function colorizeTitle(text) {
    const lines = text.split("\n");
    const moonBox = t => t.replace(/[╭╮╰╯─│░▒▓█]/g, ch => `<span class="cell ${/[░▒▓█]/.test(ch) ? "lit" : "mframe"}"><span class="g">${ch}</span></span>`);
    return lines.map((line, i) => {
      if (i === 1) return moonBox(esc(line)).replace(/(\d\d):(\d\d)/, '$1<span class="colon">:</span>$2')
        .replace(/([一-鿿])/g, '<span class="kanji"><span class="g">$1</span></span>');
      if (i === 2 || i === 3) return moonBox(esc(line));
      if (i === 4) return moonBox(esc(line)).replace("^^^", '<span class="moon">^^^</span>');
      // The banner (rows 6 to 14): each block glyph boxed to one cell, like the moon's, so the letters hold their shape.
      if (i >= 6 && i <= 14) {
        const wm = t => esc(t).replace(/[▀▄█▓▌▐]/g, ch => `<span class="cell wm"><span class="g">${ch}</span></span>`);
        const C = SMT.CRES, b = i - 6 - C.row;
        if (b < 0 || b >= C.rows) return wm(line);
        // the crescent's cells: blue, flat (no glow), the dotted block boxed like the lettering's own
        const moon = line.slice(1 + C.col, 1 + C.col + C.w).replace(/[▀▄█▓]/g, ch => `<span class="cell cres${ch === "▓" ? " wm" : ""}"><span class="g">${ch}</span></span>`);
        return wm(line.slice(0, 1 + C.col)) + moon + wm(line.slice(1 + C.col + C.w));
      }
      // WEEK / EPOCH / LEAN: the same three rows the in-run log box occupies.
      if (i >= lines.length - 6 && i <= lines.length - 4) return `|<span class="logline">${esc(line.slice(1, -1))}</span>|`;
      // The menu bar: [N]EW RUN [C]ONTINUE [B]OARD [?] ABOUT, same bracket convention as the real bar.
      if (i === lines.length - 2) {
        const b = (txt, act, ok) => `<span class="btn${ok ? "" : " off"}" data-act="${act}">${txt}</span>`;
        return esc(line)
          .replace("[N]EW RUN", b("[N]EW RUN", "title-new", true))
          .replace("[C]ONTINUE", b("[C]ONTINUE", "title-continue", titleCanContinue()))
          .replace("[B]OARD", b("[B]OARD", "title-board", !!LEADERBOARD_URL))
          .replace("[?] ABOUT", b("[?] ABOUT", "title-about", true));
      }
      return esc(line).replace(/([一-鿿])/g, '<span class="kanji"><span class="g">$1</span></span>');      // (the level's heading carries the quarter's kanji)
    }).join("\n");
  }

  // Line 3 (voices, flavor, clues) stays put for at least 2 actions and 2 seconds before the next one replaces it,
  // so a quick run of clicks can't skip past it. Anything urgent (a warning, a hit, a new demon) takes over at once.
  // Only what's drawn is held: the save and the LOG still get every line.
  let heldExtra = null;                     // { text, steps, t }: the line on screen, and when it went up
  const EXTRA_URGENT = /closes tonight|GAME OVER|TRIPPING|comes down|-\d+ HP|appears|blocks the way|comes to see what broke|FALLS|calendar|joins the party/i;
  function extraToShow() {
    const want = save.extra || "", now = Date.now(), steps = save.steps || 0, h = heldExtra;
    const take = () => { if (!h || h.text !== want || steps < h.steps) heldExtra = { text: want, steps, t: now }; return want; };
    if (!h || steps < h.steps || want === h.text || save.dead || save.question || save.extraUrgent || EXTRA_URGENT.test(want)) return take();
    if (steps - h.steps >= 2 && now - h.t >= 2000) return take();
    if (steps - h.steps >= 2) setTimeout(draw, h.t + 2000 - now + 30);   // the turns are up: wait out the clock

  // Put back the fight or altar box that belongs to the run (after a cancelled question, a loaded password...).
  function restoreBoxes() { if (save) { if (nameBox()) return; encounterBox(); altarBox(); } }
  function draw() {
    if (atTitle) return drawTitle();               // a stray redraw (the clock, a closing box) must never paint the run over the title
    if (!save) return;
    try {
      // Any breath spent (a search, a step, something used) presses the bar for a second; so does being refused for want of one.
      const bn = save.breathNow, refused = bn === 0 && save.log !== seenLog && /out of breath|catches her breath|needs a moment/.test(save.log || "");
      if (typeof bn === "number") { if ((seenBreath !== null && bn < seenBreath) || refused) squeeze(); seenBreath = bn; }
      seenLog = save.log;
      if (Date.now() < squeezeUntil) save.squeeze = true;      // (only for this frame: never saved)
      const html = colorize(SMT.renderScreen(save, beatLine1 || extraToShow())); delete save.squeeze;
      document.getElementById("screen").innerHTML = html;
      exTick(true);                                // the exchange's screen, if she faces one, fills in at once
    }
    catch (err) {                                  // never freeze on a bad frame: say so, and keep the keys working
      console.error(err);
      document.getElementById("screen").textContent = "The screen could not be drawn. [R] begins a new run, [P] restores a password.";
    }
    // While the infinite-steps cheat is on, the line under the screen shows the room and the counters.
    document.getElementById("cheat").textContent = save.freeSteps ? RULES.debugInfo(save) : "";
    document.getElementById("ver").textContent = SMT.VERSION;
  }

  // Every player's run lives in their own browser and saves itself after every action.
  // (The repo's save.json is the chat run, played with /smt-screen; the page doesn't touch it.)
  const KEY = "daily-dungeon-run";
  let statusUntil = 0;
  function flashStatus() { statusUntil = Date.now() + 4000; setTimeout(draw, 4100); }
  const hstDate = () => SMT.localISO(save && save.tz);

  // The adventure log: every line that starts with "Day N." (steps, searches, new days, descents).
  function remember(before) {
    // Everything the player reads goes in the log: the day's omen (once), line 2 (every action, even a
    // repeat), what happened in a fight or a talk (the box lines), and line 3 when it changes.
    // Hidden numbers never go in. Follow-up lines are indented under the action they belong to.
    if (!save) return;
    const h = save.history = save.history || [];
    const stamp = "D" + String(save.day).padStart(3, "0") + " T" + String(save.steps || 0).padStart(3, "0") + "  ";
    const clean = t => String(t || "").replace(/^> /, "").replace(/^Day \d+\. /, "");
    const mem = save.logged = save.logged || {};
    if (save.omenText && save.omenText !== mem.omen) { mem.omen = save.omenText; h.push(stamp + "OMEN " + save.omenText.replace(/^> /, "")); }
    if (save.status && save.status !== mem.status) { mem.status = save.status; h.push(stamp + "STATUS " + clean(save.status)); }
    if (save.log && save.log !== before) h.push(stamp + clean(save.log));
    const round = JSON.stringify(save.round || []);
    if (save.round && save.round.length && round !== mem.round) save.round.forEach(l => h.push("            | " + l));
    mem.round = round;
    if (save.extra && save.extra !== mem.extra) h.push("            " + save.extra);
    mem.extra = save.extra;
    // About 70 bytes an entry: 20,000 entries is roughly 1.4 MB, well inside a browser's storage.
    if (h.length > 20000) h.splice(0, h.length - 20000);
  }

  // AMBIENT EVENTS: the rules leave tags on save.events (see rules.js); each is sent to the Worker once, quietly,
  // and forgotten whether or not it arrives. Never while the testing cheat is on.
  // SOMEONE IS HERE: a device with a living run tells the Worker so (a random id, and the level). Nothing personal,
  // and nothing while the testing cheat is on. Two kinds of ping, the same row on the Worker:
  //  - daily: the first save of each day, as before ("players seen", "in the pit today");
  //  - live: while a run is on screen, the tab is visible and a key or click came in the last 10 minutes, one every
  //    3 minutes (the Worker rewrites the row at most every 2). A hidden tab, the title or an idle player sends nothing.
  const LIVE_EVERY = 180000, LIVE_IDLE = 600000;
  // The Worker answers each ping with who is here right now (counts by level, bots left out): kept in liveNow for the typed line.
  let lastInput = Date.now(), lastLive = 0, liveNow = null;
  const hereOk = () => !!(LEADERBOARD_URL && save && save.dungeon && !save.dead && !save.freeSteps && !save.cheated);
  function sendHere() {
    let id = localStorage.getItem("ddd.device");
    if (!id) { id = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join(""); localStorage.setItem("ddd.device", id); }
    localStorage.setItem("ddd.here", SMT.localISO(save.tz));
    fetch(LEADERBOARD_URL + "/here", { method: "POST", keepalive: true, headers: { "content-type": "application/json" }, body: JSON.stringify({ id, level: save.height || 1 }) })
      .then(r => r.ok ? r.json() : null).then(d => { if (d && d.now && Array.isArray(d.now.levels)) liveNow = { at: Date.now(), ...d.now }; }).catch(() => {});
  }
  function pingHere() {
    try {
      if (!hereOk() || localStorage.getItem("ddd.here") === SMT.localISO(save.tz)) return;
      sendHere();
    } catch (e) {}
  }
  function pingLive() {
    try {
      const t = Date.now();
      if (atTitle || document.hidden || !hereOk() || t - lastInput > LIVE_IDLE || t - lastLive < LIVE_EVERY) return;
      lastLive = t; sendHere();
    } catch (e) {}
  }
  // THE EXCHANGE (v1.00): trading RARE, MYTHIC and MOON things with other players (the Worker's /eco/, see worker.js).
  // THE KEY is the player's economy identity: a long random key kept in this browser ("ddd.key") and copied into every
  // run, so the run's password carries it. Loading a password with another key switches this browser to that key.
  // FINDS: when a RARE, MYTHIC or MOON thing lands in the bag, the Worker is told at once and decides whether it
  // counts (its own daily limits; MOON only near full moon). A MOON thing it counts goes to the stash right away
  // and leaves the bag. Nothing here is sent from a run that used the testing tools.
  const ECO_TIERS = ["RARE", "MYTHIC", "MOON"];
  const ecoTradeable = n => ECO_TIERS.includes(RULES.tierOf(n));
  function ecoKey() {
    let k = null; try { k = localStorage.getItem("ddd.key"); } catch (e) {}
    if (!k || !/^[a-z0-9]{32,80}$/.test(k)) {
      k = Array.from(crypto.getRandomValues(new Uint8Array(24)), b => b.toString(16).padStart(2, "0")).join("");
      try { localStorage.setItem("ddd.key", k); } catch (e) {}
    }
    return k;
  }
  const ecoOk = () => !!(LEADERBOARD_URL && save && save.dungeon && !save.dead && !save.freeSteps && !save.cheated && save.runId);
  async function ecoFetch(path, body) {
    const h = { "content-type": "application/json", "x-key": (save && save.key) || ecoKey() };
    if (adminOK) { try { const a = localStorage.getItem("dd-admin"); if (a) h["x-admin-key"] = a; } catch (e) {} }
    const r = await fetch(LEADERBOARD_URL + "/eco/" + path, body ? { method: "POST", headers: h, body: JSON.stringify({ run: save && save.runId, ...body }) } : { headers: h });
    let d = null; try { d = await r.json(); } catch (e) {}
    return d || { error: "net" };
  }
  // A thing given to the bag by the exchange (bought, sent back, taken from the stash): never reported as a find.
  function ecoGive(name) { save.items = save.items || []; save.items.push(name); (save.ecoSeen = save.ecoSeen || []).push(name); }
  function ecoTake(name) { const i = (save.items || []).indexOf(name); if (i >= 0) save.items.splice(i, 1); const j = (save.ecoSeen || []).indexOf(name); if (j >= 0) save.ecoSeen.splice(j, 1); }
  // Run on every save: keep the key in the run, notice new tradeable things, and tell the Worker when the run ends.
  function ecoScan() {
    if (!save || !save.dungeon) return;
    const dev = ecoKey();
    if (!save.key) save.key = dev;
    else if (save.key !== dev) { try { localStorage.setItem("ddd.key", save.key); } catch (e) {} }   // a loaded password's key becomes this browser's
    const mine = (save.items || []).filter(ecoTradeable);
    if (save.ecoRun !== save.runId) { save.ecoRun = save.runId; save.ecoSeen = mine.slice(); return; }   // a new run counts from what it starts with
    const left = (save.ecoSeen || []).slice(), fresh = [];
    for (const n of mine) { const i = left.indexOf(n); if (i >= 0) left.splice(i, 1); else fresh.push(n); }
    save.ecoSeen = mine.slice();
    if (save.dead && !save.ecoEnded && LEADERBOARD_URL && !save.cheated && !save.freeSteps) { save.ecoEnded = true; ecoFetch("end", {}).catch(() => {}); }
    if (!ecoOk() || !RULES.EXCHANGE_ON) return;      // v1.04: the exchange is parked; finds stay in the bag
    // v1.01: the Worker rolls its own dice for WHICH thing of that tier it is. If it picked another, the bag's copy
    // (and the log line that named it) takes the Worker's name. The found box waits a moment for this (foundBox).
    for (const n of fresh) ecoWait.push(ecoFetch("find", { name: n }).then(d => {
      if (!d || !d.ok || !save) return;
      const got = d.name || n;
      if (d.stash) {
        ecoTake(n); ecoStashed.push(got);
        save.log = `> ${got.charAt(0).toUpperCase() + got.slice(1)} goes to the stash. The exchange screens keep it.`;
      } else if (got !== n) {
        const i = save.items.lastIndexOf(n); if (i >= 0) save.items[i] = got;
        const j = (save.ecoSeen || []).lastIndexOf(n); if (j >= 0) save.ecoSeen[j] = got;
        if (save.log) save.log = save.log.split(n).join(got);

    }).catch(() => {}));
  }
  let ecoWait = [], ecoStashed = [];
  function flushEvents() {
    ecoScan();
    pingHere();

    const list = save.events; delete save.events;
    if (!LEADERBOARD_URL || save.freeSteps || save.cheated) return;
    for (const e of list.slice(-4)) try { fetch(LEADERBOARD_URL + "/event", { method: "POST", keepalive: true, headers: { "content-type": "application/json" }, body: JSON.stringify(e) }).catch(() => {}); } catch (err) {}
  }
  // TESTING CHEATS (X: infinite steps, Shift+X: a day ahead) first ask for the admin key. The Worker checks it
  // (GET /admin); the page keeps a right key in localStorage ("dd-admin", the same one the board's delete uses) and
  // asks the Worker again once per page load. A wrong or missing key leaves the keys doing nothing.
  // A run that ever used a cheat is marked (`cheated`): it can't post a score and sends no events or presence.
  let adminOK = false, gating = false;
  async function adminGate() {
    if (adminOK) return true;
    if (!LEADERBOARD_URL) return false;
    const ask = async k => { try { return (await fetch(LEADERBOARD_URL + "/admin", { headers: { "x-admin-key": k } })).ok; } catch (e) { return null; } };   // null: no answer
    let key = ""; try { key = localStorage.getItem("dd-admin") || ""; } catch (e) {}
    let ok = key ? await ask(key) : false;
    if (ok === null) { alert("Could not reach the board."); return false; }
    if (!ok) {
      try { localStorage.removeItem("dd-admin"); } catch (e) {}
      key = prompt("Admin key:") || ""; if (!key) return false;
      ok = await ask(key);
      if (ok === null) { alert("Could not reach the board."); return false; }
      if (!ok) { alert("That key was not accepted."); return false; }
      try { localStorage.setItem("dd-admin", key); } catch (e) {}
    }
    return adminOK = true;
  }
  function sweepCheats() {
    if (!save || adminOK || !(save.freeSteps || save.clockOffset)) return;
    if (save.freeSteps) delete save.freeSteps;          // left over from before: switch it off and mark the run
    save.cheated = true; persist();
  }
  function persist() {
    flushEvents();
    try {
      delete save.unsaved;
      save.saved = hstDate();
      localStorage.setItem(KEY, JSON.stringify(save));
    } catch (e) {
      save.unsaved = true;   // private window or storage blocked: play still works, it just won't last
    }
    flashStatus();
  }

  // Catch up with the real date (a new day, or a missed deadline), then save.
  function tick() {
    if (!save) return;
    sweepCheats();
    const before = JSON.stringify(save), log = save.log;
    save = RULES.tick(save);
    if (JSON.stringify(save) !== before) { remember(log); persist(); }
    endLog();
  }
  // When the run ends (KURA falls, or a deadline passes), the log opens once by itself,
  // after any fight box has been closed.
  function endLog() {
    if (!save || !save.dead || save.endShown || !document.getElementById("found").hidden) return;
    save.endShown = true; persist();
    setTimeout(() => { if (save && save.dead && document.getElementById("found").hidden) toggleLog(true); }, 300);
  }

  // Before anything reads the clock, ask the server for the real time (the Date on its reply to a
  // quick HEAD request for this page). The device clock is used only if that fails or takes over 3s.
  async function syncTime() {
    try {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 3000);
      const t0 = Date.now();
      const r = await fetch(location.href, { method: "HEAD", cache: "no-store", signal: ctl.signal });
      clearTimeout(timer);
      const server = Date.parse(r.headers.get("Date") || "");
      const age = Number(r.headers.get("Age")) || 0;                 // a cache (CDN) says how old its copy is
      if (!isNaN(server)) SMT.setSkew(server + age * 1000 + 500 - (t0 + Date.now()) / 2);   // the header is whole seconds
    } catch (e) {}
  }
  // The leaderboard's address (the Cloudflare Worker, see leaderboard/README.md). Empty: every board button stays hidden.
  const LEADERBOARD_URL = "https://daily-dungeon-board.ddddungeon.workers.dev";
  async function start() {
    document.getElementById("ver").textContent = SMT.VERSION;
    await syncTime();
    let s = null, raw = null;
    const stash = suffix => { try { if (raw) localStorage.setItem(KEY + suffix, raw); } catch (e) {} };   // keep what we can't use, never just overwrite it
    try { raw = localStorage.getItem(KEY); s = JSON.parse(raw || "null"); } catch (e) { stash("-corrupt"); s = null; }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => window.dispatchEvent(new Event("resize")));   // popups are placed by measuring the font
    // The title screen shows first either way (CONTINUE is the explicit resume now); this only decides
    // whether CONTINUE has anything to resume. tick()/draw() wait for that button, same for a fresh save.
    if (s && s.dungeon && s.dungeon.floor && s.dungeon.floor.v === 11 && s.party) save = s;
    else { if (s) stash("-old"); save = null; }
    sweepCheats();
    showTitle();
  }

  // TITLE SCREEN -----------------------------------------------------------------------------------
  const titleCanContinue = () => !!(save && save.dungeon && save.dungeon.floor && save.dungeon.floor.v === 11 && save.party);
  // The three hard-number cards that cost nothing new (Part 11, build-order note): today's shared omen
  // needs no save at all, and the other two just read the leaderboard's existing endpoints.
  // RUMOR CARDS: each ambient event the Worker has kept becomes one vague line. It refers to a moment without
  // quoting the game's own text, except a demon's last words, which are quoted and never attributed.
  const RUMORS = {
    out: ["Someone climbed out, into open air.", "Someone reached the surface tonight."],
    refused: ["A demon rejected a traveler's paltry gift.", "A gift was thrown back.", "Something was offered. It was not enough.", "A demon looked at a gift, and laughed."],
    asked: ["Someone was asked if they trust the dark.", "A demon asked a question, and waited.", "A question was put to a traveler, in the dark.", "Something wanted an honest answer."],
    restored: ["A corrupted voice turned, and was made whole again.", "A broken name was mended tonight.", "Something damaged was talked back to itself."],
    trickster: ["Something ran off laughing, gift in hand.", "A gift was taken. The taker did not stay.", "Laughter, going away down a hall."],
    altar: ["An altar considered an offering, and was pleased.", "A screen in a wall glowed a little warmer.", "Something was fed, and said thank you."],
    joined: ["A stranger walked in, and stayed.", "A pact was made in the dark.", "Two walked on where one had come.", "Something old took a traveler's side."],
    silent: ["Silence, offered instead of an answer.", "A traveler said nothing at all.", "A question went unanswered. On purpose."],
    deep: ["A wall gave up its secret, after many tries.", "Something very old came out of the stone.", "Patience was rewarded, for once."],
    left: ["Someone walked out, and did not look back.", "A pact ended badly.", "One fewer set of footsteps, somewhere below."],
    fall: ["Someone fell. The dark closed over them.", "A light went out, somewhere below.", "A run ended tonight. The dungeon noticed."],
  };
  // `mine` (a level's height): the ticker's version, which puts news from that level first and says where each
  // thing happened. The title's cards (no argument) stay as they were.
  const LEVEL = h => (h <= 4 ? `B${5 - h}F` : `${h - 4}F`);
  function rumorCards(mine) {
    const out = [], seen = new Set();
    const list = mine ? titleEvents.slice().sort((x, y) => (y.lv === mine) - (x.lv === mine)) : titleEvents;
    for (const e of list) {
      let line = null;
      if (e.t === "words") { const w = RULES.lastWordsList[e.v]; if (w) line = `${["The dungeon whispered", "From below", "A voice, going out", "Somewhere, the last thing said"][(e.made || 0) % 4]}, "${w}"`; }
      else if (RUMORS[e.t]) line = RUMORS[e.t][((e.made || 0) + out.length) % RUMORS[e.t].length];   // which wording: steady for one event, varied across the feed
      if (line && mine && e.lv) {
        if (e.t === "fall" && e.dm) line = `${/^[AEIOU]/.test(e.dm) ? "An" : "A"} ${e.dm} struck a traveler down.`;
        line = `${e.lv === mine ? "On this level" : "On " + LEVEL(e.lv)}${e.d ? ", day " + e.d : ""}: ${line}`;
      }
      if (line && !seen.has(line)) { seen.add(line); out.push(line); }
      if (out.length >= (mine ? 12 : 8)) break;
    }
    return out;
  }
  // Numbers and rumors share the feed: never more than two of one kind in a row while both last.
  // The exchange in the feed (v1.00): the newest public offers and the latest trades, nobody named, no bots.
  function marketCards() {
    const m = titleStats && titleStats.market, out = [];
    if (!m || !RULES.EXCHANGE_ON) return out;          // parked since v1.04
    const asks = w => (!w ? "free" : w.startsWith("tier:") ? "for any " + w.slice(5) : "for " + w.slice(5));
    for (const o of m.open || []) out.push(`MARKET: ${o.name}, ${asks(o.wants)}. Code ${o.code}`);
    for (const t of m.traded || []) out.push(t.paid ? `Traded: ${t.name}, for ${t.paid}` : `Given away: ${t.name}`);
    return out;
  }
  function buildTitleCards() {
    const nums = numberCards(), rum = [...marketCards(), ...rumorCards()], cards = [];
    worldLines = rum.slice();           // the rumors (what other players' runs left behind) also ride the in-game ticker
    while (nums.length || rum.length) { cards.push(...nums.splice(0, rum.length ? 2 : nums.length)); if (rum.length) cards.push(rum.shift()); }
    return cards;
  }
  // WHO IS HERE, in words, for the typed line during a run (the title's cards stay short and plain, like the other
  // numbers). Counts only, never who or where. Small numbers are spelled out; each line has a few wordings, one for a
  // single person and one for more, and which one shows turns over every ten minutes.
  // say(n, one, many): one and many are lists of wordings; many's take the number as a word.
  const NUMW = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve"];
  const numWord = n => (n < NUMW.length ? NUMW[n] : n.toLocaleString("en-US"));
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const say = (n, one, many) => { const list = n === 1 ? one : many, l = list[(n + Math.floor(Date.now() / 600000)) % list.length]; return cap(typeof l === "function" ? l(numWord(n)) : l); };
  const PRESENCE = {
    // The others on her own level (her own device is not counted): right now (seen in the last 5 minutes; no bots), and today.
    nowMine: [["Someone else is on this level with you.", l => `One other is somewhere on ${l}, right now.`, "Footsteps that aren't yours, somewhere on this level.", "You are not alone down here."],
      [w => `${w} others are on this level with you.`, (w, l) => `${w} others are somewhere on ${l}, right now.`, w => `Footsteps that aren't yours. ${cap(w)} others on this level.`, w => `You are not alone down here. ${cap(w)} others on this level.`]],
    todayMine: [["Someone else walked this level today.", l => `One other passed through ${l} today.`],
      [w => `${w} others have walked this level today.`, (w, l) => `${w} others passed through ${l} today.`]],
  };

  const presence = (kind, n, l) => { const [one, many] = PRESENCE[kind]; return say(n, one.map(f => typeof f === "function" ? () => f(l) : f), many.map(f => w => f(w, l))); };
  function numberCards() {
    const cards = [];
    if (titleLean) {
      const total = titleLean.law + titleLean.chaos;
      if (total) {
        const chaosPct = Math.round((titleLean.chaos / total) * 100);
        cards.push(titleLean.chaos === titleLean.law ? "Faction lean: EVEN"
          : `Faction lean: ${titleLean.chaos > titleLean.law ? "CHAOS " + chaosPct : "LAW " + (100 - chaosPct)}%`);
      }
    }
    if (titleDeep) cards.push(`Most levels climbed: ${titleDeep}`);
    // The running totals for this lunar epoch (the Worker's /stats): exact counts, nobody named. A card only
    // shows once its number is above zero, so a quiet epoch has a short feed, not a wall of zeroes.
    if (titleStats) {
      const c = titleStats.counts || {}, n = k => Number(c[k]) || 0, num = v => v.toLocaleString("en-US");
      if (titleStats.lastFall) {
        const mins = Math.max(0, Math.floor((SMT.now().getTime() / 1000 - titleStats.lastFall) / 60));
        const ago = mins < 1 ? "just now" : mins < 60 ? `${mins} min ago` : mins < 2880 ? `${Math.floor(mins / 60)} hour${mins < 120 ? "" : "s"} ago` : `${Math.floor(mins / 1440)} days ago`;
        cards.push(`Last fall: ${ago}`);
      }
      if (n("runs")) cards.push(`Runs ended: ${num(n("runs"))}`);
      // Who is here: devices with a living run, right now (seen in the last 5 minutes, no bots), this moon and in the
      // last day. Counts only, never who or where. Nothing shows at zero.
      const here = titleStats.here || {}, lvl = h => (h <= 4 ? `B${5 - h}F` : `${h - 4}F`), live = here.now || {};
      if (live.total) cards.push(`In the pit right now: ${num(live.total)}`);
      for (const x of (live.levels || []).slice(0, 4)) if (x.n) cards.push(`On ${lvl(x.level)} right now: ${num(x.n)}`);
      if (here.month) cards.push(`Players seen: ${num(here.month)}`);
      if (here.today) cards.push(`In the pit today: ${num(here.today)}`);
      for (const x of (here.levels || []).slice(0, 4)) if (x.n) cards.push(`On ${lvl(x.level)} today: ${num(x.n)}`);

      if (n("pacts")) cards.push(`Pacts that lasted: ${Math.round(100 * Math.max(0, n("pacts") - n("ended")) / n("pacts"))}%`);
      if (n("beaten")) cards.push(`Demons beaten: ${num(n("beaten"))}`);

      if (n("joined")) cards.push(`Demons joined: ${num(n("joined"))}`);
      if (titleStats.deadliest && titleStats.deadliest.name) cards.push(`Most falls: ${titleStats.deadliest.name}`);

      if (n("silver")) cards.push(`SILVER found: ${num(n("silver"))}`);
      if (n("rare")) cards.push(`Rare finds: ${num(n("rare"))}`);
      if (n("broken")) cards.push(`Items broken: ${num(n("broken"))}`);
      if (n("trips")) cards.push(`TRIPs reported: ${num(n("trips"))}`);
      if (n("wall")) cards.push(`Longest wall search: ${num(n("wall"))}x`);

    cards.push(RULES.omen(SMT.utcDay(SMT.now())).text.replace(/^> /, ""));

    try {
      const now = SMT.now(), Q = SMT.quarterOf(now), tz = SMT.zone(), days = d => Math.max(0, SMT.localDay(d, tz) - SMT.localDay(now, tz)), s = k => (k === 1 ? "" : "s");   // whole calendar days, as the LEVEL line counts them
      const left = days(Q.end);

    const code = save ? btoa(unescape(encodeURIComponent(JSON.stringify({ ...save, history: (save.history || []).slice(-300) })))) : "";

    const btn = (t, a) => { const e = document.createElement("span"); e.textContent = t; e.className = "btn"; e.dataset.pact = a; return e; };
    add("PASSWORD", "gold"); add(" ");
    let mine = null;
    if (save) { add("Copy it to keep this run or move it to another device."); add("It carries your key too: whoever has it has your stash."); mine = field(code, true); add(" "); }
    add("To continue a run, paste its password here.");
    const theirs = field("", false);
    const msg = add(" ");
    const row = document.createElement("div");

      }

      try {
        const s = JSON.parse(decodeURIComponent(escape(atob(got))));
        if (!s.dungeon || !s.party || !s.dungeon.floor || s.dungeon.floor.v !== 11) throw new Error("not a run");   // the same shape start() accepts
        const trial = JSON.parse(JSON.stringify(s)); RULES.tick(trial); SMT.renderScreen(trial, "");      // it must really run, not just parse
        loadCode = s;

  function exKey(e, key) {

  function altarBox() {

      if (x.dataset.x === "want") { ex.make.want = (ex.make.want + 1) % EX_WANTS.length; return showExchange(true); }
      if (x.dataset.x === "pub") { ex.make.pub = !ex.make.pub; return showExchange(true); }
      return exAct(x.dataset.x);
    }
    if (line) { const i = Number(line.dataset.i); if (i === ex.sel) return exAct("go"); ex.sel = i; return showExchange(true); }
  });
  // Clicking an item chooses it; clicking the chosen one again uses it. Only [C]LOSE, I or Esc closes it.
  document.getElementById("inv").addEventListener("click", e => {
    if (e.target.closest("[data-use]")) return useInv(invSel);
    if (e.target.closest("[data-close]")) { showInv(false); if (save && save.encounter) encounterBox(); return; }
    if (e.target.closest("[data-codex]")) { showInv(false); codexSel = -1; return showCodex(true); }
    if (e.target.closest("[data-hold]")) return holdAction();
    const line = e.target.closest("[data-i]");
    if (ichorPick >= 0) { if (!line) { ichorPick = -1; return showInv(true); } const n = Number(line.dataset.i); if (n === ichorPick) return useInv(invSel, n || "0"); ichorPick = n; return showInv(true); }
    if (!line) { showInv(false); if (save && save.encounter) encounterBox(); return; }   // any other click closes, same as [C]LOSE
    const i = Number(line.dataset.i);
    if (i === invSel) useInv(i); else { invSel = i; showInv(true); }
  });
  document.getElementById("codex").addEventListener("click", e => {
    const tab = e.target.closest("[data-tab]"), line = e.target.closest("[data-i]");
    if (tab) { codexTab = tab.dataset.tab; codexSel = -1; showCodex(true); }
    else if (line) { codexSel = Number(line.dataset.i); showCodex(true); }
    else showCodex(false);     // [C]LOSE, Esc, or any other click on the page
  });
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const key = e.key.toLowerCase();
    if (e.target && e.target.tagName === "INPUT") { if (key === "enter") { e.preventDefault(); confirmName(); } return; }   // typing the name
    if (!atTitle && needsName()) { const i = document.getElementById("playername"); if (i) i.focus(); if (key === "enter") confirmName(); return; }   // nothing else works until the run has a name
    const fbox = document.getElementById("found");
    if (!fbox.hidden && fbox.dataset.mode === "intro") { e.preventDefault(); if (e.repeat) return; if (key === "enter") introOK(); else { const k = { f: "fight", t: "talk", a: "aura", r: "run" }[key]; if (k) introGo(k); } return; }
    if (!fbox.hidden && fbox.dataset.mode === "pass") { if (key === "escape") passAct("close"); return; }   // typing and pasting go to the fields
    if (!fbox.hidden) {
      if (!/^(tab|f\d+)$/.test(key)) e.preventDefault();
      if (e.repeat) return;                        // holding a key can't answer a box
      if (fbox.dataset.mode === "confirm") {
        answerConfirm(key === "enter" || key === "y" || (key === "arrowup" && !!armed));     // anything else is NO
        return;
      }
      if (fbox.dataset.mode === "altar") {
        const A = save.altar || {};
        let k;
        const speaking = !A.result && !A.used && A.script && A.page < A.script.length - 1;
        if (speaking) k = { enter: "altar-next", " ": "altar-next", escape: "altar-none", b: "altar-none" }[key];
        else if (A.result || A.used) k = { enter: "altar-none", " ": "altar-none", escape: "altar-none", b: "altar-none" }[key];
        else k = /^[1-6]$/.test(key) ? "altar-" + (Number(key) - 1) : { b: "altar-none", escape: "altar-none" }[key];
        if (k) act(k);
        return;
      }
      if (fbox.dataset.mode === "encounter" && replayAdvance && (key === "enter" || key === " ")) { e.preventDefault(); replayAdvance(); return; }
      if (fbox.dataset.mode === "encounter") {
        const st2 = save.encounter && save.encounter.stage;
        let k;
        if (st2 === "gift") k = /^[1-8]$/.test(key) ? "give-" + (Number(key) - 1) : { n: "give-none", b: save.encounter.fromChat ? "give-none" : null, escape: "give-none" }[key];
        else if (st2 === "offer") k = /^[1-8]$/.test(key) ? "offer-" + (Number(key) - 1) : { b: "offer-none", n: "offer-none", escape: "offer-none" }[key];
        else if (st2 === "chat") k = { y: "yes", enter: "yes", n: "no", s: "silent", escape: "no", b: "behold" }[key];
        else if (st2 === "want") k = { y: "yes", n: "no", escape: "no" }[key];
        else if (st2 === "pick") k = /^[1-8]$/.test(key) ? "pick-" + (Number(key) - 1) : { b: "pick-none", escape: "pick-none" }[key];
        else if (st2 === "ask" || st2 === "join") k = { y: "yes", enter: "yes", n: "no", escape: "no" }[key];
        else if (st2 === "swap") k = { "2": "swap-1", "3": "swap-2", "4": "swap-3", n: "swap-none", escape: "swap-none" }[key];
        else k = { f: "fight", t: "talk", a: "aura", i: "invoke", r: "run", b: save.encounter.angered ? "behold" : null }[key];
        if (k) act(k);
      } else if (fbox.dataset.mode === "found" || fbox.dataset.mode === "done") { if (key === "enter") closeFound(); }   // a find only closes on its [ OK ] (Enter or a click), never by a stray key
      else if (key === "enter" || key === " " || key === "escape") closeFound();
      return;
    }
    if (!document.getElementById("about").hidden) {
      e.preventDefault();
      if (key === "?" || key === "escape") showAbout(false);
      else if (key === "c") { showAbout(false); codexSel = -1; showCodex(true); }
      else if (key === "b" && LEADERBOARD_URL) { showAbout(false); toggleBoard(true); }
      return;
    }
    if (!document.getElementById("codex").hidden) {
      e.preventDefault();
      if (key === "c" || key === "escape") showCodex(false);
      else if (key === "d" || key === "i") { codexTab = key === "d" ? "demons" : "items"; codexSel = -1; showCodex(true); }
      else if (key === "arrowdown" || key === "arrowup") { codexSel += key === "arrowdown" ? 1 : -1; showCodex(true); }
      else if (key === "arrowleft" || key === "arrowright") { codexTab = codexTab === "demons" ? "items" : "demons"; codexSel = -1; showCodex(true); }
      return;
    }
    if (exOpen()) { if (document.activeElement && document.activeElement.id === "excode") return; return exKey(e, key); }
    if (!document.getElementById("inv").hidden) {
      if (ichorPick >= 0) {
        e.preventDefault();
        const n = save.party.length;
        if (key === "escape") ichorPick = -1;
        else if (key === "arrowdown" || key === "arrowup") ichorPick = (ichorPick + (key === "arrowdown" ? 1 : n - 1)) % n;
        else if (/^[1-9]$/.test(key) && Number(key) <= n) ichorPick = Number(key) - 1;
        else if (key === "enter") return useInv(invSel, ichorPick || "0");
        return showInv(true);
      }
      if (key === "i" || key === "c" || key === "escape") { e.preventDefault(); showInv(false); if (save && save.encounter) encounterBox(); }
      else if (key === "h") { e.preventDefault(); holdAction(); }
      else if (/^[1-9]$/.test(key)) { e.preventDefault(); invSel = Number(key) - 1; showInv(true); }
      else if (key === "arrowdown" || key === "arrowup") { e.preventDefault(); invSel += key === "arrowdown" ? 1 : -1; showInv(true); }
      else if (key === "enter") { e.preventDefault(); useInv(invSel); }
      return;
    }
    if (!document.getElementById("board").hidden) {
      e.preventDefault();
      if (key === "c" || key === "b" || key === "escape") toggleBoard(false);
      else if (save && save.freeSteps && boardData && boardView === "board" && (key === "arrowdown" || key === "arrowup")) { boardSel = (boardSel + (key === "arrowdown" ? 1 : boardData.rows.length - 1)) % Math.max(1, boardData.rows.length); renderBoard(); }
      else if (key === "d" && save && save.freeSteps && boardView === "board") deleteEntry();
      else if (key === "h" && save && save.freeSteps) { if (boardView === "here") { boardView = "board"; boardData ? renderBoard() : loadBoard(); } else showPresence(); }
      return;
    }
    if (!document.getElementById("log").hidden) {
      if (key === "l" || key === "c" || key === "escape") { e.preventDefault(); toggleLog(false); }
      else if (key === "enter" || key === "p") { e.preventDefault(); submitScore(); }
      else if (key === "o") { e.preventDefault(); copyLog(document.querySelector("#log [data-copy]")); }
      else if (key === "d") { e.preventDefault(); downloadLog(); }
      return;
    }
    if (atTitle) {
      const a = { n: "title-new", c: "title-continue", b: "title-board", "?": "title-about" }[key];
      if (a) { e.preventDefault(); titleAction(a); }      // every other key (F5, Tab, F12...) is left to the browser
      return;
    }
    // S is SEARCH now; the day's step is [^] or the up arrow (the compass keys are gone with the NSEW buttons).
    if (save && save.question && (key === "y" || key === "n" || key === "s")) { e.preventDefault(); return act(key === "y" ? "qyes" : key === "n" ? "qno" : "qsilent"); }
    const k = { "?": "about", c: "codex", f: "fight", t: "talk", i: "invoke", l: "log", b: "board", p: "backup", r: "reset",
      s: "search", g: "altar", m: "look", arrowdown: save && save.look ? "look" : null, arrowup: "forward", arrowleft: "left", arrowright: "right" }[key];
    if (key === "x") {   // testing cheats, behind the admin key: X toggles infinite steps, Shift+X jumps a day
      e.preventDefault(); if (gating) return;
      const shift = e.shiftKey; gating = true;
      adminGate().then(ok => { gating = false; if (ok) act(shift ? "next" : "freesteps"); }, () => { gating = false; });
      return;
    }
    if (k) { e.preventDefault(); RULES.holding(e.repeat); try { act(k); } finally { RULES.holding(false); } }
  });

  start();
  // Live clock: redraw the moment the minute turns over (the colon blinks on its own),
  // and catch up with the real date so midnight brings the new day.
  let shownMinute = SMT.now().getMinutes();
  // The moon strip opens again as KURA gets her breath back: redraw when the count changes.
  setInterval(() => {
    if (atTitle || !save || !save.dungeon || save.breathNow === undefined) return;
    const n = RULES.breath(save);
    if (n !== save.breathNow) { save.breathNow = n; draw(); }
  }, 250);
  // Live presence (see pingHere): any key or click counts as being here; check every 30 seconds, and as the tab comes back.
  const touched = () => { lastInput = Date.now(); };
  document.addEventListener("keydown", touched, true);
  document.addEventListener("pointerdown", touched, true);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pingLive(); });
  setInterval(pingLive, 30000);
  setInterval(() => {
    const m = SMT.now().getMinutes();
    if (m !== shownMinute && !searchBeat) { shownMinute = m; if (!atTitle) tick(); draw(); }   // on the title, only the title redraws; the run waits for CONTINUE
  }, 1000);
</script>
</body>
</html>
