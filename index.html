<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Dungeon</title>
<style>
  /* VT323, self-hosted (fonts/OFL.txt has its license). */
  @font-face { font-family: "VT323"; src: url("fonts/VT323-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
  :root {
    --bg: #07090a;
    --fg: #e4e4df;
    --dim: #4f5d52;
    --trail: #8f8f8a;
    --bright: #ffffff;
    --demon: #e0564a;
    --gold: #e3b341;
    --moon: #9fc4ff;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    font-family: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  .frame { max-width: 100%; overflow-x: auto; }
  pre {
    margin: 0; font-family: inherit; line-height: 1.05;
    font-size: clamp(6px, calc((100vw - 32px) / 49), 22px); white-space: pre;
    text-shadow: 0 0 4px rgba(228, 228, 223, 0.2);
  }
  .you { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .demon { color: var(--demon); }
  .gold { color: var(--gold); }
  .visited { color: var(--dim); }
  .moon { color: var(--moon); }
  /* The clock's colon blinks slowly (1s on, 1s off); hidden, it still keeps its space. */
  .colon { animation: blink 2s steps(1) infinite; }
  /* The weekday kanji takes exactly two character cells, so the frame stays straight. */
  /* Like .cell: the box keeps the screen font so 2ch is two grid cells; only the glyph switches font. */
  .kanji { display: inline-block; width: 2ch; text-align: center; overflow: visible; white-space: nowrap; }
  .kanji .g { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "MS Gothic", sans-serif; line-height: 0; }
  @keyframes blink { 50% { visibility: hidden; } }
  .stairs { color: var(--moon); }
  .goal { color: var(--gold); text-shadow: 0 0 6px var(--gold); }
  /* Map symbols like □ ⋰ ⋱ ↑ ↓ can be wider or narrower than letters in some fonts.
     Boxing each one to exactly one character keeps the grid lined up. */
  /* .cell keeps the screen's own font so 1ch equals exactly one character of the grid;
     only the glyph inside it switches to a font that has the symbol. */
  .cell { display: inline-block; width: 1ch; text-align: center; overflow: visible; white-space: nowrap; }
  /* The moon strip: shorter blocks, so the row is not taller than its neighbours. */
  .ph .g { display: inline-block; transform: scale(1.3, 0.62); }
  .cell .g { font-family: "DejaVu Sans Mono", Menlo, Consolas, "Segoe UI Symbol", monospace; line-height: 0; }
  .room { color: var(--trail); }
  .door { color: var(--trail); }
  .btn { cursor: pointer; color: var(--bright); }
  .btn:hover { background: var(--fg); color: var(--bg); }
  .btn.off { color: var(--dim); }
  .btn.armed { background: var(--gold); color: var(--bg); }
  .btn.flee { color: var(--bright); animation: blink 1.2s steps(1) infinite; }
  .runlabel.flash { animation: blink 1.2s steps(1) infinite; }
  .runlabel { color: var(--bright); text-shadow: 0 0 1px var(--bright); }
  .unsaved { color: var(--gold); }
  .frame { position: relative; }
  .logview { position: absolute; inset: 0; background: rgba(7, 9, 10, 0.96); overflow: auto; cursor: pointer;
    border: 1px solid var(--trail); box-sizing: border-box; padding: 1.5em 2ch; }
  .logview pre { white-space: pre-wrap; }
  .logview .sel { color: var(--bright); }
  /* INVOKE opens inside the 3D view (rows 6-22, columns 1-47); placeInView() sizes it to that area. */
  .viewpop { position: absolute; background: var(--bg); overflow: auto; cursor: pointer; box-sizing: border-box;
    outline: 1px solid var(--trail); }
  .viewpop pre { white-space: pre; }
  .logview .dim { color: var(--trail); }
  .foundbox { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); background: var(--bg);
    border: 1px solid var(--gold); padding: 1em 3ch; cursor: pointer; box-shadow: 0 0 24px rgba(227, 179, 65, 0.25); }
  .foundbox pre { white-space: pre; text-align: center; }
  .foundbox .gold { color: var(--gold); }
  /* The fight box sits inside the 3D view (rows 6-20, columns 1-47), like the bag, so the party and map stay in sight. */
  .foundbox.inframe { left: auto; top: auto; transform: none; border: none; outline: 1px solid var(--trail); box-shadow: none;
    box-sizing: border-box; overflow: hidden; cursor: default; }
  .foundbox.inframe pre { text-align: left; }
  .foundbox.inframe .brow { display: flex; justify-content: space-between; }
  .foundbox .artframe { color: var(--trail); }
  .foundbox .arrow { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  /* Rarity colors, Diablo-style. */
  .lit { color: var(--moon); text-shadow: 0 0 6px var(--moon); animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.55; text-shadow: 0 0 2px var(--moon); } }
  .mframe { color: var(--trail); }
  .logline { display: inline-block; width: 78ch; overflow: hidden; vertical-align: top; white-space: pre; }
  .logline.q { width: 55ch; }
  .qcell { display: inline-block; white-space: pre; vertical-align: top; }
  /* The build number, small, under the screen's lower right corner. */
  .ver { text-align: right; font-size: 12px; color: var(--trail); padding: 2px 1ch 0 0; letter-spacing: 0.05em; }
  /* The day's one step: drawn bigger than the other buttons (scaled in place, so the grid doesn't move). */
  .step { color: var(--bright); display: inline-block; transform: scale(1.6); transform-origin: center 60%;
    font-weight: bold; }
  /* Spent (or a wall ahead): a dark blue, no glow. */
  .btn.step.off { color: #111829; text-shadow: none; }   /* the dark blue, 60% toward black */
  .ask { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .pull { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .t-ICHOR { color: var(--demon); }
  .t-COMMON { color: var(--fg); } .t-UNCOMMON { color: #7bd88f; } .t-RARE { color: #6aa9ff; }
  .t-MYTHIC { color: var(--gold); text-shadow: 0 0 6px var(--gold); } .t-MOON { color: #dfe9ff; text-shadow: 0 0 8px #9fc4ff; }
  .foundbox .demon { color: var(--demon); }
  .facing { color: var(--bright); }
  .saved { color: var(--fg); }
</style>
</head>
<body>
  <div class="frame"><pre id="screen">LOADING...</pre>
    <div id="log" class="logview" hidden><pre></pre></div>
    <div id="inv" class="viewpop" hidden><pre></pre></div>
    <div id="codex" class="logview" hidden><pre></pre></div>
    <div id="about" class="logview" hidden><pre></pre></div>
    <div id="ver" class="ver"></div>
    <div id="found" class="foundbox" hidden><pre></pre></div></div>
<script src="screen.js"></script>
<script src="floor.js"></script>
<script src="rules.js"></script>
<script>
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let save = null;

  // In a fight with KURA facing a wall: the turn buttons flash, to find a way out (if there is one today).
  const fleeTurn = () => { if (!save || !save.encounter) return false; const can = RULES.available(save);
    return !can[save.facing] && ["N", "E", "S", "W"].some(d => can[d]); };
  // Color only the minimap rows (right panel) and the moon marker.
  function colorize(text) {
    const lines = text.split("\n");
    return lines.map((line, i) => {
      if (i >= 15 && i <= 19) {
        const left = esc(line.slice(0, 49)), right = line.slice(49);
        // [^] and [v] inside brackets are stairs; a bare ^ v < > next to @ is KURA's facing arrow.
        const map = right.replace(/\[[\^v]\]|[@^v<>&$?□=‖]/g, m => {
          if (m.length === 3) return "[" + `<span class="cell stairs">${m[1]}</span>` + "]";
          const ch = m;
          const cls = { "@": "you", "^": "you", "v": "you", "<": "you", ">": "you",
            "&": "demon", "$": "gold", "?": "goal", "□": "room", "=": "door", "‖": "door" }[ch];
          // Plain keyboard characters (? > < ^ v $ &) stay in the screen font;
          // only real Unicode symbols switch to the fallback symbol font.
          const inner = ch.charCodeAt(0) < 128 ? esc(ch) : `<span class="g">${esc(ch)}</span>`;
          return `<span class="cell ${cls}">${inner}</span>`;
        });
        return left + map;
      }
      // Turn controls under the 3D view (only the left 48 columns, so the map is never touched).
      if (i === 21 || i === 22) {
        const left = esc(line.slice(0, 48))
          .replace("[&lt;]", `<span class="btn${fleeTurn() ? " flee" : ""}" data-act="left">[&lt;]</span>`)
          .replace("[&gt;]", `<span class="btn${fleeTurn() ? " flee" : ""}" data-act="right">[&gt;]</span>`)
          // [^] takes the day's step forward; dim when that way is a wall or the step is spent.
          // In a fight, the ways out flash: [^] with RUN beside it if KURA faces an open way, otherwise the
          // turn buttons, to find one.
          .replace("[^]", `<span class="btn step${save && RULES.available(save)[save.facing] ? (save.encounter ? " flee" : "") : " off"}" data-act="forward">[^]</span>`)
          .replace(/ RUN/, m => save && save.encounter ? ` <span class="runlabel${RULES.available(save)[save.facing] ? " flash" : ""}">RUN</span>` : m)
          .replace(/(<\/span>)(\s+)([NESW?])(\s+)(<span)/, '$1$2<span class="facing">$3</span>$4$5');
        // The moon strip (row 21, right panel): each block glyph boxed to one cell, like the moon icon.
        const tail = esc(line.slice(48)).replace(/[░▒▓█]/g, ch => `<span class="cell ph"><span class="g">${ch}</span></span>`);
        return left + tail;
      }
      // The v over today's phase (row 20, right panel).
      if (i === 20) return esc(line.slice(0, 48)) + esc(line.slice(48)).replace(/\./, `<span class="cell" style="position:relative;left:${[2, 6].includes(SMT.moonIndex(SMT.now())) ? ".65ch" : ".15ch"}">.</span>`);
      // The block moon (rows 1-4): each box or shade glyph boxed to one cell; the lit part glows and breathes.
      const moonBox = t => t.replace(/[╭╮╰╯─│░▒▓█]/g, ch => `<span class="cell ${/[░▒▓█]/.test(ch) ? "lit" : "mframe"}"><span class="g">${ch}</span></span>`);
      if (i === 1) return moonBox(esc(line)).replace(/(\d\d):(\d\d)/, '$1<span class="colon">:</span>$2')
        .replace(/([日月火水木金土])/, '<span class="kanji"><span class="g">$1</span></span>');
      if (i === 2 || i === 3) return moonBox(esc(line));
      if (i === 4) return moonBox(esc(line)).replace("^^^", '<span class="moon">^^^</span>');
      // The three log lines: their text sits in a box exactly 78 cells wide, so the right border stays
      // straight even if a glyph in the font (an apostrophe, say) isn't exactly one cell wide.
      // Line 2 glows gold right after using an item.
      if (i >= lines.length - 6 && i <= lines.length - 4) {
        // With a question open, the right side holds [Y]ES | [N]O, each the full height of the box.
        if (save && save.question) {
          const k = i - (lines.length - 6), gold = k === 1 && logGlow;
          const cell = (t, act) => `<span class="btn ask qcell" data-act="${act}">${esc(t)}</span>`;
          const yes = ["          ", "  [Y]ES   ", "          "][k], no = ["           ", "   [N]O    ", "           "][k];
          return `|<span class="logline q${gold ? " gold" : ""}">${esc(line.slice(1, 56))}</span>|` + cell(yes, "qyes") + "|" + cell(no, "qno") + "|";
        }
        const inner = esc(line.slice(1, -1)), gold = i === lines.length - 5 && logGlow;
        return `|<span class="logline${gold ? " gold" : ""}">${inner}</span>|`;
      }
      if (i === lines.length - 2) {
        // Daily actions dim once used (or when there's no door that way).
        const can = save ? RULES.available(save) : {};
        const b = (txt, act, ok) => `<span class="btn${ok ? "" : " off"}" data-act="${act}">${txt}</span>`;
        return esc(line)
          .replace("[F]IGHT", '<span class="btn" data-act="fight">[F]IGHT</span>')
          .replace("[T]ALK", '<span class="btn" data-act="talk">[T]ALK</span>')
          .replace("[I]NVOKE", '<span class="btn" data-act="invoke">[I]NVOKE</span>')
          .replace("[S]EARCH", b("[S]EARCH", "search", can.search))
          .replace("STA[N]DBY", b("STA[N]DBY", "hold", can.hold))

          .replace(/\[([NSEW])\](ORTH|OUTH|AST|EST)/g, (m, x) =>
            b(m, "go-" + x, can[x]).replace('class="btn', 'class="btn' + (armed === x ? " armed" : save && save.encounter && can[x] ? " flee" : "")));
      }
      if (i === lines.length - 1) return esc(line)
        // SAVED / NOT SAVED shows for a few seconds after each action, then fades back into the border.
        .replace(/ (NOT SAVED|SAVED \d{4}-\d\d-\d\d) /, (m, t) => Date.now() < statusUntil
          ? ` <span class="${t === "NOT SAVED" ? "unsaved" : "saved"}">${t}</span> ` : "=".repeat(m.length))
        .replace("[C]ODEX", '<span class="btn" data-act="codex">[C]ODEX</span>')
        .replace("[?]", '<span class="btn" data-act="about">[?]</span>')
        .replace("[L]OG", '<span class="btn" data-act="log">[L]OG</span>')
        .replace("[R]ESET", '<span class="btn" data-act="reset">[R]ESET</span>');
      return esc(line);
    }).join("\n")
      // The ALIGN arrow (which way the last action pulled KURA) glows white.
      .replace(/ALIGN (&lt;|\[)(LAW|NEU|CHA)(&gt;|\])/, (m, l, t, r) => "ALIGN " +
        (l === "&lt;" ? '<span class="pull">&lt;</span>' : l) + t + (r === "&gt;" ? '<span class="pull">&gt;</span>' : r));
  }

  // Line 3 (voices, flavor, clues) stays put for at least 2 actions and 2 seconds before the next one replaces it,
  // so a quick run of clicks can't skip past it. Anything urgent (a warning, a hit, a new demon) takes over at once.
  // Only what's drawn is held: the save and the LOG still get every line.
  let heldExtra = null;                     // { text, steps, t }: the line on screen, and when it went up
  const EXTRA_URGENT = /closes tonight|GAME OVER|TRIPPING|comes down|-\d+ HP|appears|blocks the way|comes to see what broke|FALLS|calendar|joins the party/i;
  function extraToShow() {
    const want = save.extra || "", now = Date.now(), steps = save.steps || 0, h = heldExtra;
    const take = () => { if (!h || h.text !== want || steps < h.steps) heldExtra = { text: want, steps, t: now }; return want; };
    if (!h || steps < h.steps || want === h.text || save.dead || save.question || save.extraUrgent || EXTRA_URGENT.test(want)) return take();
    if (steps - h.steps >= 2 && now - h.t >= 2000) return take();
    if (steps - h.steps >= 2) setTimeout(draw, h.t + 2000 - now + 30);   // the turns are up: wait out the clock
    return h.text;
  }
  function draw() {
    if (!save) return;
    document.getElementById("screen").innerHTML = colorize(SMT.renderScreen(save, extraToShow()));
    // While the infinite-steps cheat is on, the line under the screen shows the room and the counters.
    document.getElementById("ver").textContent = (save.freeSteps ? RULES.debugInfo(save) + "   " : "") + SMT.VERSION;
  }

  // Every player's run lives in their own browser and saves itself after every action.
  // (The repo's save.json is the chat run, played with /smt-screen; the page doesn't touch it.)
  const KEY = "daily-dungeon-run";
  let statusUntil = 0;
  function flashStatus() { statusUntil = Date.now() + 4000; setTimeout(draw, 4100); }
  const hstDate = () => SMT.localISO(save && save.tz);

  // The adventure log: every line that starts with "Day N." (steps, searches, new days, descents).
  function remember(before) {
    // Everything the player reads goes in the log: the day's omen (once), line 2 (every action, even a
    // repeat), what happened in a fight or a talk (the box lines), and line 3 when it changes.
    // Hidden numbers never go in. Follow-up lines are indented under the action they belong to.
    if (!save) return;
    const h = save.history = save.history || [];
    const stamp = "D" + String(save.day).padStart(3, "0") + " T" + String(save.steps || 0).padStart(3, "0") + "  ";
    const clean = t => String(t || "").replace(/^> /, "").replace(/^Day \d+\. /, "");
    const mem = save.logged = save.logged || {};
    if (save.omenText && save.omenText !== mem.omen) { mem.omen = save.omenText; h.push(stamp + "OMEN " + save.omenText.replace(/^> /, "")); }
    if (save.status && save.status !== mem.status) { mem.status = save.status; h.push(stamp + "STATUS " + clean(save.status)); }
    if (save.log && save.log !== before) h.push(stamp + clean(save.log));
    const round = JSON.stringify(save.round || []);
    if (save.round && save.round.length && round !== mem.round) save.round.forEach(l => h.push("            | " + l));
    mem.round = round;
    if (save.extra && save.extra !== mem.extra) h.push("            " + save.extra);
    mem.extra = save.extra;
    // About 70 bytes an entry: 20,000 entries is roughly 1.4 MB, well inside a browser's storage.
    if (h.length > 20000) h.splice(0, h.length - 20000);
  }

  function persist() {
    try {
      delete save.unsaved;
      save.saved = hstDate();
      localStorage.setItem(KEY, JSON.stringify(save));
    } catch (e) {
      save.unsaved = true;   // private window or storage blocked: play still works, it just won't last
    }
    flashStatus();
  }

  // Catch up with the real date (a new day, or a missed deadline), then save.
  function tick() {
    if (!save) return;
    const before = JSON.stringify(save), log = save.log;
    save = RULES.tick(save);
    if (JSON.stringify(save) !== before) { remember(log); persist(); }
    endLog();
  }
  // When the run ends (KURA falls, or a deadline passes), the log opens once by itself,
  // after any fight box has been closed.
  function endLog() {
    if (!save || !save.dead || save.endShown || !document.getElementById("found").hidden) return;
    save.endShown = true; persist();
    setTimeout(() => toggleLog(true), 300);
  }

  // Before anything reads the clock, ask the server for the real time (the Date on its reply to a
  // quick HEAD request for this page). The device clock is used only if that fails or takes over 3s.
  async function syncTime() {
    try {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 3000);
      const t0 = Date.now();
      const r = await fetch(location.href, { method: "HEAD", cache: "no-store", signal: ctl.signal });
      clearTimeout(timer);
      const server = Date.parse(r.headers.get("Date") || "");
      if (!isNaN(server)) SMT.setSkew(server + 500 - (t0 + Date.now()) / 2);   // the header is whole seconds
    } catch (e) {}
  }
  async function start() {
    document.getElementById("ver").textContent = SMT.VERSION;
    await syncTime();
    let s = null;
    try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
    if (s && s.dungeon && s.party) { save = s; tick(); flashStatus(); draw(); encounterBox(); altarBox(); return; }
    save = RULES.reset({});
    save.history = [];
    remember("");
    persist(); draw();
  }

  // LOG: the run's adventure log, newest first. Click, L or Escape closes it.
  // The log as plain text, for the download and copy buttons.
  let logText = "";
  function downloadLog() {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([logText], { type: "text/plain" }));
    a.download = `daily-dungeon-log-${hstDate()}.txt`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function copyLog(btn) {
    const done = ok => { if (btn) { btn.textContent = ok ? "[COPIED]" : "[COPY FAILED]"; setTimeout(() => btn.textContent = "[COPY]", 1500); } };
    if (navigator.clipboard) navigator.clipboard.writeText(logText).then(() => done(true), () => done(false));
    else done(false);
  }
  function toggleLog(force) {
    const box = document.getElementById("log");
    const open = force === undefined ? box.hidden : force;
    box.hidden = !open;
    if (open) {
      const h = (save && save.history) || [];
      // After the run ends, the log opens on its own with a short epitaph on top.
      const end = save && save.dead ? `THE RUN IS OVER.  ${save.floor}, day ${save.day}, turn ${save.steps || 0}.\n` +
        `${(save.log || "").replace(/^> (Day \d+\. )?/, "")}\n\n` +
        RULES.summary(save).map(([k, v]) => "  " + (k + " ").padEnd(15, ".") + " " + v).join("\n") +
        "\n\n[R]ESET begins a new run.\n\n" : "";
      // The CODEX opens from here: a button at the top of the log.
      const pre = box.querySelector("pre");
      logText = "DAILY DUNGEON " + SMT.VERSION + "  -  " + hstDate() + "\n\n" + end + "ADVENTURE LOG  (" + h.length + " entries)   D = day, T = turn\n\n" +
        // Newest first, but each action keeps its follow-up lines underneath it.
        (h.length ? h.reduce((g, l) => (/^ /.test(l) && g.length ? g[g.length - 1].push(l) : g.push([l]), g), [])
          .reverse().map(g => g.join("\n")).join("\n") : "Nothing yet.");
      pre.textContent = logText.slice(logText.indexOf("\n\n") + 2);
      // Buttons at the top: the CODEX, and ways to keep the log (a text file, or the clipboard).
      const button = (label, key) => { const b = document.createElement("span"); b.className = "btn"; b.dataset[key] = "1"; b.textContent = label; return b; };
      const top = document.createElement("div");
      top.append(button("[C]ODEX", "codex"), "   ", button("[D]OWNLOAD", "download"), "   ", button("[COPY]", "copy"), "   [L] or Esc closes");
      pre.prepend(top, "\n");
    }
  }

  // PASS: the run's password, like old console games: copy it to keep or move the run; paste one to continue it.
  function backup() {
    if (!save) return;
    // The code carries the run and the last 300 log entries, so it stays short enough to copy.
    const code = btoa(unescape(encodeURIComponent(JSON.stringify({ ...save, history: (save.history || []).slice(-300) }))));
    const got = prompt("Your password. Copy it to keep this run or move it to another device.\n" +
      "To continue a run, paste its password here and press OK.", code);
    if (!got || got.trim() === code) return;
    try {
      const s = JSON.parse(decodeURIComponent(escape(atob(got.trim()))));
      if (!s.dungeon || !s.party) throw new Error("not a run");
      if (!confirm("Replace this run with the one from the password?")) return;
      save = s; tick(); persist(); draw();
    } catch (e) { alert("That password didn't work. Nothing was changed."); }
  }

  // N/S/E/W take the day's step, SEARCH is unlimited, turning is free. X (infinite steps) and Shift+X (next day) are hidden testing cheats.
  // INVOKE: the inventory. Press a number (or click a line) to use an item; I or Escape closes it.
  let invList = [], invSel = 0, invMsg = "", logGlow = false;
  // A box drawn in text, 72 wide: a title row (name left, tag right), then wrapped lines.
  function textBox(title, tag, lines, W = 70) {
    const out = ["+" + "-".repeat(W + 2) + "+"];
    const row = t => out.push("| " + t.padEnd(W) + " |");
    title = title.toUpperCase();
    if (title.length + tag.length + 2 <= W) row(title.padEnd(W - tag.length) + tag);
    else { row(title.slice(0, W)); if (tag) row(tag.padStart(W)); }
    for (const l of lines) {
      if (l === "") { row(""); continue; }
      let rest = l;
      while (rest.length > W) { const cut = rest.lastIndexOf(" ", W); row(rest.slice(0, cut)); rest = rest.slice(cut + 1); }
      row(rest);
    }
    out.push("+" + "-".repeat(W + 2) + "+");
    return out;
  }
  // Fit a popup exactly over the 3D view: screen rows 6-22, columns 1-47.
  function placeInView(box, tall = 17) {
    const scr = document.getElementById("screen"), r = scr.getBoundingClientRect();
    const rows = scr.textContent.split("\n").length, rh = r.height / rows, cw = r.width / 80;
    Object.assign(box.style, { left: scr.offsetLeft + cw + "px", top: scr.offsetTop + 6 * rh + "px",
      width: 47 * cw + "px", height: tall * rh + "px", padding: `${rh / 2}px ${cw}px` });
  }
  window.addEventListener("resize", () => {
    const b = document.getElementById("inv"); if (!b.hidden) placeInView(b);
    const f = document.getElementById("found"); if (!f.hidden && f.classList.contains("inframe")) placeInView(f, 15);
  });
  function showInv(open) {
    const box = document.getElementById("inv");
    box.hidden = !open;
    if (!open) return;
    placeInView(box);
    invList = save ? RULES.inventory(save) : [];
    // ICHOR sits at the top of the bag: Enter feeds the party's demons; K, KURA drinks it herself.
    if (save && (save.ichor || 0) > 0) invList.unshift({ name: "ICHOR", ichor: true, count: 1, tier: "ICHOR",
      text: "Demon blood and old light. Heals demons. Not meant for KURA." });
    invSel = Math.max(0, Math.min(invSel, invList.length - 1));
    const pre = box.querySelector("pre");
    pre.innerHTML = "";
    const add = (txt, cls, i) => { const d = document.createElement("div"); d.textContent = txt; if (cls) d.className = cls; if (i !== undefined) d.dataset.i = i; pre.appendChild(d); return d; };
    add("INVOKE".padEnd(35) + "[I] closes", "");
    add(" ");
    if (!invList.length) add("Nothing yet. Search the walls.");
    invList.forEach((it, i) => add(
      `${i === invSel ? ">" : " "} ${i < 9 ? i + 1 : " "}  ${it.ichor ? `ICHOR  (${save.ichor})` : it.name + (it.count > 1 ? " x" + it.count : "")}`.replace(/^(.{42}).{4,}$/, "$1..."),
      "t-" + it.tier + " btn", i));
    // The chosen item: what it is and what it does. How demons feel about it lives in the CODEX.
    const it = invList[invSel];
    if (it) {
      add(" ");
      const tag = it.ichor ? `${save.ichor} in hand` : it.tier + (it.align ? ` [${it.align}]` : "");
      const lines = it.ichor ? [it.text, "Enter feeds the wounded. [D]RINK: KURA."]
        : [it.text, it.usable ? "[ENTER] uses it." : "No use here. Something down here might want it."];
      textBox(it.name, tag, lines, 41).forEach(l => add(l, "t-" + it.tier));
    }
    add(" ");
    // What happened on the last try to use something (cleared when another item is chosen).
    const help = add("[1-9] choose  "), btn = (t, k) => { const sp = document.createElement("span"); sp.textContent = t; sp.className = "btn"; sp.dataset[k] = "1"; return sp; };
    help.append(btn("[ENTER] use", "use"), "  ");
    if (it && it.ichor) help.append(btn("[D]RINK", "drink"));
  }
  // ABOUT: the build, what the game is, a few numbers from this run and the codex.
  // (The full stats only show at the end of a run.)
  function showAbout(open) {
    const box = document.getElementById("about");
    box.hidden = !open;
    if (!open || !save) return;
    const k = save.stats || {}, cx = RULES.codex(save);
    const count = list => { const all = list.flatMap(g => g.entries); return `${all.filter(e => e.known).length} / ${all.length}`; };
    const two = (a, b, c, d) => "  " + (a + " ").padEnd(16, ".") + " " + String(b).padEnd(10) + " " + (c + " ").padEnd(16, ".") + " " + d;
    const line = "-".repeat(71);
    box.querySelector("pre").textContent = [
      "DAILY DUNGEON" + ("build " + SMT.VERSION).padStart(58), line,
      "A dungeon crawler you play one step a day, on the real calendar.",
      "Each floor's way down closes at the end of Sunday. The moon, the",
      "omens and the demons all follow real time.", "",
      "Search as much as you like. Talk to demons, or fight them.",
      "Take your one step. Come back tomorrow.", "",
      "THIS RUN",
      two("Floor", save.floor, "Day", save.day),
      two("Turns", save.steps || 0, "Alignment", String(save.align).slice(0, 3)),
      two("Demons met", k.met || 0, "Items found", k.items || 0), "",
      "CODEX",
      two("Demons", count(cx.demons), "Items", count(cx.items)), "",
      "KEYS",
      "  [^] / up arrow ..... take the day's one step, the way KURA faces",
      "  [<] [>] / arrows ... turn (free)",
      "  [S]EARCH ........... search the wall KURA faces (as much as you like)",
      "  [G]IVE ............. facing a terminal in the wall: make an offering (SEARCH it works too)",
      "  STA[N]DBY .......... stay put today (uses the day's step; tonight's rest runs deeper)",
      "  [F]IGHT  [T]ALK .... deal with a demon; with none around, TALK to the party",
      "  [G]IVE ............. in a fight: offer the demon a gift (rarely ends it, often buys a round)",
      "  [^] in a fight ..... run through a door (uses the day's step; it may block you)",
      "  [Y]ES  [N]O ........ answer a party member's question, or a demon",
      "  1-8 ................ pick a gift when a demon asks for one",
      "  [I]NVOKE ........... the bag: 1-9 or arrows choose, Enter uses",
      "  [C]ODEX ............ every demon and item found, over all runs (in the LOG)",
      "  [L]OG .............. the adventure log",
      "  [P]ASS ............. this run's password: copy it to keep or move the run,",
      "                       or paste one in to continue that run",
      "  [R]ESET ............ start a new run       [?] this page",
      "",
      "Made by okayline.   [?] or Esc closes",
    ].join("\n");
  }
  document.getElementById("about").addEventListener("click", () => showAbout(false));

  // CODEX: every demon met and item found, over all runs. Unknown ones show as ???.
  let codexTab = "demons", codexSel = 0;
  function showCodex(open) {
    const box = document.getElementById("codex");
    box.hidden = !open;
    if (!open || !save) return;
    const data = RULES.codex(save)[codexTab];
    const flat = data.flatMap(g => g.entries.map(e => ({ ...e, group: g.group })));
    if (codexSel === -1) codexSel = Math.max(0, flat.findIndex(x => x.known));   // a fresh tab opens on its first known entry
    codexSel = (codexSel + flat.length) % flat.length;
    const known = flat.filter(e => e.known).length;
    const pre = box.querySelector("pre");
    pre.innerHTML = "";
    const add = (txt, cls, i) => { const d = document.createElement("div"); d.textContent = txt; if (cls) d.className = cls; if (i !== undefined) d.dataset.i = i; pre.appendChild(d); return d; };
    // Header with the two tabs.
    const head = add("");
    // The open tab is bright; the other is dim.
    const tab = (t, label) => { const sp = document.createElement("span"); sp.textContent = label; sp.className = "btn " + (codexTab === t ? "sel" : "dim"); sp.dataset.tab = t; return sp; };
    head.append("CODEX     ", tab("demons", "[D]EMONS"), "   ", tab("items", "[I]TEMS"),
      `          ${codexTab === "demons" ? "DEMONS MET" : "ITEMS FOUND"} ${known} / ${flat.length}`);
    add(" ");
    const e = flat[codexSel];
    const cls = codexTab === "items" && e.known ? "t-" + e.group : "";
    (e.known ? textBox(e.name, e.tag, [...e.lines, "", e.count]) : textBox("???", "", ["Not found yet."])).forEach(l => add(l, cls));
    add(" ");
    let last = null;
    flat.forEach((x, i) => {
      if (x.group !== last) { last = x.group; add(x.group.toUpperCase(), "dim"); }
      add(`${i === codexSel ? ">" : " "}   ${x.known ? x.name : "???"}`, (i === codexSel ? "sel " : "") + (x.known ? "btn" : "dim btn"), i);
    });
    add(" ");
    add("[D]EMONS / [I]TEMS   arrows or click choose   [C] or Esc closes");
  }
  function useInv(i, drink) {
    const it = invList[i];
    if (!it || !save) return;
    const log = save.log;
    save = it.ichor ? (drink ? RULES.drinkIchor(save) : RULES.feedIchor(save)) : RULES.useItem(save, it.name);
    logGlow = true;            // the result shows on log line 2, in gold, until the next action
    remember(log); persist(); draw();
    if (save.encounter) { showInv(false); encounterBox(); return; }   // mid-fight: back to the fight box
    // Something fell out of broken junk: close the bag and show it like any find.
    if (/Something was inside/.test(save.log)) { showInv(false); foundBox({ items: save.items.slice(0, -1), silver: save.silver }); return; }
    showInv(true);
  }

  // The day's one step takes two presses: the first arms it, the second (same direction) moves.
  // Anything else cancels. A wall or an already-used step answers on the first press.
  const NAMES = { N: "NORTH", S: "SOUTH", E: "EAST", W: "WEST" };
  let armed = null, armTimer = null;
  function disarm() { armed = null; clearTimeout(armTimer); }
  // The step confirmation is a popup: YES (Enter, Y, or the same direction again) or NO (Esc, anything else).
  // On a run's first day, a second box makes sure the player knows what a step costs.
  let reallySure = false;
  function confirmBox(dir, again) {
    reallySure = !!again;
    const box = document.getElementById("found"), pre = box.querySelector("pre");
    floatBox(box);
    pre.innerHTML = "";
    const add = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; pre.appendChild(d); };
    add(again ? "ARE YOU REALLY SURE?" : `GO ${NAMES[dir]}?`, "gold");
    add(" ");
    add(again ? "This is your only move for the day." : "This uses today's one step.");
    add(" ");
    const row = document.createElement("div"), opt = (t, a) => { const e = document.createElement("span"); e.textContent = t; e.className = "btn"; e.dataset.cact = a; return e; };
    row.append(opt("[ YES ]", "yes"), "    ", opt("[ NO ]", "no"));
    pre.appendChild(row);
    box.dataset.mode = "confirm";
    box.hidden = false;
  }
  function answerConfirm(yes) {
    const dir = armed;
    document.getElementById("found").hidden = true;
    if (yes && dir && save && save.day === 1 && !reallySure && !save.encounter) return confirmBox(dir, true);
    if (yes && dir) act("go-" + dir); else { disarm(); draw(); }
  }
  // When a search turns something up, a box says what it was and waits for Enter, Space, Esc or a
  // click, so a quick run of searches can't skip past it. Holding A won't dismiss it.
  function foundBox(before) {
    if (!save) return;
    const newItems = (save.items || []).slice((before.items || []).length);
    const silver = (save.silver || 0) - (before.silver || 0);
    const lines = [];
    for (const it of newItems) lines.push({ text: it, tier: RULES.tierOf(it) });
    if (silver > 0 && /Coins/.test(save.log)) lines.push(silver + " SILVER");
    if (/Stairs lead down/.test(save.log)) lines.push("the stairs down");
    const box = document.getElementById("found");
    const pre = box.querySelector("pre");
    const add = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; pre.appendChild(d); };
    if (!lines.length) return;
    floatBox(box);
    pre.innerHTML = "";
    add("KURA FOUND");
    add(" ");
    for (const l of lines) {
      if (typeof l === "string") add(l, "gold");
      else { const a = RULES.itemAlign(l.text); add(l.text, "t-" + l.tier); add(l.tier + (a ? `  [${a.slice(0, 3)}]` : ""), "t-" + l.tier); }
    }
    const notes = newItems.map(n => (RULES.inventory({ items: [n] })[0] || {}).text).filter(Boolean);
    if (notes.length) { add(" "); notes.forEach(n => add(n)); }
    add(" ");
    add("[ OK ]", "btn");
    box.hidden = false;
    box.dataset.mode = "found";
  }
  function closeFound() {
    document.getElementById("found").hidden = true;
    if (save && save.roundOver) { delete save.round; delete save.roundOver; persist(); draw(); }
    endLog();
  }

  // ENCOUNTER box: inside the 3D view. Art slot, the demon and its HP, what happened this round (played back
  // line by line, with the > following whoever acts), and the choices. It stays open until the demon is gone
  // (or KURA falls); then [ENTER] closes it.
  const floatBox = box => { box.className = "foundbox"; box.removeAttribute("style"); };
  const wrapText = (s, n) => { const out = []; let rest = String(s); while (rest.length > n) { let cut = rest.lastIndexOf(" ", n); if (cut <= 0) cut = n; out.push(rest.slice(0, cut)); rest = rest.slice(cut).trimStart(); } out.push(rest); return out; };
  let replayTimer = null, prevDemonHp = null;     // prevDemonHp: its HP before the round, so the bar drops when the party's blow lands
  function finishReplay() { if (replayTimer) { clearInterval(replayTimer); replayTimer = null; encounterBox(false); } }

  // THE ALTAR: the terminal in a Matrix Altar room. Its screen types out its words, a glare shimmers across it,
  // and after an offering it answers with a face. The list is the gift list; the result and the "quiet today"
  // screen end with [ OK ]. Nothing here says which way the offering pulled KURA.
  let altarTimer = null;
  function altarBox() {
    if (altarTimer) { clearInterval(altarTimer); altarTimer = null; }
    const box = document.getElementById("found"), pre = box.querySelector("pre");
    const A = save && save.altar;
    if (!A || !A.open || save.encounter) {
      if (box.dataset.mode === "altar") { box.hidden = true; box.dataset.mode = ""; pre.innerHTML = ""; }
      return false;
    }
    box.className = "foundbox inframe"; box.removeAttribute("style"); box.hidden = false;
    placeInView(box, 15);
    box.dataset.mode = "altar";
    pre.innerHTML = "";
    const add = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; pre.appendChild(d); return d; };
    const opt = (label, act) => { const d = document.createElement("span"); d.textContent = label; d.className = "btn"; d.dataset.fact = act; return d; };
    const PAD = " ".repeat(10), IN = 23;
    add(PAD + ".-----------------------.", "artframe");
    const s1 = document.createElement("div"), s2 = document.createElement("div");
    s1.className = s2.className = "artframe screen";
    pre.append(s1, s2);
    add(PAD + "'-----------------------'", "artframe");
    add(" ".repeat(16) + "[=======]", "artframe");
    add(" ");
    // below the terminal
    if (A.result) {
      for (const l of A.result.lines) add("  " + l);
      add(" "); add("  [ OK ]", "btn").dataset.fact = "altar-none";
    } else if (A.used) {
      add("  THE TERMINAL IS QUIET."); add("  COME BACK TOMORROW."); add(" ");
      add("  [ OK ]", "btn").dataset.fact = "altar-none";
    } else {
      RULES.altarGifts(save).slice(0, 6).forEach((g, i) => {
        const line = document.createElement("div"), o = opt(`  [${i + 1}] ${g.label}`, "altar-" + i);
        if (!g.ok) o.classList.add("off");
        line.append(o); pre.appendChild(line);
      });
      add(" ");
      const row = document.createElement("div"); row.append(opt("  [B]ACK", "altar-none")); pre.appendChild(row);
    }
    // the screen: line 1 types, line 2 shimmers (or types the face once there is an answer)
    const say = A.result ? A.result.say : A.used ? "> ...ZZZ" : (A.greet || "> INPUT?");
    const face = A.result ? "  " + A.result.face : "";
    const WAVE = ["_", ".", "-", "'"];                   // a sine wave in four heights, drifting across the screen
    let tick = 0;
    // The wave follows its mood: flat when it dislikes the offering, easy when it's neutral, quick and tight when it loves it.
    const mood = A.result ? A.result.mood : "ok";
    const waveOf = n => {
      if (mood === "bad") return "-".repeat(n);
      const [period, speed] = mood === "good" ? [6, 0.9] : [11, 0.35];
      let w = ""; for (let x = 0; x < n; x++) w += WAVE[Math.round((Math.sin((x - tick * speed) * 2 * Math.PI / period) + 1) / 2 * 3)];
      return w;
    };
    const paint = () => {
      const typed1 = Math.min(say.length, Math.floor(tick / 2));
      const done1 = typed1 >= say.length;
      const typed2 = A.result ? Math.max(0, Math.min(face.length, Math.floor((tick - say.length * 2 - 8) / 3))) : 0;
      const cursor = Math.floor(tick / 8) % 2 === 0 ? "_" : " ";
      const t1 = " " + say.slice(0, typed1) + (done1 ? "" : "_");
      let t2;
      if (A.result) t2 = (waveOf(IN - 5) + " " + face.trim().slice(0, Math.max(0, typed2 - 2))).padEnd(IN);
      else t2 = waveOf(IN);
      if (!A.result && done1) s1.textContent = PAD + "|" + (" " + say + cursor).padEnd(IN) + "|";
      else s1.textContent = PAD + "|" + t1.padEnd(IN) + "|";
      s2.textContent = PAD + "|" + t2 + "|";
      tick++;
    };
    paint();
    altarTimer = setInterval(paint, 55);
    return true;
  }

  function encounterBox(animate) {
    if (replayTimer) { clearInterval(replayTimer); replayTimer = null; }
    const e = save && save.encounter, lines = (save && save.round) || [];
    if (!e && !(save && save.roundOver)) return false;
    const box = document.getElementById("found"), pre = box.querySelector("pre");
    const COLS = 45, ROWS = 14;                        // text area of the box: 47 columns less the padding, 15 rows less the padding
    box.className = "foundbox inframe"; box.removeAttribute("style");
    box.hidden = false;
    placeInView(box, 15);
    box.dataset.mode = e ? "encounter" : "done";
    const add = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; pre.appendChild(d); return d; };
    const opt = (label, act) => { const d = document.createElement("span"); d.textContent = label; d.className = "btn"; d.dataset.fact = act; return d; };
    const lineClass = l => /falls\.  \+|leaves|slips away|pays|escapes/.test(l) ? "gold" : /KURA falls|FALLS/.test(l) ? "demon" : "";
    const isDemon = l => { if (!e) return false; const u = l.toUpperCase(), n = e.name.toUpperCase(); return u.startsWith(n + ":") || u.startsWith("THE " + n) || u.startsWith(n + " "); };
    const tail = (arr, n) => arr.slice(Math.max(0, arr.length - n));

    if (!e) {                                          // the fight is over
      pre.innerHTML = "";
      add(save.dead ? "DEFEAT" : "THE WAY IS CLEAR", save.dead ? "demon" : "gold");
      add(" ");
      for (const l of lines) for (const w of wrapText(l, COLS)) add(w, lineClass(l));
      add(" ");
      add("[ OK ]", "btn");
      return true;
    }
    const barFor = hp => { const f = Math.round(10 * hp / e.hpmax); return `[${"#".repeat(f)}${"-".repeat(10 - f)}]`; };
    const round = (e.round || 0) + 1;

    // One frame of the box. shown = how many result lines are visible; who = whose > it is (null = KURA, waiting).
    const frame = (shown, who, final) => {
      pre.innerHTML = "";
      const gl = lines.slice(0, shown);
      if (e.stage === "offer") {                       // GIVE: just the list
        RULES.gifts(save).forEach((g, i) => {
          const line = document.createElement("div"), o = opt(`[${i + 1}] ${g.label}`, "offer-" + i);
          if (!g.ok) o.classList.add("off");
          line.append(o); pre.appendChild(line);
        });
        add(" ");
        const row = document.createElement("div"); row.append(opt("[B]ACK", "offer-none")); pre.appendChild(row);
        return;
      }
      if (e.stage === "gift") {                        // the demon asks for a gift: what it said, then the list
        for (const l of lines) for (const w of wrapText(l, COLS)) add(w, lineClass(l));
        add(" ");
        RULES.gifts(save).forEach((g, i) => {
          const line = document.createElement("div"), o = opt(`[${i + 1}] ${g.label}`, "give-" + i);
          if (!g.ok) o.classList.add("off");
          line.append(o); pre.appendChild(line);
        });
        const row = document.createElement("div"); row.append(opt("[N]OTHING", "give-none")); pre.appendChild(row);
        return;
      }
      const wrapped = [];
      for (const l of gl) for (const w of wrapText(l, COLS)) wrapped.push([w, lineClass(l)]);
      const maxLines = ROWS - 5;                       // blank + 2 name rows + blank + button row
      const body = tail(wrapped, maxLines);
      let art = Math.min(5, ROWS - 5 - body.length - 1);
      if (art < 3) art = 0;
      if (art) {                                       // the art slot: a faint empty frame for now
        for (let i = 0; i < art; i++) {
          const w = COLS; const s = i === 0 ? "." + " ".repeat(w - 2) + "." : i === art - 1 ? "'" + " ".repeat(w - 2) + "'" : " ".repeat(w);
          add(s, "artframe");
        }
        add(" ");
      }
      const arrow = (on, text, cls) => { const d = document.createElement("div"); const a = document.createElement("span"); a.textContent = on ? "> " : "  "; if (on) a.className = "arrow"; d.append(a, document.createTextNode(text)); if (cls) d.className = cls; pre.appendChild(d); };
      arrow(who === null, "KURA");
      arrow(who === "demon", `${e.name}   ${barFor(shown >= 1 || final || prevDemonHp === null ? e.hp : prevDemonHp)}`, "demon");
      for (const [w, c] of body) add(w, c);
      const rest = ROWS - (art ? art + 1 : 0) - 2 - body.length - 1;
      for (let i = 0; i < rest; i++) add(" ");
      const row = document.createElement("div"); row.className = "brow";
      const left = document.createElement("span");
      if (final) {
        if (e.stage === "ask" || e.stage === "join" || e.stage === "chat") left.append(opt("[Y]ES", "yes"), "   ", opt("[N]O", "no"));
        else if (e.stage === "swap") {
          save.party.forEach((p, i) => { if (i > 0) left.append(opt(`[${i + 1}] ${p.name}`, "swap-" + i), "   "); });
          left.append(opt("[N]O", "swap-none"));
        } else left.append(opt("[F]IGHT", "fight"), "   ", opt("[T]ALK", "talk"), "   ", opt("[G]IVE", "offer"));
      }
      const tag = document.createElement("span"); tag.textContent = `ROUND ${round}`; tag.className = "artframe";
      row.append(left, tag); pre.appendChild(row);
    };

    if (animate && lines.length > 1 && !e.stage) {     // play the round back: the > moves to whoever acts
      let n = 0;
      frame(0, null, false);
      replayTimer = setInterval(() => {
        n++;
        if (n >= lines.length) { clearInterval(replayTimer); replayTimer = null; frame(lines.length, null, true); return; }
        frame(n, isDemon(lines[n - 1]) ? "demon" : null, false);
      }, 450);
      return true;
    }
    frame(lines.length, null, true);
    return true;
  }

  function act(name) {
    if (replayTimer) finishReplay();
    prevDemonHp = save && save.encounter ? save.encounter.hp : null;
    if (name === "forward" && save) name = "go-" + save.facing;
    if ((name === "qyes" || name === "qno") && save) {
      const log = save.log;
      save = RULES.reply(save, name === "qyes");
      remember(log); persist(); draw();
      return;
    }
    if (name === "run" && save && save.encounter) {
      const can = RULES.available(save), out = ["N", "E", "S", "W"].filter(d => can[d]);
      name = "go-" + (out.includes(save.facing) ? save.facing : out[0] || save.facing);
    }
    if (name !== "invoke" && name !== "codex") logGlow = false;
    if (name.startsWith("go-") && save) {
      const dir = name.slice(3);
      if (armed !== dir && RULES.available(save)[dir]) {
        disarm(); armed = dir;
        draw(); confirmBox(dir);
        return;
      }
    }
    disarm();
    if (name === "invoke") {
      const closing = !document.getElementById("inv").hidden;
      if (save && save.encounter && !closing) document.getElementById("found").hidden = true;   // the fight box comes back after
      showInv(!closing);
      if (closing && save && save.encounter) encounterBox();   // closing the bag from the menu brings the fight box back too
      return;
    }
    if (name === "log") return toggleLog();
    if (name === "about") return showAbout(document.getElementById("about").hidden);
    if (name === "codex") { codexSel = -1; return showCodex(document.getElementById("codex").hidden); }
    if (name === "backup") return backup();
    if (!save) return;
    if (name === "reset" && !confirm("Begin a new run? This run will be lost.")) return;
    if (name === "hold" && !confirm("Go on standby for the day? KURA won't step today, and tonight's rest runs deeper.")) return;
    const log = save.log, steps = save.steps;
    const before = { items: (save.items || []).slice(), silver: save.silver };
    save = name === "yes" ? RULES.answer(save, true) : name === "no" ? RULES.answer(save, false)
      : name.startsWith("give-") ? RULES.give(save, name === "give-none" ? null : Number(name.slice(5)))
      : name.startsWith("offer-") ? RULES.offerGive(save, name === "offer-none" ? null : Number(name.slice(6)))
      : name.startsWith("swap-") ? RULES.swap(save, name === "swap-none" ? null : Number(name.slice(5)))
      : name === "altar" ? RULES.altarOpen(save)
      : name.startsWith("altar-") ? RULES.altarGive(save, name === "altar-none" ? null : Number(name.slice(6)))
      : name === "left" ? RULES.turn(save, "L") : name === "right" ? RULES.turn(save, "R")
      : name.startsWith("go-") ? RULES.go(save, name.slice(3)) : RULES[name](save);
    if (name === "reset") save.history = [];
    remember(name === "reset" || save.steps !== steps ? "" : log);
    persist(); draw();
    if (name !== "reset" && !encounterBox(true) && !altarBox()) foundBox(before);
  }

  document.getElementById("screen").addEventListener("click", e => {
    const b = e.target.closest(".btn"); if (b) act(b.dataset.act);
  });
  document.getElementById("log").addEventListener("click", e => {
    if (e.target.closest("[data-download]")) return downloadLog();
    if (e.target.closest("[data-copy]")) return copyLog(e.target.closest("[data-copy]"));
    toggleLog(false);
    if (e.target.closest("[data-codex]")) { codexSel = -1; showCodex(true); }
  });
  document.getElementById("found").addEventListener("click", e => {
    if (replayTimer) return finishReplay();     // a click skips the round's playback
    const c = e.target.closest("[data-cact]");
    if (c) return answerConfirm(c.dataset.cact === "yes");
    if (document.getElementById("found").dataset.mode === "confirm") return answerConfirm(false);
    const b = e.target.closest("[data-fact]");
    if (b) act(b.dataset.fact);
    else if (document.getElementById("found").dataset.mode !== "encounter") closeFound();
  });
  // Clicking an item chooses it; clicking the chosen one again uses it. Clicking elsewhere closes.
  document.getElementById("inv").addEventListener("click", e => {
    if (e.target.closest("[data-use]")) return useInv(invSel);
    if (e.target.closest("[data-drink]")) return useInv(invSel, true);
    if (e.target.closest("[data-codex]")) { showInv(false); codexSel = -1; return showCodex(true); }
    const line = e.target.closest("[data-i]");
    if (!line) { showInv(false); if (save && save.encounter) encounterBox(); return; }
    const i = Number(line.dataset.i);
    if (i === invSel) useInv(i); else { invSel = i; invMsg = ""; showInv(true); }
  });
  document.getElementById("codex").addEventListener("click", e => {
    const tab = e.target.closest("[data-tab]"), line = e.target.closest("[data-i]");
    if (tab) { codexTab = tab.dataset.tab; codexSel = -1; showCodex(true); }
    else if (line) { codexSel = Number(line.dataset.i); showCodex(true); }
    else showCodex(false);
  });
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const key = e.key.toLowerCase();
    const fbox = document.getElementById("found");
    if (!fbox.hidden) {
      e.preventDefault();
      if (fbox.dataset.mode === "confirm") {
        const same = armed && (key === armed.toLowerCase() || key === "arrowup");
        answerConfirm(key === "enter" || key === "y" || same);
        return;
      }
      if (fbox.dataset.mode === "altar") {
        const A = save.altar || {};
        let k;
        if (A.result || A.used) k = { enter: "altar-none", " ": "altar-none", escape: "altar-none", b: "altar-none" }[key];
        else k = /^[1-6]$/.test(key) ? "altar-" + (Number(key) - 1) : { b: "altar-none", escape: "altar-none" }[key];
        if (k) act(k);
        return;
      }
      if (fbox.dataset.mode === "encounter") {
        const st2 = save.encounter && save.encounter.stage;
        let k;
        if (st2 === "gift") k = /^[1-8]$/.test(key) ? "give-" + (Number(key) - 1) : { n: "give-none", escape: "give-none" }[key];
        else if (st2 === "offer") k = /^[1-8]$/.test(key) ? "offer-" + (Number(key) - 1) : { b: "offer-none", n: "offer-none", escape: "offer-none" }[key];
        else if (st2 === "ask" || st2 === "join" || st2 === "chat") k = { y: "yes", enter: "yes", n: "no", escape: "no" }[key];
        else if (st2 === "swap") k = { "2": "swap-1", "3": "swap-2", "4": "swap-3", n: "swap-none", escape: "swap-none" }[key];
        else k = { f: "fight", t: "talk", g: "offer", i: "invoke", arrowup: "run" }[key];
        if (k) act(k);
      } else if (key === "enter" || key === " " || key === "escape") closeFound();
      return;
    }
    if (!document.getElementById("about").hidden) {
      e.preventDefault();
      if (key === "?" || key === "escape") showAbout(false);
      return;
    }
    if (!document.getElementById("codex").hidden) {
      e.preventDefault();
      if (key === "c" || key === "escape") showCodex(false);
      else if (key === "d" || key === "i") { codexTab = key === "d" ? "demons" : "items"; codexSel = -1; showCodex(true); }
      else if (key === "arrowdown" || key === "arrowup") { codexSel += key === "arrowdown" ? 1 : -1; showCodex(true); }
      else if (key === "arrowleft" || key === "arrowright") { codexTab = codexTab === "demons" ? "items" : "demons"; codexSel = -1; showCodex(true); }
      return;
    }
    if (!document.getElementById("inv").hidden) {
      if (key === "i" || key === "escape") { e.preventDefault(); showInv(false); if (save && save.encounter) encounterBox(); }
      else if (/^[1-9]$/.test(key)) { e.preventDefault(); invSel = Number(key) - 1; invMsg = ""; showInv(true); }
      else if (key === "arrowdown" || key === "arrowup") { e.preventDefault(); invSel += key === "arrowdown" ? 1 : -1; invMsg = ""; showInv(true); }
      else if (key === "enter") { e.preventDefault(); useInv(invSel); }
      else if (key === "d" && invList[invSel] && invList[invSel].ichor) { e.preventDefault(); useInv(invSel, true); }
      return;
    }
    if (!document.getElementById("log").hidden) {
      if (key === "l" || key === "escape") { e.preventDefault(); toggleLog(false); }
      else if (key === "c") { e.preventDefault(); toggleLog(false); codexSel = -1; showCodex(true); }
      else if (key === "d") { e.preventDefault(); downloadLog(); }
      return;
    }
    // S is SEARCH now; the day's step is [^] or the up arrow (the compass keys are gone with the NSEW buttons).
    if (save && save.question && (key === "y" || key === "n")) { e.preventDefault(); return act(key === "y" ? "qyes" : "qno"); }
    const k = { "?": "about", c: "codex", f: "fight", t: "talk", i: "invoke", l: "log", p: "backup", r: "reset",
      s: "search", n: "hold", g: "altar", arrowup: "forward", arrowleft: "left", arrowright: "right" }[key];
    if (key === "x") { e.preventDefault(); return act(e.shiftKey ? "next" : "freesteps"); }   // testing cheats: X toggles infinite steps, Shift+X jumps a day
    if (k) { e.preventDefault(); act(k); }
  });

  start();
  // Live clock: redraw the moment the minute turns over (the colon blinks on its own),
  // and catch up with the real date so midnight brings the new day.
  let shownMinute = SMT.now().getMinutes();
  setInterval(() => {
    const m = SMT.now().getMinutes();
    if (m !== shownMinute) { shownMinute = m; tick(); draw(); }
  }, 1000);
</script>
</body>
</html>
