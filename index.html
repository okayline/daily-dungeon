<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Digital Demon Dungeon</title>
<style>
  /* VT323, self-hosted (fonts/OFL.txt has its license). */
  @font-face { font-family: "VT323"; src: url("fonts/VT323-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
  :root {
    --bg: #07090a;
    --fg: #e4e4df;
    --dim: #4f5d52;
    --trail: #8f8f8a;
    --bright: #ffffff;
    --demon: #e0564a;
    --gold: #e3b341;
    --moon: #9fc4ff;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { -webkit-user-select: none; user-select: none; }      /* clicks never highlight the screen text */
  textarea, input, #log pre { -webkit-user-select: text; user-select: text; }   /* but the password box and the log can still be selected and copied */
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    font-family: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  .frame { max-width: 100%; overflow-x: auto; }
  pre {
    margin: 0; font-family: inherit; line-height: 1.05;
    font-size: clamp(6px, calc((100vw - 32px) / 49), 22px); white-space: pre;
    text-shadow: 0 0 4px rgba(228, 228, 223, 0.2);
  }
  .you { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .demon { color: var(--demon); }
  .gold { color: var(--gold); }
  .moon { color: var(--moon); }
  /* The clock's colon blinks slowly (1s on, 1s off); hidden, it still keeps its space. */
  .colon { animation: blink 2s steps(1) infinite; }
  /* The weekday kanji takes exactly two character cells, so the frame stays straight. */
  /* Like .cell: the box keeps the screen font so 2ch is two grid cells; only the glyph switches font. */
  .kanji { display: inline-block; width: 2ch; text-align: center; overflow: visible; white-space: nowrap; }
  .kanji .g { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "MS Gothic", sans-serif; line-height: 0; }
  @keyframes blink { 50% { opacity: 0; } }   /* opacity (not visibility) so a blinking button still takes clicks while it is dark */
  .stairs { color: var(--moon); }
  .goal { color: var(--gold); text-shadow: 0 0 6px var(--gold); }
  /* Map symbols like □ ⋰ ⋱ ↑ ↓ can be wider or narrower than letters in some fonts.
     Boxing each one to exactly one character keeps the grid lined up. */
  /* .cell keeps the screen's own font so 1ch equals exactly one character of the grid;
     only the glyph inside it switches to a font that has the symbol. */
  .cell { display: inline-block; width: 1ch; text-align: center; overflow: visible; white-space: nowrap; }
  /* The moon strip: shorter blocks, so the row is not taller than its neighbours. */
  .ph .g { display: inline-block; transform: scale(1.3, 0.62); }
  .cell .g { font-family: "DejaVu Sans Mono", Menlo, Consolas, "Segoe UI Symbol", monospace; line-height: 0; }
  .room { color: var(--trail); }
  .door { color: var(--trail); }
  .door.focus { color: #ffffff; text-shadow: none; }   /* the locked door KURA faces: flat white, no glow */
  .door .g { position: relative; left: -0.1em; }   /* the fallback font draws || a touch right of its cell */
  .wall { color: var(--dim); opacity: 0.6; }
  .btn { cursor: pointer; color: var(--bright); }
  .btn:hover { background: var(--fg); color: var(--bg); }
  .btn.off { color: var(--dim); }
  .btn.armed { background: var(--gold); color: var(--bg); }
  .btn.flee { color: var(--bright); animation: blink 1.2s steps(1) infinite; }
  .unsaved { color: var(--gold); }
  .frame { position: relative; }
  .logview { position: absolute; inset: 0; background: rgba(7, 9, 10, 0.96); overflow: auto; cursor: pointer;
    border: 1px solid var(--trail); box-sizing: border-box; padding: 1.5em 2ch; }
  .logview pre { white-space: pre-wrap; }
  .logview .sel { color: var(--bright); }
  /* INVOKE opens inside the 3D view (rows 6-22, columns 1-47); placeInView() sizes it to that area. */
  .viewpop { position: absolute; background: var(--bg); overflow: auto; cursor: pointer; box-sizing: border-box;
    outline: 1px solid var(--trail); }
  .viewpop pre { white-space: pre; display: flex; flex-direction: column; min-height: 100%; margin: 0; }
  .viewpop pre > div { flex: none; }
  .viewpop pre > div:last-child { margin-top: auto; }   /* the [ENTER] use row sits at the foot, so it never moves when the list or the box changes size */
  .logview .dim { color: var(--trail); }
  .foundbox { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); background: var(--bg);
    border: 1px solid var(--gold); padding: 1em 3ch; cursor: pointer; box-shadow: 0 0 24px rgba(227, 179, 65, 0.25); }
  .foundbox pre { white-space: pre; text-align: center; }
  .foundbox .gold { color: var(--gold); }
  .nameinput { background: var(--bg); color: var(--fg); border: 1px solid var(--trail); font: inherit; width: 11ch; padding: 0 4px; text-transform: uppercase; }
  .nameinput.bad { border-color: var(--demon); }
  .passfield { display: block; width: 100%; box-sizing: border-box; background: var(--bg); color: var(--fg); border: 1px solid var(--trail); font: inherit; resize: none; margin: 4px 0; }
  /* The fight box sits inside the 3D view (rows 6-20, columns 1-47), like the bag, so the party and map stay in sight. */
  .foundbox.inframe { left: auto; top: auto; transform: none; border: none; outline: 1px solid var(--trail); box-shadow: none;
    box-sizing: border-box; overflow: hidden; cursor: default; }
  .foundbox.inframe pre { text-align: left; }
  .foundbox.fight pre { padding: 0 2ch; }   /* the fight box's text sits in from the edge */
  .foundbox.inframe .brow { display: flex; justify-content: space-between; }
  .foundbox .artframe { color: var(--trail); }
  .foundbox .arrow { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  /* Rarity colors, Diablo-style. */
  .lit { color: var(--moon); text-shadow: 0 0 6px var(--moon); animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.55; text-shadow: 0 0 2px var(--moon); } }
  .mframe { color: var(--trail); }
  .logline { display: inline-block; width: 78ch; overflow: hidden; vertical-align: top; white-space: pre; }
  .wait { animation: blink 1s steps(1) infinite; }   /* the _ that waits for a click */
  .caret { display: inline-block; position: relative; left: calc(-1ch / 6); width: calc(1ch / 1.5); font-size: 1.5em; line-height: 0.6; vertical-align: middle; text-shadow: none; }   /* just the ^ is bigger; its cell stays one column wide */
  .btn[data-act=hold] { position: relative; top: 0.02em; }   /* STANDBY sits a touch lower to line up with the bar */
  .btn.nudge { animation: blink 0.35s steps(1) 2; }   /* two flashes when keys are pressed while a question waits */
  /* The build number, small, under the screen's lower right corner. */
  .ver { white-space: pre-line; text-align: right; font-size: 12px; line-height: 14px; color: var(--trail); padding: 2px 1ch 0 0; letter-spacing: 0.05em; }
  .cheat { text-align: left; padding: 2px 0 0 1ch; margin-top: -16px; }   /* the X cheat menu: three lines, left-justified; the build number stays at the right */
  .cheat:empty { display: none; }
  .pull { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .t-ICHOR { color: var(--demon); }
  .foundbox .demon { color: var(--demon); }
  .facing { color: var(--bright); }
  .saved { color: var(--fg); }
</style>
</head>
<body>
  <div class="frame"><pre id="screen">LOADING...</pre>
    <div id="log" class="logview" role="dialog" aria-modal="true" aria-label="Adventure log" hidden><pre></pre></div>
    <div id="inv" class="viewpop" role="dialog" aria-modal="true" aria-label="Invoke: your bag" hidden><pre></pre></div>
    <div id="codex" class="logview" role="dialog" aria-modal="true" aria-label="Codex" hidden><pre></pre></div>
    <div id="board" class="logview" role="dialog" aria-modal="true" aria-label="Leaderboard" hidden><pre></pre></div>
    <div id="about" class="logview" role="dialog" aria-modal="true" aria-label="About" hidden><pre></pre></div>
    <div id="ver" class="ver"></div>
    <div id="cheat" class="ver cheat"></div>
    <div id="found" class="foundbox" role="dialog" aria-modal="true" aria-live="polite" hidden><pre></pre></div></div>
<script src="screen.js"></script>
<script src="floor.js"></script>
<script src="rules.js"></script>
<script>
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let save = null;

  // Color only the minimap rows (right panel) and the moon marker.
  function colorize(text) {
    const lines = text.split("\n");
    return lines.map((line, i) => {
      if (i >= 15 && i <= 19) {
        const left = esc(line.slice(0, 49)), right = line.slice(49);
        // [^] and [v] inside brackets are stairs; a bare ^ v < > next to @ is KURA's facing arrow.
        // The locked door KURA faces gets a slightly brighter #: it sits in the gap beside her @ on that side.
        const ctr = (lines[17] || "").slice(49).indexOf("@"), face = save && save.facing;
        const focus = ctr < 0 ? null : face === "N" ? [16, ctr] : face === "S" ? [18, ctr] : face === "E" ? [17, ctr + 2] : face === "W" ? [17, ctr - 2] : null;
        const map = right.replace(/[\[)][\^v][\](]|[@^v<>&$?□=‖#+\-|]/g, (m, at) => {
          // The outline walls (+ - |) are dim; a # is a locked door and stays bright. The panel's own edges are left alone.
          if (/[+\-|]/.test(m)) {
            if (at === 0 || at === right.length - 1) return m;
            const l = right[at - 1], r = right[at + 1], gap = c => c === " " || c === "[" || c === "]";
            return `<span class="wall">${m}</span>`;
          }
          if (m.length === 3) return m[0] + `<span class="cell stairs">${m[1]}</span>` + m[2];
          const ch = m;
          const cls = { "@": "you", "^": "you", "v": "you", "<": "you", ">": "you",
            "&": "demon", "$": "gold", "?": "goal", "□": "room", "=": "door", "‖": "door", "#": "door" }[ch];
          // Plain keyboard characters (? > < ^ v $ &) stay in the screen font;
          // only real Unicode symbols switch to the fallback symbol font.
          const inner = ch.charCodeAt(0) < 128 ? esc(ch) : `<span class="g">${esc(ch)}</span>`;
          const lit = ch === "#" && focus && i === focus[0] && at === focus[1] ? " focus" : "";
          return `<span class="cell ${cls}${lit}">${inner}</span>`;
        });
        return left + map;
      }
      // Turn controls under the 3D view (only the left 48 columns, so the map is never touched).
      if (i === 21 || i === 22) {
        const left = esc(line.slice(0, 48))
          .replace("[ &lt; ]", `<span class="btn${save && save.encounter ? " off" : ""}" data-act="left">[ &lt; ]</span>`)
          .replace("[ &gt; ]", `<span class="btn${save && save.encounter ? " off" : ""}" data-act="right">[ &gt; ]</span>`)
          // [^] takes the day's step forward; dim when that way is a wall or the step is spent, and in a fight
          // (running is a button in the fight box).
          .replace("[  ^  ]", `<span class="btn" data-act="forward">[  <span class="caret">^</span>  ]</span>`)
          .replace(/(<\/span>)(\s+)([NESW?])(\s+)(<span)/, '$1$2<span class="facing">$3</span>$4$5');
        // The moon strip (row 21, right panel): each block glyph boxed to one cell, like the moon icon.
        const tail = esc(line.slice(48)).replace(/[░▒▓█]/g, ch => `<span class="cell ph"><span class="g">${ch}</span></span>`);
        return left + tail;
      }
      // The v over today's phase (row 20, right panel).
      if (i === 20) return esc(line.slice(0, 48)) + esc(line.slice(48)).replace(/\./, `<span class="cell" style="position:relative;left:${[2, 6].includes(SMT.moonIndex(SMT.now())) ? ".65ch" : ".15ch"}">.</span>`);
      // The block moon (rows 1-4): each box or shade glyph boxed to one cell; the lit part glows and breathes.
      const moonBox = t => t.replace(/[╭╮╰╯─│░▒▓█]/g, ch => `<span class="cell ${/[░▒▓█]/.test(ch) ? "lit" : "mframe"}"><span class="g">${ch}</span></span>`);
      if (i === 1) return moonBox(esc(line)).replace(/(\d\d):(\d\d)/, '$1<span class="colon">:</span>$2')
        .replace(/([日月火水木金土])/, '<span class="kanji"><span class="g">$1</span></span>');
      if (i === 2 || i === 3) return moonBox(esc(line));
      if (i === 4) return moonBox(esc(line)).replace("^^^", '<span class="moon">^^^</span>');
      // The three log lines: their text sits in a box exactly 78 cells wide, so the right border stays
      // straight even if a glyph in the font (an apostrophe, say) isn't exactly one cell wide.
      // Line 2 glows gold right after using an item.
      if (i >= lines.length - 6 && i <= lines.length - 4) {
        let inner = esc(line.slice(1, -1)); const gold = false;
        // A party member's question: [Y]ES and [N]O sit at the right end of line 3 and answer it.
        if (i === lines.length - 4) inner = inner
          .replace("[Y]ES", '<span class="btn ask" data-act="qyes">[Y]ES</span>')
          .replace(/\[N\]O(?![A-Z])/, '<span class="btn ask" data-act="qno">[N]O</span>')
          .replace("[S]ILENT", '<span class="btn ask" data-act="qsilent">[S]ILENT</span>');
        return `|<span class="logline${gold ? " gold" : ""}">${inner}</span>|`;
      }
      if (i === lines.length - 2) {
        // Daily actions dim once used (or when there's no door that way).
        const can = save ? RULES.available(save) : {};
        const b = (txt, act, ok) => `<span class="btn${ok ? "" : " off"}" data-act="${act}">${txt}</span>`;
        return esc(line)
          .replace("[F]IGHT", '<span class="btn" data-act="fight">[F]IGHT</span>')
          .replace("[T]ALK", '<span class="btn" data-act="talk">[T]ALK</span>')
          .replace("[I]NVOKE", '<span class="btn" data-act="invoke">[I]NVOKE</span>')
          .replace("[S]EARCH", b("[S]EARCH", "search", can.search))
          .replace("STA[N]DBY", b("STA[N]DBY", "hold", can.hold))
          .replace(/\[([NSEW])\](ORTH|OUTH|AST|EST)/g, (m, x) =>
            b(m, "go-" + x, can[x]).replace('class="btn', 'class="btn' + (armed === x ? " armed" : save && save.encounter && can[x] ? " flee" : "")));
      }
      if (i === lines.length - 1) return esc(line)
        // SAVED / NOT SAVED shows for a few seconds after each action, then fades back into the border.
        .replace(/ (NOT SAVED|SAVED \d{4}-\d\d-\d\d) /, (m, t) => Date.now() < statusUntil
          ? ` <span class="${t === "NOT SAVED" ? "unsaved" : "saved"}">${t}</span> ` : "=".repeat(m.length))
        .replace("[?]", '<span class="btn" data-act="about">[?]</span>')
        .replace("[L]OG", '<span class="btn" data-act="log">[L]OG</span>')
        .replace("[R]ESET", '<span class="btn" data-act="reset">[R]ESET</span>');
      return esc(line);
    }).join("\n")
      // The ALIGN arrow (which way the last action pulled KURA) glows white.
      .replace(/&lt;( ?\[(?:LAW|NEU|CHA)\])/, '<span class="pull">&lt;</span>$1')
      .replace(/(\[(?:LAW|NEU|CHA)\] ?)&gt;/, '$1<span class="pull">&gt;</span>');
  }

  // Line 3 (voices, flavor, clues) stays put for at least 2 actions and 2 seconds before the next one replaces it,
  // so a quick run of clicks can't skip past it. Anything urgent (a warning, a hit, a new demon) takes over at once.
  // Only what's drawn is held: the save and the LOG still get every line.
  let heldExtra = null;                     // { text, steps, t }: the line on screen, and when it went up
  const EXTRA_URGENT = /closes tonight|GAME OVER|TRIPPING|comes down|-\d+ HP|appears|blocks the way|comes to see what broke|FALLS|calendar|joins the party/i;
  function extraToShow() {
    const want = save.extra || "", now = Date.now(), steps = save.steps || 0, h = heldExtra;
    const take = () => { if (!h || h.text !== want || steps < h.steps) heldExtra = { text: want, steps, t: now }; return want; };
    if (!h || steps < h.steps || want === h.text || save.dead || save.question || save.extraUrgent || EXTRA_URGENT.test(want)) return take();
    if (steps - h.steps >= 2 && now - h.t >= 2000) return take();
    if (steps - h.steps >= 2) setTimeout(draw, h.t + 2000 - now + 30);   // the turns are up: wait out the clock
    return h.text;
  }
  // Put back the fight or altar box that belongs to the run (after a cancelled question, a loaded password...).
  function restoreBoxes() { if (save) { if (nameBox()) return; encounterBox(); altarBox(); } }
  function draw() {
    if (!save) return;
    try { document.getElementById("screen").innerHTML = colorize(SMT.renderScreen(save, extraToShow())); }
    catch (err) {                                  // never freeze on a bad frame: say so, and keep the keys working
      console.error(err);
      document.getElementById("screen").textContent = "The screen could not be drawn. [R] begins a new run, [P] restores a password.";
    }
    // While the infinite-steps cheat is on, the line under the screen shows the room and the counters.
    document.getElementById("cheat").textContent = save.freeSteps ? RULES.debugInfo(save) : "";
    document.getElementById("ver").textContent = SMT.VERSION;
  }

  // Every player's run lives in their own browser and saves itself after every action.
  // (The repo's save.json is the chat run, played with /smt-screen; the page doesn't touch it.)
  const KEY = "daily-dungeon-run";
  let statusUntil = 0;
  function flashStatus() { statusUntil = Date.now() + 4000; setTimeout(draw, 4100); }
  const hstDate = () => SMT.localISO(save && save.tz);

  // The adventure log: every line that starts with "Day N." (steps, searches, new days, descents).
  function remember(before) {
    // Everything the player reads goes in the log: the day's omen (once), line 2 (every action, even a
    // repeat), what happened in a fight or a talk (the box lines), and line 3 when it changes.
    // Hidden numbers never go in. Follow-up lines are indented under the action they belong to.
    if (!save) return;
    const h = save.history = save.history || [];
    const stamp = "D" + String(save.day).padStart(3, "0") + " T" + String(save.steps || 0).padStart(3, "0") + "  ";
    const clean = t => String(t || "").replace(/^> /, "").replace(/^Day \d+\. /, "");
    const mem = save.logged = save.logged || {};
    if (save.omenText && save.omenText !== mem.omen) { mem.omen = save.omenText; h.push(stamp + "OMEN " + save.omenText.replace(/^> /, "")); }
    if (save.status && save.status !== mem.status) { mem.status = save.status; h.push(stamp + "STATUS " + clean(save.status)); }
    if (save.log && save.log !== before) h.push(stamp + clean(save.log));
    const round = JSON.stringify(save.round || []);
    if (save.round && save.round.length && round !== mem.round) save.round.forEach(l => h.push("            | " + l));
    mem.round = round;
    if (save.extra && save.extra !== mem.extra) h.push("            " + save.extra);
    mem.extra = save.extra;
    // About 70 bytes an entry: 20,000 entries is roughly 1.4 MB, well inside a browser's storage.
    if (h.length > 20000) h.splice(0, h.length - 20000);
  }

  function persist() {
    try {
      delete save.unsaved;
      save.saved = hstDate();
      localStorage.setItem(KEY, JSON.stringify(save));
    } catch (e) {
      save.unsaved = true;   // private window or storage blocked: play still works, it just won't last
    }
    flashStatus();
  }

  // Catch up with the real date (a new day, or a missed deadline), then save.
  function tick() {
    if (!save) return;
    const before = JSON.stringify(save), log = save.log;
    save = RULES.tick(save);
    if (JSON.stringify(save) !== before) { remember(log); persist(); }
    endLog();
  }
  // When the run ends (KURA falls, or a deadline passes), the log opens once by itself,
  // after any fight box has been closed.
  function endLog() {
    if (!save || !save.dead || save.endShown || !document.getElementById("found").hidden) return;
    save.endShown = true; persist();
    setTimeout(() => { if (save && save.dead && document.getElementById("found").hidden) toggleLog(true); }, 300);
  }

  // Before anything reads the clock, ask the server for the real time (the Date on its reply to a
  // quick HEAD request for this page). The device clock is used only if that fails or takes over 3s.
  async function syncTime() {
    try {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 3000);
      const t0 = Date.now();
      const r = await fetch(location.href, { method: "HEAD", cache: "no-store", signal: ctl.signal });
      clearTimeout(timer);
      const server = Date.parse(r.headers.get("Date") || "");
      const age = Number(r.headers.get("Age")) || 0;                 // a cache (CDN) says how old its copy is
      if (!isNaN(server)) SMT.setSkew(server + age * 1000 + 500 - (t0 + Date.now()) / 2);   // the header is whole seconds
    } catch (e) {}
  }
  // The leaderboard's address (the Cloudflare Worker, see leaderboard/README.md). Empty: every board button stays hidden.
  const LEADERBOARD_URL = "https://daily-dungeon-board.ddddungeon.workers.dev";
  async function start() {
    document.getElementById("ver").textContent = SMT.VERSION;
    await syncTime();
    let s = null, raw = null;
    const stash = suffix => { try { if (raw) localStorage.setItem(KEY + suffix, raw); } catch (e) {} };   // keep what we can't use, never just overwrite it
    try { raw = localStorage.getItem(KEY); s = JSON.parse(raw || "null"); } catch (e) { stash("-corrupt"); s = null; }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => window.dispatchEvent(new Event("resize")));   // popups are placed by measuring the font
    if (s && s.dungeon && s.dungeon.floor && s.dungeon.floor.v === 5 && s.party) {
      try { save = s; tick(); flashStatus(); draw(); if (!nameBox()) { encounterBox(); altarBox(); } return; }
      catch (err) { console.error(err); stash("-corrupt"); save = null; }
    } else if (s) stash("-old");
    save = RULES.reset({});
    save.history = [];
    remember("");
    persist(); draw(); nameBox();
  }

  // LOG: the run's adventure log, newest first. [C]LOSE, L or Escape closes it.
  // The log as plain text, for the download and copy buttons.
  let logText = "";
  function downloadLog() {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([logText], { type: "text/plain" }));
    a.download = `daily-dungeon-log-${hstDate()}.txt`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function copyLog(btn) {
    const done = ok => { if (btn) { btn.textContent = ok ? "COPIED" : "COPY FAILED"; setTimeout(() => btn.textContent = "C[O]PY", 1500); } };
    if (navigator.clipboard) navigator.clipboard.writeText(logText).then(() => done(true), () => done(false));
    else done(false);
  }
  // LEADERBOARD: post this run's score once, and read the top of the board. Ranked by floor, then days; TURNS are shown only.
  // THE NAME: asked when a run begins (and on an old save that has none). It follows PARTY in the sidebar and goes on the board.
  const needsName = () => !!(save && !save.dead && (!save.playerName || save.needName));
  function nameBox() {
    if (altarTimer) { clearInterval(altarTimer); altarTimer = null; }
    const box = document.getElementById("found"), pre = box.querySelector("pre");

    box.className = "foundbox inframe"; box.removeAttribute("style"); box.hidden = false;
    placeInView(box, 15);
    box.dataset.mode = "name";
    pre.innerHTML = "";
    const add = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; pre.appendChild(d); return d; };
    const PAD = " ".repeat(10), IN = 23, say = "> WHO ARE YOU?";
    add(PAD + ".-----------------------.", "artframe");
    const s1 = document.createElement("div"), s2 = document.createElement("div");
    s1.className = s2.className = "artframe screen";
    pre.append(s1, s2);
    add(PAD + "'-----------------------'", "artframe");
    add(" ", ""); add(" ", "");
    const row = document.createElement("div"), inp = document.createElement("input");
    inp.className = "nameinput"; inp.id = "playername"; inp.maxLength = 10; inp.spellcheck = false; inp.autocomplete = "off"; inp.value = save.playerName || "";
    row.append("  NAME  ", inp);

    add(" ");
    const go = document.createElement("div"), btn = document.createElement("span");
    btn.className = "btn"; btn.dataset.namego = "1"; btn.textContent = "  [ENTER] BEGIN"; go.appendChild(btn); pre.appendChild(go);
    // the terminal screen: line 1 types the question, line 2 is the same drifting wave as the altar's
    const WAVE = ["_", ".", "-", "'"];
    let tick = 0;
    const paint = () => {
      const typed = Math.min(say.length, Math.floor(tick / 2));
      let w = ""; for (let x = 0; x < IN; x++) w += WAVE[Math.round((Math.sin((x - tick * 0.35) * 2 * Math.PI / 11) + 1) / 2 * 3)];
      s1.textContent = PAD + "|" + (" " + say.slice(0, typed) + (typed >= say.length ? (Math.floor(tick / 8) % 2 === 0 ? "_" : " ") : "_")).padEnd(IN) + "|";
      s2.textContent = PAD + "|" + w + "|";

  function confirmName() {

    if (next === save) {                                   // not a good name: say so
      const w = document.getElementById("namewarn"), v = inp.value.trim();
      if (w) { w.textContent = !v ? "  TYPE A NAME FIRST." : v.length < 3 ? "  TOO SHORT: AT LEAST 3 CHARACTERS." : v.length > 10 ? "  TOO LONG: 10 CHARACTERS AT MOST." : "  LETTERS, NUMBERS, SPACE _ . - ONLY."; w.className = "demon"; }
      inp.focus(); return;
    }
    if (altarTimer) { clearInterval(altarTimer); altarTimer = null; }
    save = next; persist(); nameBox(); draw();
    restoreBoxes();
  }
  async function submitScore() {
    const msg = document.getElementById("scoremsg"), name = (save && save.playerName) || "";
    if (!LEADERBOARD_URL || !save || !save.dead || save.submitted || !msg) return;
    if (!/^[A-Za-z0-9 _.\-]{3,10}$/.test(name)) { msg.textContent = "NO NAME ON THIS RUN."; return; }
    msg.textContent = "SENDING...";
    try {
      const r = await fetch(LEADERBOARD_URL + "/score", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ ...RULES.score(save), name, version: SMT.VERSION }) });
      let d = {}; try { d = await r.json(); } catch (e) {}
      if (!r.ok || !d.ok) {
        msg.textContent = d.error === "origin" ? `THE BOARD DOES NOT ALLOW THIS PAGE (${d.seen || location.origin}). ADD IT TO ALLOW_ORIGIN.`
          : d.error === "slow down" ? "TOO MANY POSTS. TRY LATER." : d.error === "name" ? "THAT NAME IS NOT ALLOWED."
          : d.error === "invalid" ? "THE BOARD DID NOT LIKE THIS SCORE." : `THE BOARD ANSWERED ${r.status}.`;
        return;
      }

      toggleLog(true);

  // In X mode (the infinite-steps cheat) the board becomes an admin list: up/down pick a row, D deletes it (needs the Worker's ADMIN_KEY).
  let boardData = null, boardSel = 0;
  function boardHead(pre, rest) {                  // "LEADERBOARD ... [C]LOSE", the close as a real button
    const c = document.createElement("span"); c.className = "btn"; c.dataset.close = "1"; c.textContent = "[C]LOSE";
    pre.textContent = ""; pre.append("LEADERBOARD".padEnd(41), c, "\n" + rest);
  }
  function renderBoard() {
    const pre = document.querySelector("#board pre"), d = boardData, admin = !!(save && save.freeSteps);
    const row = (rank, x, sel) => `${sel ? ">" : x.you ? (admin ? "*" : ">") : " "} ${String(rank).padStart(3)}  ${x.name.toUpperCase().padEnd(10)}  ${("B" + x.floor + "F").padEnd(5)} ${String(x.days).padStart(4)}  ${String(x.demons).padStart(6)}  ${String(x.turns).padStart(6)}`;
    const lines = ["", "  RANK  NAME        FLOOR  DAYS  DEMONS   TURNS", ""];
    d.rows.forEach((x, i) => lines.push(row(i + 1, x, admin && i === boardSel)));
    if (!d.rows.length) lines.push("  Nobody yet.");
    if (d.you) lines.push("  ...", row(d.you.rank, { ...d.you, you: true }));

  async function loadBoard() {
    const pre = document.querySelector("#board pre");
    try {
      const r = await fetch(`${LEADERBOARD_URL}/top?n=20&run=${encodeURIComponent((save && save.runId) || "")}`);
      boardData = await r.json(); boardSel = Math.max(0, Math.min(boardSel, boardData.rows.length - 1)); renderBoard();
    } catch (e) { console.error("board", e.message); boardData = null; boardHead(pre, "\nCOULD NOT REACH THE BOARD."); }
  }
  async function deleteEntry() {
    const x = boardData && boardData.rows[boardSel];
    if (!x || !save || !save.freeSteps) return;
    let key = ""; try { key = localStorage.getItem("dd-admin") || ""; } catch (e) {}
    if (!key) { key = prompt("Admin key:") || ""; if (!key) return; }
    if (!confirm(`Delete ${x.name} (B${x.floor}F, ${x.days} days) from the board?`)) return;
    try {
      const r = await fetch(`${LEADERBOARD_URL}/score?id=${x.id}`, { method: "DELETE", headers: { "x-admin-key": key } });
      if (r.status === 403) { try { localStorage.removeItem("dd-admin"); } catch (e) {} alert("That key was not accepted."); return; }
      try { localStorage.setItem("dd-admin", key); } catch (e) {}
    } catch (e) { alert("Could not reach the board."); return; }
    loadBoard();
  }
  async function toggleBoard(force) {

  function toggleLog(force) {
    const box = document.getElementById("log");

    box.hidden = !open;
    if (open) {
      const h = (save && save.history) || [];
      // After the run ends, the log opens on its own with a short epitaph on top.
      const end = save && save.dead ? `THE RUN IS OVER.  ${save.floor}, day ${save.day}, turn ${save.steps || 0}.\n` +
        `${(save.log || "").replace(/^> (Day \d+\. )?/, "")}\n\n` +
        RULES.summary(save).map(([k, v]) => "  " + (k + " ").padEnd(15, ".") + " " + v).join("\n") +
        "\n\n" : "";
      // The CODEX opens from here: a button at the top of the log.
      const pre = box.querySelector("pre");
      logText = "DAILY DIGITAL DEMON DUNGEON " + SMT.VERSION + "  -  " + hstDate() + "\n\n" + end + "ADVENTURE LOG  (" + h.length + " entries)   D = day, T = turn\n\n" +
        // Newest first, but each action keeps its follow-up lines underneath it.
        (h.length ? h.reduce((g, l) => (/^ /.test(l) && g.length ? g[g.length - 1].push(l) : g.push([l]), g), [])
          .reverse().map(g => g.join("\n")).join("\n") : "Nothing yet.") + (save && save.dead ? "\n\n[R]ESET begins a new run." : "");
      const shown = logText.slice(logText.indexOf("\n\n") + 2), hAt = shown.indexOf("ADVENTURE LOG"), hEnd = shown.indexOf("\n\n", hAt);
      pre.textContent = "";

      const button = (label, key) => { const b = document.createElement("span"); b.className = "btn"; b.dataset[key] = "1"; b.textContent = label; return b; };
      const top = document.createElement("div");
      top.style.textAlign = "right";
      top.append(button("[D]OWNLOAD", "download"), "   ", button("C[O]PY", "copy"), "   ", button("[C]LOSE", "close"));
      // Once a run is over (and a board is set up) the player can post it under a name, once.
      const post = [];
      if (LEADERBOARD_URL && save && save.dead) {
        const row = document.createElement("div");
        row.className = "submitrow";

        else {
          row.append(button(`[P]OST YOUR HIGH SCORE AS ${String(save.playerName || "?").toUpperCase()}`, "submit"), document.createElement("br"), button("[B]OARD", "board"));
        }

  // PASS: the run's password, like old console games: copy it to keep or move the run; paste one to continue it.
  function backup() {
    if (!save) return;
    // The code carries the run and the last 300 log entries, so it stays short enough to copy.
    const code = btoa(unescape(encodeURIComponent(JSON.stringify({ ...save, history: (save.history || []).slice(-300) }))));
    const box = document.getElementById("found"), pre = box.querySelector("pre");
    floatBox(box);
    pre.innerHTML = "";
    const add = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; pre.appendChild(d); return d; };
    const field = (v, ro) => { const t = document.createElement("textarea"); t.rows = 3; t.value = v; t.readOnly = !!ro; t.spellcheck = false; t.className = "passfield"; pre.appendChild(t); return t; };
    const btn = (t, a) => { const e = document.createElement("span"); e.textContent = t; e.className = "btn"; e.dataset.pact = a; return e; };
    add("PASSWORD", "gold"); add(" ");
    add("Copy it to keep this run or move it to another device.");
    const mine = field(code, true);
    add(" ");
    add("To continue a run, paste its password here.");
    const theirs = field("", false);
    const msg = add(" ");
    const row = document.createElement("div");
    row.append(btn("[ COPY ]", "copy"), "   ", btn("[ LOAD ]", "load"), "   ", btn("[ CLOSE ]", "close"));
    pre.appendChild(row);
    box.dataset.mode = "pass";
    box.hidden = false;
    passAct = a => {
      if (a === "close") { box.hidden = true; draw(); return; }
      if (a === "copy") {
        mine.select();
        const ok = () => { msg.textContent = "Copied."; }, no = () => { try { document.execCommand("copy"); ok(); } catch (e) { msg.textContent = "Select the text above and copy it."; } };
        try { navigator.clipboard.writeText(code).then(ok, no); } catch (e) { no(); }
        return;
      }
      const got = theirs.value.trim();
      if (!got || got === code) { msg.textContent = got ? "That is this run already." : "Paste a password first."; return; }
      try {
        const s = JSON.parse(decodeURIComponent(escape(atob(got))));
        if (!s.dungeon || !s.party || !s.dungeon.floor || s.dungeon.floor.v !== 5) throw new Error("not a run");
        const trial = JSON.parse(JSON.stringify(s)); RULES.tick(trial); SMT.renderScreen(trial, "");      // it must really run, not just parse
        loadCode = s;
        askBox("load", "REPLACE THIS RUN?", ["The run in the password takes this one's place."]);
      } catch (e) { msg.textContent = "That password didn't work. Nothing was changed."; }
    };
  }
  let passAct = null;

  // Doors: open ones are free, a locked one takes the day's key. SEARCH is unlimited, turning is free. X (infinite steps) and Shift+X (next day) are hidden testing cheats.
  // INVOKE: the inventory. Press a number (or click a line) to use an item; I or Escape closes it.
  let invList = [], invSel = 0, logGlow = false, ichorPick = -1;   // ichorPick: who the picker is on (-1: closed)
  // A box drawn in text, 72 wide: a title row (name left, tag right), then wrapped lines.
  function textBox(title, tag, lines, W = 70) {
    const out = ["+" + "-".repeat(W + 2) + "+"];
    const row = t => out.push("| " + t.padEnd(W) + " |");
    title = title.toUpperCase();
    if (title.length + tag.length + 2 <= W) row(title.padEnd(W - tag.length) + tag);
    else { row(title.slice(0, W)); if (tag) row(tag.padStart(W)); }
    for (const l of lines) {
      if (l === "") { row(""); continue; }
      let rest = l;
      while (rest.length > W) { const cut = rest.lastIndexOf(" ", W); row(rest.slice(0, cut)); rest = rest.slice(cut + 1); }
      row(rest);
    }
    out.push("+" + "-".repeat(W + 2) + "+");
    return out;
  }
  // Fit a popup exactly over the 3D view: screen rows 6-22, columns 1-47.

    const scr = document.getElementById("screen"), r = scr.getBoundingClientRect();
    const rows = scr.textContent.split("\n").length, rh = r.height / rows, cw = r.width / 80;
    Object.assign(box.style, { left: scr.offsetLeft + cw + "px", top: scr.offsetTop + 6 * rh + "px",
      width: 47 * cw + "px", height: tall * rh + "px", padding: `${rh / 2}px ${cw}px` });
  }

      text: "Demon blood and old light. Heals demons. Not meant for KURA." });

  document.getElementById("about").addEventListener("click", e => {

  // CODEX: every demon met and item found, over all runs. Unknown ones show as ???.
  let codexTab = "demons", codexSel = 0;
  function showCodex(open) {
    const box = document.getElementById("codex");
    box.hidden = !open;
    if (!open || !save) return;
    const data = RULES.codex(save)[codexTab];
    const flat = data.flatMap(g => g.entries.map(e => ({ ...e, group: g.group })));
    if (codexSel === -1) codexSel = Math.max(0, flat.findIndex(x => x.known));   // a fresh tab opens on its first known entry
    codexSel = (codexSel + flat.length) % flat.length;
    const known = flat.filter(e => e.known).length;
    const pre = box.querySelector("pre");
    pre.innerHTML = "";
    const add = (txt, cls, i) => { const d = document.createElement("div"); d.textContent = txt; if (cls) d.className = cls; if (i !== undefined) d.dataset.i = i; pre.appendChild(d); return d; };
    // Header with the two tabs.
    const head = add("");
    // The open tab is bright; the other is dim.
    const tab = (t, label) => { const sp = document.createElement("span"); sp.textContent = label; sp.className = "btn " + (codexTab === t ? "sel" : "dim"); sp.dataset.tab = t; return sp; };
    head.append("CODEX     ", tab("demons", "[D]EMONS"), "   ", tab("items", "[I]TEMS"),
      `          ${codexTab === "demons" ? "DEMONS MET" : "ITEMS FOUND"} ${known} / ${flat.length}`);
    add(" ");
    const e = flat[codexSel];
    const cls = "";
    (e.known ? textBox(e.name, e.tag, [...e.lines, "", e.count]) : textBox("???", "", ["Not found yet."])).forEach(l => add(l, cls));
    add(" ");
    let last = null;
    flat.forEach((x, i) => {
      if (x.group !== last) { last = x.group; add(x.group.toUpperCase(), "dim"); }

      if (final) {
        if (e.stage === "chat") left.append(opt("[Y]ES", "yes"), "   ", opt("[N]O", "no"), "   ", opt("[S]ILENT", "silent"));   // a third answer: say nothing
        else if (e.stage === "ask" || e.stage === "join") left.append(opt("[Y]ES", "yes"), "   ", opt("[N]O", "no"));
        else if (e.stage === "swap") {
          save.party.forEach((p, i) => { if (i > 0) left.append(opt(`[${i + 1}] ${p.name}`, "swap-" + i), "   "); });
          left.append(opt("[N]O", "swap-none"));
        } else left.append(opt("[F]IGHT", "fight"), "   ", opt("[T]ALK", "talk"), "   ", opt("[G]IVE", "offer"), "   ", (() => { const r = opt("[R]UN", "run"); if (save.encounter.ranTried || !["N", "E", "S", "W"].some(d => RULES.available(save)[d])) r.className += " off"; return r; })());
      }
      row.append(left);
      pre.appendChild(row);
    };

    if (animate && lines.length > 1 && !e.stage) {     // play the round back: the > moves to whoever acts
      // The round plays one line at a time. After each, a blinking _ waits for a click (or Enter / Space) before the next line rolls in.
      let n = 1;
      const show = () => { replayWait = true; frame(n, isDemon(lines[n - 1]) ? "demon" : null, false); replayWait = false; };
      replayAdvance = () => {
        n++;
        if (n >= lines.length) { replayTimer = null; replayAdvance = null; frame(lines.length, null, true); return; }
        show();
      };
      replayTimer = -1;                       // a stand-in: "a replay is waiting" (clearInterval on it is harmless)
      show();
      return true;
    }
    frame(lines.length, null, true);
    return true;
  }

  function act(name) {
    const okHold = holdOK, okReset = resetOK, okDis = dischargeOK; holdOK = resetOK = dischargeOK = false;      // a confirmation is good for this one call only
    if (replayTimer) finishReplay();
    prevDemonHp = save && save.encounter ? save.encounter.hp : null;
    prevKuraHp = save && save.encounter && save.party && save.party[0] ? save.party[0].hp : null;
    // [^] toward a bare wall is just a search of that wall; toward a door it takes the step.
    if (name === "forward" && save) {
      if (save.encounter) return;                  // in a fight, running is the [R]UN button in the fight box
      name = !RULES.available(save).door[save.facing] ? "search" : "go-" + save.facing;
    }
    if (save && save.encounter && (name === "left" || name === "right")) return;      // no turning around mid-fight
    if ((name === "qyes" || name === "qno" || name === "qsilent") && save) {
      const log = save.log, partyBefore = (save.party || []).map(p => p.name);
      save = RULES.reply(save, name === "qsilent" ? "silent" : name === "qyes");
      heldExtra = null;                    // the answer's line goes up at once, not behind the old question
      remember(log); persist(); draw();
      const gone = partyBefore.filter(n => !(save.party || []).some(p => p.name === n));
      if (gone.length) noticeBox([`${gone.join(" and ")} leaves the party.`, save.extra.replace(/^> /, "")]);      // someone left over the answer
      return;
    }
    // A party member's question waits for [Y]ES or [N]O: nothing else moves the game on until it's answered
    // (the bag, codex, log, help and password still open, so the player can think it over).
    if (save && save.question && /^(search|hold|left|right|forward|run|fight|talk|altar|go-)/.test(name)) {
      document.querySelectorAll(".btn.ask").forEach(el => { el.classList.remove("nudge"); void el.offsetWidth; el.classList.add("nudge"); });
      return;
    }
    if (name === "run" && save && save.encounter && save.encounter.ranTried) { save.log = "> KURA already tried to run. FIGHT, TALK, or GIVE."; persist(); draw(); encounterBox(); return; }
    if (name === "run" && save && save.encounter) {
      // Running takes any way out, whichever way KURA faces: an open door first, a locked one (it takes the key) if that's all there is.
      const can = RULES.available(save), out = ["N", "E", "S", "W"].filter(d => can[d]), free = out.filter(d => !can.locked[d]);
      const pool = free.length ? free : out;
      if (!pool.length) { save.log = "> There is no way out today. FIGHT, TALK, or GIVE."; persist(); draw(); encounterBox(); return; }
      name = "go-" + pool[Math.floor(Math.random() * pool.length)];
    }
    if (name !== "invoke" && name !== "codex") logGlow = false;
    if (name.startsWith("go-") && save) {
      const dir = name.slice(3);
      if (armed !== dir && RULES.available(save)[dir] && RULES.isLocked(save, dir)) {   // only a locked door asks: it takes the key
        disarm(); armed = dir;
        draw(); confirmBox(dir);
        return;
      }
    }
    disarm();
    if (name === "invoke") {
      const closing = !document.getElementById("inv").hidden;
      if (save && save.encounter && !closing) document.getElementById("found").hidden = true;   // the fight box comes back after
      showInv(!closing);
      if (closing && save && save.encounter) encounterBox();   // closing the bag from the menu brings the fight box back too
      return;
    }
    if (name === "log") return toggleLog();
    if (name === "board") return LEADERBOARD_URL ? toggleBoard() : undefined;
    if (name === "about") return showAbout(document.getElementById("about").hidden);
    if (name === "codex") { codexSel = -1; return showCodex(document.getElementById("codex").hidden); }
    if (name === "backup") return backup();
    if (!save) return;
    if (name === "reset") { if (!okReset) { resetBox(); return; } }
    if (name === "hold") { if (!okHold) { holdBox(); return; } }
    if (name === "discharge") {
      if (!save.encounter) return;
      if (!RULES.chargeLeft(save)) { save.log = "> The cell is empty. Nothing left to discharge."; persist(); draw(); encounterBox(); return; }
      if (!okDis) { dischargeBox(); return; }
    }
    const log = save.log, steps = save.steps, exBefore = save.extra, ranBefore = !!(save.encounter && save.encounter.ranTried), partyBefore = (save.party || []).map(p => p.name);
    const before = { items: (save.items || []).slice(), silver: save.silver };
    save = name === "yes" ? RULES.answer(save, true) : name === "no" ? RULES.answer(save, false) : name === "silent" ? RULES.answer(save, "silent")
      : name.startsWith("give-") ? RULES.give(save, name === "give-none" ? null : Number(name.slice(5)))
      : name.startsWith("offer-") ? RULES.offerGive(save, name === "offer-none" ? null : Number(name.slice(6)))
      : name.startsWith("swap-") ? RULES.swap(save, name === "swap-none" ? null : Number(name.slice(5)))
      : name === "altar" ? RULES.altarOpen(save)
      : name === "altar-next" ? RULES.altarNext(save)
      : name.startsWith("altar-") ? RULES.altarGive(save, name === "altar-none" ? null : Number(name.slice(6)))
      : name === "left" ? RULES.turn(save, "L") : name === "right" ? RULES.turn(save, "R")
      : name.startsWith("go-") ? RULES.go(save, name.slice(3)) : RULES[name](save);
    if (name === "reset") {
      save.history = [];
      if (altarTimer) { clearInterval(altarTimer); altarTimer = null; }
      heldExtra = null; logGlow = false; invSel = 0; queuedNotice = null;
    }
    remember(name === "reset" || save.steps !== steps ? "" : log);
    persist(); draw();
    if (name === "reset" && nameBox()) return;
    // A blocked run says so in a box that waits for [ OK ]; then the fight box plays the demon's reply.
    if (name !== "reset" && save.encounter && save.encounter.ranTried && !ranBefore && !save.dead) {
      blockedRun = true; noticeBox([`${save.encounter.name} blocked your way.`]);
      return;
    }
    if (name !== "reset" && !encounterBox(true) && !altarBox()) {
      foundBox(before);
      // Nothing else opened: if this action brought something significant, say so in a box.
      if (!save.encounter) {
        const lines = [];
        // Someone left the party (the log line can be hidden behind a repeat, so go by the party itself).
        const gone = partyBefore.filter(n => !(save.party || []).some(p => p.name === n));
        if (gone.length) lines.push(`${gone.join(" and ")} leaves the party.`);
        else if (save.log !== log && SIGNIFICANT.test(save.log)) lines.push(save.log.replace(/^> /, ""));
        if (save.extra && save.extra !== exBefore && (gone.length || SIGNIFICANT.test(save.extra))) lines.push(save.extra.replace(/^> /, ""));
        if (lines.length) {
          if (document.getElementById("found").hidden) noticeBox(lines);
          else if (gone.length) queuedNotice = lines;      // something else is open (a find, say): the exit waits its turn
        }
      }
    }
  }

  document.getElementById("screen").addEventListener("click", e => {
    const fb = document.getElementById("found");
    if (!fb.hidden && fb.dataset.mode !== "encounter") return;   // a box waiting for its answer: the buttons behind it do nothing
    const b = e.target.closest(".btn");
    if (!b || (b.classList.contains("off") && b.dataset.act !== "forward")) return;
    act(b.dataset.act);
  });
  document.getElementById("log").addEventListener("click", e => {
    if (e.target.closest("[data-submit]")) return submitScore();
    if (e.target.closest("[data-board]")) { toggleLog(false); return toggleBoard(true); }
    if (e.target.closest(".submitrow")) return;                      // typing a name must not close the log
    if (e.target.closest("[data-download]")) return downloadLog();
    if (e.target.closest("[data-copy]")) return copyLog(e.target.closest("[data-copy]"));
    if (e.target.closest("[data-close]")) toggleLog(false);          // only [C]LOSE (or C, L, Esc): never a click anywhere
  });
  document.getElementById("board").addEventListener("click", e => { if (e.target.closest("[data-close]")) toggleBoard(false); });
  document.getElementById("found").addEventListener("click", e => {
    if (document.getElementById("found").dataset.mode === "name") { if (e.target.closest("[data-namego]")) confirmName(); return; }
    if (replayTimer) return replayAdvance ? replayAdvance() : finishReplay();     // a click brings in the next line
    if (e.target.closest("[data-intro]")) return introOK();
    const mode = document.getElementById("found").dataset.mode;
    if (mode === "intro") return;
    const pa = e.target.closest("[data-pact]");
    if (pa && passAct) return passAct(pa.dataset.pact);
    if (mode === "pass") return;                 // clicking a field to paste must not close the box
    const c = e.target.closest("[data-cact]");
    if (c) return answerConfirm(c.dataset.cact === "yes");
    if (mode === "confirm") return;                  // only its YES / NO buttons (or the keys): a stray click is not an answer
    const b = e.target.closest("[data-fact]");
    if (b) act(b.dataset.fact);
    else if (mode === "found" || mode === "done") { if (e.target.closest(".btn")) closeFound(); }   // only its [ OK ]
    else if (mode === "altar" && save.altar && save.altar.script && !save.altar.result && save.altar.page < save.altar.script.length - 1) act("altar-next");   // a click brings the terminal's next line
    else if (mode === "altar" || mode === "encounter") return;                   // their own buttons only
    else if (e.target.closest(".btn")) closeFound();   // any other box: only its [ OK ]
  });
  // Clicking an item chooses it; clicking the chosen one again uses it. Only [C]LOSE, I or Esc closes it.
  document.getElementById("inv").addEventListener("click", e => {
    if (e.target.closest("[data-use]")) return useInv(invSel);
    if (e.target.closest("[data-close]")) { showInv(false); if (save && save.encounter) encounterBox(); return; }
    if (e.target.closest("[data-codex]")) { showInv(false); codexSel = -1; return showCodex(true); }
    const line = e.target.closest("[data-i]");
    if (ichorPick >= 0) { if (!line) { ichorPick = -1; return showInv(true); } const n = Number(line.dataset.i); if (n === ichorPick) return useInv(invSel, n || "0"); ichorPick = n; return showInv(true); }
    if (!line) return;                                    // no click-to-close here: only [C]LOSE, I or Esc
    const i = Number(line.dataset.i);
    if (i === invSel) useInv(i); else { invSel = i; showInv(true); }
  });
  document.getElementById("codex").addEventListener("click", e => {
    const tab = e.target.closest("[data-tab]"), line = e.target.closest("[data-i]");
    if (tab) { codexTab = tab.dataset.tab; codexSel = -1; showCodex(true); }
    else if (line) { codexSel = Number(line.dataset.i); showCodex(true); }
    else if (e.target.closest("[data-close]")) showCodex(false);     // only [C]LOSE (or C, Esc)
  });
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const key = e.key.toLowerCase();
    if (e.target && e.target.tagName === "INPUT") { if (key === "enter") { e.preventDefault(); confirmName(); } return; }   // typing the name
    if (needsName()) { const i = document.getElementById("playername"); if (i) i.focus(); if (key === "enter") confirmName(); return; }   // nothing else works until the run has a name
    const fbox = document.getElementById("found");
    if (!fbox.hidden && fbox.dataset.mode === "intro") { e.preventDefault(); if (key === "enter") introOK(); return; }
    if (!fbox.hidden && fbox.dataset.mode === "pass") { if (key === "escape") passAct("close"); return; }   // typing and pasting go to the fields
    if (!fbox.hidden) {
      if (!/^(tab|f\d+)$/.test(key)) e.preventDefault();
      if (e.repeat) return;                        // holding a key can't answer a box
      if (fbox.dataset.mode === "confirm") {
        answerConfirm(key === "enter" || key === "y" || (key === "arrowup" && !!armed));     // anything else is NO
        return;
      }
      if (fbox.dataset.mode === "altar") {
        const A = save.altar || {};
        let k;
        const speaking = !A.result && !A.used && A.script && A.page < A.script.length - 1;
        if (speaking) k = { enter: "altar-next", " ": "altar-next", escape: "altar-none", b: "altar-none" }[key];
        else if (A.result || A.used) k = { enter: "altar-none", " ": "altar-none", escape: "altar-none", b: "altar-none" }[key];
        else k = /^[1-6]$/.test(key) ? "altar-" + (Number(key) - 1) : { b: "altar-none", escape: "altar-none" }[key];
        if (k) act(k);
        return;
      }
      if (fbox.dataset.mode === "encounter" && replayAdvance && (key === "enter" || key === " ")) { e.preventDefault(); replayAdvance(); return; }
      if (fbox.dataset.mode === "encounter") {
        const st2 = save.encounter && save.encounter.stage;
        let k;
        if (st2 === "gift") k = /^[1-8]$/.test(key) ? "give-" + (Number(key) - 1) : { n: "give-none", escape: "give-none" }[key];
        else if (st2 === "offer") k = /^[1-8]$/.test(key) ? "offer-" + (Number(key) - 1) : { b: "offer-none", n: "offer-none", escape: "offer-none" }[key];
        else if (st2 === "chat") k = { y: "yes", enter: "yes", n: "no", s: "silent", escape: "no" }[key];
        else if (st2 === "ask" || st2 === "join") k = { y: "yes", enter: "yes", n: "no", escape: "no" }[key];
        else if (st2 === "swap") k = { "2": "swap-1", "3": "swap-2", "4": "swap-3", n: "swap-none", escape: "swap-none" }[key];
        else k = { f: "fight", t: "talk", g: "offer", i: "invoke", r: "run" }[key];
        if (k) act(k);
      } else if (fbox.dataset.mode === "found" || fbox.dataset.mode === "done") { if (key === "enter") closeFound(); }   // a find only closes on its [ OK ] (Enter or a click), never by a stray key
      else if (key === "enter" || key === " " || key === "escape") closeFound();
      return;
    }
    if (!document.getElementById("about").hidden) {
      e.preventDefault();
      if (key === "?" || key === "escape") showAbout(false);
      else if (key === "c") { showAbout(false); codexSel = -1; showCodex(true); }
      else if (key === "b" && LEADERBOARD_URL) { showAbout(false); toggleBoard(true); }
      return;
    }
    if (!document.getElementById("codex").hidden) {
      e.preventDefault();
      if (key === "c" || key === "escape") showCodex(false);
      else if (key === "d" || key === "i") { codexTab = key === "d" ? "demons" : "items"; codexSel = -1; showCodex(true); }
      else if (key === "arrowdown" || key === "arrowup") { codexSel += key === "arrowdown" ? 1 : -1; showCodex(true); }
      else if (key === "arrowleft" || key === "arrowright") { codexTab = codexTab === "demons" ? "items" : "demons"; codexSel = -1; showCodex(true); }
      return;
    }
    if (!document.getElementById("inv").hidden) {
      if (ichorPick >= 0) {
        e.preventDefault();
        const n = save.party.length;
        if (key === "escape") ichorPick = -1;
        else if (key === "arrowdown" || key === "arrowup") ichorPick = (ichorPick + (key === "arrowdown" ? 1 : n - 1)) % n;
        else if (/^[1-9]$/.test(key) && Number(key) <= n) ichorPick = Number(key) - 1;
        else if (key === "enter") return useInv(invSel, ichorPick || "0");
        return showInv(true);
      }
      if (key === "i" || key === "c" || key === "escape") { e.preventDefault(); showInv(false); if (save && save.encounter) encounterBox(); }
      else if (/^[1-9]$/.test(key)) { e.preventDefault(); invSel = Number(key) - 1; showInv(true); }
      else if (key === "arrowdown" || key === "arrowup") { e.preventDefault(); invSel += key === "arrowdown" ? 1 : -1; showInv(true); }
      else if (key === "enter") { e.preventDefault(); useInv(invSel); }
      return;
    }
    if (!document.getElementById("board").hidden) {
      e.preventDefault();
      if (key === "c" || key === "b" || key === "escape") toggleBoard(false);
      else if (save && save.freeSteps && boardData && (key === "arrowdown" || key === "arrowup")) { boardSel = (boardSel + (key === "arrowdown" ? 1 : boardData.rows.length - 1)) % Math.max(1, boardData.rows.length); renderBoard(); }
      else if (key === "d" && save && save.freeSteps) deleteEntry();
      return;
    }
    if (!document.getElementById("log").hidden) {
      if (key === "l" || key === "c" || key === "escape") { e.preventDefault(); toggleLog(false); }
      else if (key === "enter" || key === "p") { e.preventDefault(); submitScore(); }
      else if (key === "o") { e.preventDefault(); copyLog(document.querySelector("#log [data-copy]")); }
      else if (key === "d") { e.preventDefault(); downloadLog(); }
      return;
    }
    // S is SEARCH now; the day's step is [^] or the up arrow (the compass keys are gone with the NSEW buttons).
    if (save && save.question && (key === "y" || key === "n" || key === "s")) { e.preventDefault(); return act(key === "y" ? "qyes" : key === "n" ? "qno" : "qsilent"); }
    const k = { "?": "about", c: "codex", f: "fight", t: "talk", i: "invoke", l: "log", b: "board", p: "backup", r: "reset",
      s: "search", n: "hold", g: "altar", arrowup: "forward", arrowleft: "left", arrowright: "right" }[key];
    if (key === "x") { e.preventDefault(); return act(e.shiftKey ? "next" : "freesteps"); }   // testing cheats: X toggles infinite steps, Shift+X jumps a day
    if (k) { e.preventDefault(); act(k); }
  });

  start();
  // Live clock: redraw the moment the minute turns over (the colon blinks on its own),
  // and catch up with the real date so midnight brings the new day.
  let shownMinute = SMT.now().getMinutes();
  setInterval(() => {
    const m = SMT.now().getMinutes();
    if (m !== shownMinute) { shownMinute = m; tick(); draw(); }
  }, 1000);
</script>
</body>
</html>
