<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090a;
    --fg: #c8d6c0;
    --dim: #4f5d52;
    --bright: #f4f7e8;
    --demon: #e0564a;
    --gold: #e3b341;
    --moon: #9fc4ff;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    font-family: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  .frame { max-width: 100%; overflow-x: auto; }
  pre {
    margin: 0; font-family: inherit; line-height: 1.05;
    font-size: clamp(6px, calc((100vw - 32px) / 49), 20px); white-space: pre;
    text-shadow: 0 0 4px rgba(200, 214, 192, 0.25);
  }
  .you { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .demon { color: var(--demon); }
  .gold { color: var(--gold); }
  .visited { color: var(--dim); }
  .moon { color: var(--moon); }
  .note { margin-top: 12px; color: var(--dim); font-size: clamp(12px, 3vw, 18px); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="frame"><pre id="screen">LOADING SAVE...</pre></div>
  <div class="note" id="note"></div>
<script src="screen.js"></script>
<script>
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let save = null;

  // Color only the minimap rows (right panel) and the moon marker.
  function colorize(text) {
    const lines = text.split("\n");
    return lines.map((line, i) => {
      if (i >= 16 && i <= 19) {
        const left = esc(line.slice(0, 49)), right = line.slice(49);
        const map = right.replace(/[@^<>v&$.?]/g, ch => {
          const cls = { "@": "you", "^": "you", "<": "you", ">": "you", "v": "you", "&": "demon", "$": "gold", ".": "visited", "?": "visited" }[ch];
          return `<span class="${cls}">${esc(ch)}</span>`;
        });
        return left + map;
      }
      if (i === 4) return esc(line).replace("^^^", '<span class="moon">^^^</span>');
      return esc(line);
    }).join("\n");
  }

  function draw() {
    if (!save) return;
    document.getElementById("screen").innerHTML = colorize(SMT.renderScreen(save, save.extra || ""));
  }

  fetch("save.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(s => {
      save = s; draw();
      document.getElementById("note").textContent = s.saved ? `LAST SAVED ${s.saved}` : "";
      setInterval(draw, 30000);
    })
    .catch(() => { document.getElementById("screen").textContent = "NO SAVE FOUND."; });
</script>
</body>
</html>
