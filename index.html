<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090a;
    --fg: #e4e4df;
    --dim: #4f5d52;
    --trail: #8f8f8a;
    --bright: #ffffff;
    --demon: #e0564a;
    --gold: #e3b341;
    --moon: #9fc4ff;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    font-family: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  .frame { max-width: 100%; overflow-x: auto; }
  pre {
    margin: 0; font-family: inherit; line-height: 1.05;
    font-size: clamp(6px, calc((100vw - 32px) / 49), 22px); white-space: pre;
    text-shadow: 0 0 4px rgba(228, 228, 223, 0.2);
  }
  .you { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .demon { color: var(--demon); }
  .gold { color: var(--gold); }
  .visited { color: var(--dim); }
  .moon { color: var(--moon); }
  /* The clock's colon blinks slowly (1s on, 1s off); hidden, it still keeps its space. */
  .colon { animation: blink 2s steps(1) infinite; }
  /* The weekday kanji takes exactly two character cells, so the frame stays straight. */
  /* Like .cell: the box keeps the screen font so 2ch is two grid cells; only the glyph switches font. */
  .kanji { display: inline-block; width: 2ch; text-align: center; overflow: visible; white-space: nowrap; }
  .kanji .g { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "MS Gothic", sans-serif; line-height: 0; }
  @keyframes blink { 50% { visibility: hidden; } }
  .stairs { color: var(--moon); }
  .goal { color: var(--gold); text-shadow: 0 0 6px var(--gold); }
  /* Map symbols like □ ⋰ ⋱ ↑ ↓ can be wider or narrower than letters in some fonts.
     Boxing each one to exactly one character keeps the grid lined up. */
  /* .cell keeps the screen's own font so 1ch equals exactly one character of the grid;
     only the glyph inside it switches to a font that has the symbol. */
  .cell { display: inline-block; width: 1ch; text-align: center; overflow: visible; white-space: nowrap; }
  .cell .g { font-family: "DejaVu Sans Mono", Menlo, Consolas, "Segoe UI Symbol", monospace; line-height: 0; }
  .room { color: var(--trail); }
  .door { color: var(--trail); }
  .btn { cursor: pointer; color: var(--bright); }
  .btn:hover { background: var(--fg); color: var(--bg); }
  .btn.off { color: var(--dim); }
  .btn.armed { background: var(--gold); color: var(--bg); }
  .btn.flee { color: var(--bright); text-shadow: 0 0 8px var(--bright), 0 0 2px var(--bright); animation: blink 1.2s steps(1) infinite; }
  .runlabel { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .unsaved { color: var(--gold); }
  .frame { position: relative; }
  .logview { position: absolute; inset: 0; background: rgba(7, 9, 10, 0.96); overflow: auto; cursor: pointer;
    border: 1px solid var(--trail); box-sizing: border-box; padding: 1.5em 2ch; }
  .logview pre { white-space: pre-wrap; }
  .logview .sel { color: var(--bright); }
  /* INVOKE opens inside the 3D view (rows 6-22, columns 1-47); placeInView() sizes it to that area. */
  .viewpop { position: absolute; background: var(--bg); overflow: auto; cursor: pointer; box-sizing: border-box;
    outline: 1px solid var(--trail); }
  .viewpop pre { white-space: pre; }
  .logview .dim { color: var(--trail); }
  .foundbox { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); background: var(--bg);
    border: 1px solid var(--gold); padding: 1em 3ch; cursor: pointer; box-shadow: 0 0 24px rgba(227, 179, 65, 0.25); }
  .foundbox pre { white-space: pre; text-align: center; }
  .foundbox .gold { color: var(--gold); }
  /* Rarity colors, Diablo-style. */
  .lit { color: var(--moon); text-shadow: 0 0 6px var(--moon); animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.55; text-shadow: 0 0 2px var(--moon); } }
  .mframe { color: var(--trail); }
  .step { color: var(--bright); }
  .pull { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .t-COMMON { color: var(--fg); } .t-UNCOMMON { color: #7bd88f; } .t-RARE { color: #6aa9ff; }
  .t-MYTHIC { color: var(--gold); text-shadow: 0 0 6px var(--gold); } .t-MOON { color: #dfe9ff; text-shadow: 0 0 8px #9fc4ff; }
  .foundbox .demon { color: var(--demon); }
  .facing { color: var(--bright); }
  .saved { color: var(--fg); }
</style>
</head>
<body>
  <div class="frame"><pre id="screen">LOADING...</pre>
    <div id="log" class="logview" hidden><pre></pre></div>
    <div id="inv" class="viewpop" hidden><pre></pre></div>
    <div id="codex" class="logview" hidden><pre></pre></div>
    <div id="found" class="foundbox" hidden><pre></pre></div></div>
<script src="screen.js"></script>
<script src="floor.js"></script>
<script src="rules.js"></script>
<script>
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let save = null;

  // Color only the minimap rows (right panel) and the moon marker.
  function colorize(text) {
    const lines = text.split("\n");
    return lines.map((line, i) => {
      if (i >= 15 && i <= 19) {
        const left = esc(line.slice(0, 49)), right = line.slice(49);
        // [^] and [v] inside brackets are stairs; a bare ^ v < > next to @ is KURA's facing arrow.
        const map = right.replace(/\[[\^v]\]|[@^v<>&$?□=‖]/g, m => {
          if (m.length === 3) return "[" + `<span class="cell stairs">${m[1]}</span>` + "]";
          const ch = m;
          const cls = { "@": "you", "^": "you", "v": "you", "<": "you", ">": "you",
            "&": "demon", "$": "gold", "?": "goal", "□": "room", "=": "door", "‖": "door" }[ch];
          // Plain keyboard characters (? > < ^ v $ &) stay in the screen font;
          // only real Unicode symbols switch to the fallback symbol font.
          const inner = ch.charCodeAt(0) < 128 ? esc(ch) : `<span class="g">${esc(ch)}</span>`;
          return `<span class="cell ${cls}">${inner}</span>`;
        });
        return left + map;
      }
      // Turn controls under the 3D view (only the left 48 columns, so the map is never touched).
      if (i === 21 || i === 22) {
        const left = esc(line.slice(0, 48))
          .replace("[&lt;]", '<span class="btn" data-act="left">[&lt;]</span>')
          .replace("[&gt;]", '<span class="btn" data-act="right">[&gt;]</span>')
          // [^] takes the day's step forward; dim when that way is a wall or the step is spent.
          .replace("[^]", `<span class="btn step${save && RULES.available(save)[save.facing] ? "" : " off"}" data-act="forward">[^]</span>`)
          .replace(/(<\/span>)(\s+)([NESW?])(\s+)(<span)/, '$1$2<span class="facing">$3</span>$4$5');
        return left + esc(line.slice(48));
      }
      // The block moon (rows 1-4): each box or shade glyph boxed to one cell; the lit part glows and breathes.
      const moonBox = t => t.replace(/[╭╮╰╯─│░▒▓█]/g, ch => `<span class="cell ${/[░▒▓█]/.test(ch) ? "lit" : "mframe"}"><span class="g">${ch}</span></span>`);
      if (i === 1) return moonBox(esc(line)).replace(/(\d\d):(\d\d)/, '$1<span class="colon">:</span>$2')
        .replace(/([日月火水木金土])/, '<span class="kanji"><span class="g">$1</span></span>');
      if (i === 2 || i === 3) return moonBox(esc(line));
      if (i === 4) return moonBox(esc(line)).replace("^^^", '<span class="moon">^^^</span>');
      // Log line 2 glows gold right after using an item.
      if (i === lines.length - 5 && logGlow) return esc(line).replace(/^(\| )(.*?)(\s*\|)$/, '$1<span class="gold">$2</span>$3');
      if (i === lines.length - 2) {
        // Daily actions dim once used (or when there's no door that way).
        const can = save ? RULES.available(save) : {};
        const b = (txt, act, ok) => `<span class="btn${ok ? "" : " off"}" data-act="${act}">${txt}</span>`;
        return esc(line)
          .replace("[F]IGHT", '<span class="btn" data-act="fight">[F]IGHT</span>')
          .replace("[T]ALK", '<span class="btn" data-act="talk">[T]ALK</span>')
          .replace("[I]NVOKE", '<span class="btn" data-act="invoke">[I]NVOKE</span>')
          .replace("SE[A]RCH", b("SE[A]RCH", "search", can.search))
          .replace(/\[([NSEW])\](ORTH|OUTH|AST|EST)/g, (m, x) =>
            b(m, "go-" + x, can[x]).replace('class="btn', 'class="btn' + (armed === x ? " armed" : save && save.encounter && can[x] ? " flee" : "")));
      }
      if (i === lines.length - 1) return esc(line)
        // SAVED / NOT SAVED shows for a few seconds after each action, then fades back into the border.
        .replace(/ (NOT SAVED|SAVED \d{4}-\d\d-\d\d) /, (m, t) => Date.now() < statusUntil
          ? ` <span class="${t === "NOT SAVED" ? "unsaved" : "saved"}">${t}</span> ` : "=".repeat(m.length))
        .replace("[C]ODEX", '<span class="btn" data-act="codex">[C]ODEX</span>')
        .replace("[L]OG", '<span class="btn" data-act="log">[L]OG</span>')
        .replace("[B]ACKUP", '<span class="btn" data-act="backup">[B]ACKUP</span>')
        .replace("[R]ST", '<span class="btn" data-act="reset">[R]ST</span>');
      return esc(line);
    }).join("\n")
      // The ALIGN arrow (which way the last action pulled KURA) glows white.
      .replace(/ALIGN (&lt;|\[)(LAW|NEU|CHA)(&gt;|\])/, (m, l, t, r) => "ALIGN " +
        (l === "&lt;" ? '<span class="pull">&lt;</span>' : l) + t + (r === "&gt;" ? '<span class="pull">&gt;</span>' : r));
  }

  function draw() {
    if (!save) return;
    // While a step is waiting for its second press, line 3 asks for confirmation (never saved).
    const extra = save.extra || "";
    document.getElementById("screen").innerHTML = colorize(SMT.renderScreen(save, extra));
  }

  // Every player's run lives in their own browser and saves itself after every action.
  // (The repo's save.json is the chat run, played with /smt-screen; the page doesn't touch it.)
  const KEY = "daily-dungeon-run";
  let statusUntil = 0;
  function flashStatus() { statusUntil = Date.now() + 4000; setTimeout(draw, 4100); }
  const hstDate = () => SMT.localISO(save && save.tz);

  // The adventure log: every line that starts with "Day N." (steps, searches, new days, descents).
  function remember(before) {
    // Every action goes in the log: steps, searches (even empty ones), turns, walls, new days.
    if (!save || !save.log || save.log === before) return;
    const h = save.history = save.history || [];
    const line = save.log.replace(/^> /, "").replace(/^Day \d+\. /, "");
    h.push("D" + String(save.day).padStart(3, "0") + " T" + String(save.steps || 0).padStart(3, "0") + "  " + line);
    // About 70 bytes an entry: 20,000 entries is roughly 1.4 MB, well inside a browser's storage.
    if (h.length > 20000) h.splice(0, h.length - 20000);
  }

  function persist() {
    try {
      delete save.unsaved;
      save.saved = hstDate();
      localStorage.setItem(KEY, JSON.stringify(save));
    } catch (e) {
      save.unsaved = true;   // private window or storage blocked: play still works, it just won't last
    }
    flashStatus();
  }

  // Catch up with the real date (a new day, or a missed deadline), then save.
  function tick() {
    if (!save) return;
    const before = JSON.stringify(save), log = save.log;
    save = RULES.tick(save);
    if (JSON.stringify(save) !== before) { remember(log); persist(); }
    endLog();
  }
  // When the run ends (KURA falls, or a deadline passes), the log opens once by itself,
  // after any fight box has been closed.
  function endLog() {
    if (!save || !save.dead || save.endShown || !document.getElementById("found").hidden) return;
    save.endShown = true; persist();
    setTimeout(() => toggleLog(true), 300);
  }

  // Before anything reads the clock, ask the server for the real time (the Date on its reply to a
  // quick HEAD request for this page). The device clock is used only if that fails or takes over 3s.
  async function syncTime() {
    try {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 3000);
      const t0 = Date.now();
      const r = await fetch(location.href, { method: "HEAD", cache: "no-store", signal: ctl.signal });
      clearTimeout(timer);
      const server = Date.parse(r.headers.get("Date") || "");
      if (!isNaN(server)) SMT.setSkew(server + 500 - (t0 + Date.now()) / 2);   // the header is whole seconds
    } catch (e) {}
  }
  async function start() {
    await syncTime();
    let s = null;
    try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
    if (s && s.dungeon && s.party) { save = s; tick(); flashStatus(); draw(); encounterBox(); return; }
    save = RULES.reset({});
    save.history = [];
    remember("");
    persist(); draw();
  }

  // LOG: the run's adventure log, newest first. Click, L or Escape closes it.
  function toggleLog(force) {
    const box = document.getElementById("log");
    const open = force === undefined ? box.hidden : force;
    box.hidden = !open;
    if (open) {
      const h = (save && save.history) || [];
      // After the run ends, the log opens on its own with a short epitaph on top.
      const end = save && save.dead ? `THE RUN IS OVER.  ${save.floor}, day ${save.day}, turn ${save.steps || 0}.\n` +
        `${(save.log || "").replace(/^> (Day \d+\. )?/, "")}\n\n` +
        RULES.summary(save).map(([k, v]) => "  " + (k + " ").padEnd(15, ".") + " " + v).join("\n") +
        "\n\n[R]ST begins a new run.\n\n" : "";
      box.querySelector("pre").textContent = end + "ADVENTURE LOG  (" + h.length + " entries)   D = day, T = turn\n\n" +
        (h.length ? h.slice().reverse().join("\n") : "Nothing yet.");
    }
  }

  // BACKUP: shows this run as a code to copy; pasting a different code brings that run back.
  function backup() {
    if (!save) return;
    // The code carries the run and the last 300 log entries, so it stays short enough to copy.
    const code = btoa(unescape(encodeURIComponent(JSON.stringify({ ...save, history: (save.history || []).slice(-300) }))));
    const got = prompt("Your save code. Copy it to keep a backup or move your run to another device.\n" +
      "To restore a run, paste its code here and press OK.", code);
    if (!got || got.trim() === code) return;
    try {
      const s = JSON.parse(decodeURIComponent(escape(atob(got.trim()))));
      if (!s.dungeon || !s.party) throw new Error("not a run");
      if (!confirm("Replace this run with the one from the code?")) return;
      save = s; tick(); persist(); draw();
    } catch (e) { alert("That code didn't work. Nothing was changed."); }
  }

  // N/S/E/W take the day's step, SEARCH is unlimited, turning is free. NEXT (X) is a hidden testing cheat.
  // INVOKE: the inventory. Press a number (or click a line) to use an item; I or Escape closes it.
  let invList = [], invSel = 0, invMsg = "", logGlow = false;
  // A box drawn in text, 72 wide: a title row (name left, tag right), then wrapped lines.
  function textBox(title, tag, lines, W = 70) {
    const out = ["+" + "-".repeat(W + 2) + "+"];
    const row = t => out.push("| " + t.padEnd(W) + " |");
    title = title.toUpperCase();
    if (title.length + tag.length + 2 <= W) row(title.padEnd(W - tag.length) + tag);
    else { row(title.slice(0, W)); if (tag) row(tag.padStart(W)); }
    for (const l of lines) {
      if (l === "") { row(""); continue; }
      let rest = l;
      while (rest.length > W) { const cut = rest.lastIndexOf(" ", W); row(rest.slice(0, cut)); rest = rest.slice(cut + 1); }
      row(rest);
    }
    out.push("+" + "-".repeat(W + 2) + "+");
    return out;
  }
  // Fit a popup exactly over the 3D view: screen rows 6-22, columns 1-47.
  function placeInView(box) {
    const scr = document.getElementById("screen"), r = scr.getBoundingClientRect();
    const rows = scr.textContent.split("\n").length, rh = r.height / rows, cw = r.width / 80;
    Object.assign(box.style, { left: scr.offsetLeft + cw + "px", top: scr.offsetTop + 6 * rh + "px",
      width: 47 * cw + "px", height: 17 * rh + "px", padding: `${rh / 2}px ${cw}px` });
  }
  window.addEventListener("resize", () => { const b = document.getElementById("inv"); if (!b.hidden) placeInView(b); });
  function showInv(open) {
    const box = document.getElementById("inv");
    box.hidden = !open;
    if (!open) return;
    placeInView(box);
    invList = save ? RULES.inventory(save) : [];
    invSel = Math.max(0, Math.min(invSel, invList.length - 1));
    const pre = box.querySelector("pre");
    pre.innerHTML = "";
    const add = (txt, cls, i) => { const d = document.createElement("div"); d.textContent = txt; if (cls) d.className = cls; if (i !== undefined) d.dataset.i = i; pre.appendChild(d); return d; };
    add("INVOKE".padEnd(35) + "[I] closes", "");
    add(" ");
    if (!invList.length) add("Nothing yet. Search the walls.");
    invList.forEach((it, i) => add(
      `${i === invSel ? ">" : " "} ${i < 9 ? i + 1 : " "}  ${it.name}${it.count > 1 ? " x" + it.count : ""}`.replace(/^(.{42}).{4,}$/, "$1..."),
      "t-" + it.tier + " btn", i));
    // The chosen item: what it is and what it does. How demons feel about it lives in the CODEX.
    const it = invList[invSel];
    if (it) {
      add(" ");
      const tag = it.tier + (it.align ? ` [${it.align}]` : "");
      const lines = [it.text, it.usable ? "[ENTER] uses it." : "No use here. Something down here might want it."];
      textBox(it.name, tag, lines, 41).forEach(l => add(l, "t-" + it.tier));
    }
    add(" ");
    // What happened on the last try to use something (cleared when another item is chosen).
    const help = add("[1-9] choose  "), btn = (t, k) => { const sp = document.createElement("span"); sp.textContent = t; sp.className = "btn"; sp.dataset[k] = "1"; return sp; };
    help.append(btn("[ENTER] use", "use"), "  ", btn("[C]ODEX", "codex"));
  }
  // CODEX: every demon met and item found, over all runs. Unknown ones show as ???.
  let codexTab = "demons", codexSel = 0;
  function showCodex(open) {
    const box = document.getElementById("codex");
    box.hidden = !open;
    if (!open || !save) return;
    const data = RULES.codex(save)[codexTab];
    const flat = data.flatMap(g => g.entries.map(e => ({ ...e, group: g.group })));
    if (codexSel === -1) codexSel = Math.max(0, flat.findIndex(x => x.known));   // a fresh tab opens on its first known entry
    codexSel = (codexSel + flat.length) % flat.length;
    const known = flat.filter(e => e.known).length;
    const pre = box.querySelector("pre");
    pre.innerHTML = "";
    const add = (txt, cls, i) => { const d = document.createElement("div"); d.textContent = txt; if (cls) d.className = cls; if (i !== undefined) d.dataset.i = i; pre.appendChild(d); return d; };
    // Header with the two tabs.
    const head = add("");
    // The open tab is bright; the other is dim.
    const tab = (t, label) => { const sp = document.createElement("span"); sp.textContent = label; sp.className = "btn " + (codexTab === t ? "sel" : "dim"); sp.dataset.tab = t; return sp; };
    head.append("CODEX     ", tab("demons", "[D]EMONS"), "   ", tab("items", "[I]TEMS"),
      `          ${codexTab === "demons" ? "DEMONS MET" : "ITEMS FOUND"} ${known} / ${flat.length}`);
    add(" ");
    const e = flat[codexSel];
    const cls = codexTab === "items" && e.known ? "t-" + e.group : "";
    (e.known ? textBox(e.name, e.tag, [...e.lines, "", e.count]) : textBox("???", "", ["Not found yet."])).forEach(l => add(l, cls));
    add(" ");
    let last = null;
    flat.forEach((x, i) => {
      if (x.group !== last) { last = x.group; add(x.group.toUpperCase(), "dim"); }
      add(`${i === codexSel ? ">" : " "}   ${x.known ? x.name : "???"}`, (i === codexSel ? "sel " : "") + (x.known ? "btn" : "dim btn"), i);
    });
    add(" ");
    add("[D]EMONS / [I]TEMS   arrows or click choose   [C] or Esc closes");
  }
  function useInv(i) {
    const it = invList[i];
    if (!it || !save) return;
    const log = save.log;
    save = RULES.useItem(save, it.name);
    logGlow = true;            // the result shows on log line 2, in gold, until the next action
    remember(log); persist(); draw();
    showInv(true);
  }

  // The day's one step takes two presses: the first arms it, the second (same direction) moves.
  // Anything else cancels. A wall or an already-used step answers on the first press.
  const NAMES = { N: "NORTH", S: "SOUTH", E: "EAST", W: "WEST" };
  let armed = null, armTimer = null;
  function disarm() { armed = null; clearTimeout(armTimer); }
  // The step confirmation is a popup: YES (Enter, Y, or the same direction again) or NO (Esc, anything else).
  // On a run's first day, a second box makes sure the player knows what a step costs.
  let reallySure = false;
  function confirmBox(dir, again) {
    reallySure = !!again;
    const box = document.getElementById("found"), pre = box.querySelector("pre");
    pre.innerHTML = "";
    const add = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; pre.appendChild(d); };
    add(again ? "ARE YOU REALLY SURE?" : `GO ${NAMES[dir]}?`, "gold");
    add(" ");
    add(again ? "This is your only move for the day." : "This uses today's one step.");
    add(" ");
    const row = document.createElement("div"), opt = (t, a) => { const e = document.createElement("span"); e.textContent = t; e.className = "btn"; e.dataset.cact = a; return e; };
    row.append(opt("[ YES ]", "yes"), "    ", opt("[ NO ]", "no"));
    pre.appendChild(row);
    box.dataset.mode = "confirm";
    box.hidden = false;
  }
  function answerConfirm(yes) {
    const dir = armed;
    document.getElementById("found").hidden = true;
    if (yes && dir && save && save.day === 1 && !reallySure && !save.encounter) return confirmBox(dir, true);
    if (yes && dir) act("go-" + dir); else { disarm(); draw(); }
  }
  // When a search turns something up, a box says what it was and waits for Enter, Space, Esc or a
  // click, so a quick run of searches can't skip past it. Holding A won't dismiss it.
  function foundBox(before) {
    if (!save) return;
    const newItems = (save.items || []).slice((before.items || []).length);
    const silver = (save.silver || 0) - (before.silver || 0);
    const lines = [];
    for (const it of newItems) lines.push({ text: it, tier: RULES.tierOf(it) });
    if (silver > 0 && /Coins/.test(save.log)) lines.push(silver + " SILVER");
    if (/Stairs lead down/.test(save.log)) lines.push("the stairs down");
    const box = document.getElementById("found");
    const pre = box.querySelector("pre");
    const add = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; pre.appendChild(d); };
    if (!lines.length) return;
    pre.innerHTML = "";
    add("KURA FOUND");
    add(" ");
    for (const l of lines) {
      if (typeof l === "string") add(l, "gold");
      else { const a = RULES.itemAlign(l.text); add(l.text, "t-" + l.tier); add(l.tier + (a ? `  [${a.slice(0, 3)}]` : ""), "t-" + l.tier); }
    }
    const notes = newItems.map(n => (RULES.inventory({ items: [n] })[0] || {}).text).filter(Boolean);
    if (notes.length) { add(" "); notes.forEach(n => add(n)); }
    add(" ");
    add("[ OK ]", "btn");
    box.hidden = false;
    box.dataset.mode = "found";
  }
  function closeFound() {
    document.getElementById("found").hidden = true;
    if (save && save.roundOver) { delete save.round; delete save.roundOver; persist(); draw(); }
    endLog();
  }

  // ENCOUNTER box: the demon, its HP, what happened this round, and the choices. It stays open until
  // the demon is gone (or KURA falls); then [ENTER] closes it.
  function encounterBox() {
    const e = save && save.encounter, lines = (save && save.round) || [];
    if (!e && !(save && save.roundOver)) return false;
    const box = document.getElementById("found"), pre = box.querySelector("pre");
    pre.innerHTML = "";
    const add = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; pre.appendChild(d); };
    if (e) {
      const filled = Math.round(10 * e.hp / e.hpmax);
      add(`${e.name}   [${"#".repeat(filled)}${"-".repeat(10 - filled)}]`, "demon");
    } else add(save.dead ? "DEFEAT" : "THE WAY IS CLEAR", save.dead ? "demon" : "gold");
    add(" ");
    for (const l of lines) add(l, /falls\.  \+|leaves|slips away|pays|escapes/.test(l) ? "gold" : /KURA falls|FALLS/.test(l) ? "demon" : "");
    add(" ");
    if (e) {
      const opt = (label, act) => { const d = document.createElement("span"); d.textContent = label; d.className = "btn"; d.dataset.fact = act; return d; };
      const row = document.createElement("div");
      if (e.stage === "gift") {
        // The demon asks for anything: one line per choice (SILVER, then items), then NOTHING.
        RULES.gifts(save).forEach((g, i) => {
          const line = document.createElement("div"), o = opt(`[${i + 1}] ${g.label}`, "give-" + i);
          if (!g.ok) o.classList.add("off");
          line.append(o); pre.appendChild(line);
        });
        row.append(opt("[N]OTHING", "give-none"));
      } else if (e.stage === "ask" || e.stage === "join") row.append(opt("[Y]ES", "yes"), "   ", opt("[N]O", "no"));
      else if (e.stage === "swap") {
        save.party.forEach((p, i) => { if (i > 0) row.append(opt(`[${i + 1}] ${p.name}`, "swap-" + i), "   "); });
        row.append(opt("[N]O", "swap-none"));
      } else {
        // RUN takes today's step through a door (the one KURA faces if she can, else any open one).
        const can = RULES.available(save), out = ["N", "E", "S", "W"].filter(d => can[d]);
        const run = opt("[R]UN", "run");
        if (!out.length) run.classList.add("off");
        row.append(opt("[F]IGHT", "fight"), "   ", opt("[T]ALK", "talk"), "   ", run);
      }
      pre.appendChild(row);

    } else add("[ OK ]", "btn");
    box.hidden = false;
    box.dataset.mode = e ? "encounter" : "done";
    return true;
  }

  function act(name) {
    if (name === "forward" && save) name = "go-" + save.facing;
    if (name === "run" && save && save.encounter) {
      const can = RULES.available(save), out = ["N", "E", "S", "W"].filter(d => can[d]);
      name = "go-" + (out.includes(save.facing) ? save.facing : out[0] || save.facing);
    }
    if (name !== "invoke" && name !== "codex") logGlow = false;
    if (name.startsWith("go-") && save) {
      const dir = name.slice(3);
      if (armed !== dir && RULES.available(save)[dir]) {
        disarm(); armed = dir;
        draw(); confirmBox(dir);
        return;
      }
    }
    disarm();
    if (name === "invoke") return showInv(document.getElementById("inv").hidden);
    if (name === "log") return toggleLog();
    if (name === "codex") { codexSel = -1; return showCodex(document.getElementById("codex").hidden); }
    if (name === "backup") return backup();
    if (!save) return;
    if (name === "reset" && !confirm("Begin a new run? This run will be lost.")) return;
    const log = save.log, steps = save.steps;
    const before = { items: (save.items || []).slice(), silver: save.silver };
    save = name === "yes" ? RULES.answer(save, true) : name === "no" ? RULES.answer(save, false)
      : name.startsWith("give-") ? RULES.give(save, name === "give-none" ? null : Number(name.slice(5)))
      : name.startsWith("swap-") ? RULES.swap(save, name === "swap-none" ? null : Number(name.slice(5)))
      : name === "left" ? RULES.turn(save, "L") : name === "right" ? RULES.turn(save, "R")
      : name.startsWith("go-") ? RULES.go(save, name.slice(3)) : RULES[name](save);
    if (name === "reset") save.history = [];
    remember(name === "reset" || save.steps !== steps ? "" : log);
    persist(); draw();
    if (name !== "reset" && !encounterBox()) foundBox(before);
  }

  document.getElementById("screen").addEventListener("click", e => {
    const b = e.target.closest(".btn"); if (b) act(b.dataset.act);
  });
  document.getElementById("log").addEventListener("click", () => toggleLog(false));
  document.getElementById("found").addEventListener("click", e => {
    const c = e.target.closest("[data-cact]");
    if (c) return answerConfirm(c.dataset.cact === "yes");
    if (document.getElementById("found").dataset.mode === "confirm") return answerConfirm(false);
    const b = e.target.closest("[data-fact]");
    if (b) act(b.dataset.fact);
    else if (document.getElementById("found").dataset.mode !== "encounter") closeFound();
  });
  // Clicking an item chooses it; clicking the chosen one again uses it. Clicking elsewhere closes.
  document.getElementById("inv").addEventListener("click", e => {
    if (e.target.closest("[data-use]")) return useInv(invSel);
    if (e.target.closest("[data-codex]")) { showInv(false); codexSel = -1; return showCodex(true); }
    const line = e.target.closest("[data-i]");
    if (!line) return showInv(false);
    const i = Number(line.dataset.i);
    if (i === invSel) useInv(i); else { invSel = i; invMsg = ""; showInv(true); }
  });
  document.getElementById("codex").addEventListener("click", e => {
    const tab = e.target.closest("[data-tab]"), line = e.target.closest("[data-i]");
    if (tab) { codexTab = tab.dataset.tab; codexSel = -1; showCodex(true); }
    else if (line) { codexSel = Number(line.dataset.i); showCodex(true); }
    else showCodex(false);
  });
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const key = e.key.toLowerCase();
    const fbox = document.getElementById("found");
    if (!fbox.hidden) {
      e.preventDefault();
      if (fbox.dataset.mode === "confirm") {
        const same = armed && key === armed.toLowerCase();
        answerConfirm(key === "enter" || key === "y" || same);
        return;
      }
      if (fbox.dataset.mode === "encounter") {
        const st2 = save.encounter && save.encounter.stage;
        let k;
        if (st2 === "gift") k = /^[1-8]$/.test(key) ? "give-" + (Number(key) - 1) : { n: "give-none", escape: "give-none" }[key];
        else if (st2 === "ask" || st2 === "join") k = { y: "yes", enter: "yes", n: "no", escape: "no" }[key];
        else if (st2 === "swap") k = { "2": "swap-1", "3": "swap-2", "4": "swap-3", n: "swap-none", escape: "swap-none" }[key];
        else k = { f: "fight", t: "talk", r: "run", n: "go-N", s: "go-S", e: "go-E", w: "go-W" }[key];
        if (k) act(k);
      } else if (key === "enter" || key === " " || key === "escape") closeFound();
      return;
    }
    if (!document.getElementById("codex").hidden) {
      e.preventDefault();
      if (key === "c" || key === "escape") showCodex(false);
      else if (key === "d" || key === "i") { codexTab = key === "d" ? "demons" : "items"; codexSel = -1; showCodex(true); }
      else if (key === "arrowdown" || key === "arrowup") { codexSel += key === "arrowdown" ? 1 : -1; showCodex(true); }
      else if (key === "arrowleft" || key === "arrowright") { codexTab = codexTab === "demons" ? "items" : "demons"; codexSel = -1; showCodex(true); }
      return;
    }
    if (!document.getElementById("inv").hidden) {
      if (key === "i" || key === "escape") { e.preventDefault(); showInv(false); }
      else if (key === "c") { e.preventDefault(); showInv(false); showCodex(true); }
      else if (/^[1-9]$/.test(key)) { e.preventDefault(); invSel = Number(key) - 1; invMsg = ""; showInv(true); }
      else if (key === "arrowdown" || key === "arrowup") { e.preventDefault(); invSel += key === "arrowdown" ? 1 : -1; invMsg = ""; showInv(true); }
      else if (key === "enter") { e.preventDefault(); useInv(invSel); }
      return;
    }
    if (!document.getElementById("log").hidden) {
      if (key === "l" || key === "escape") { e.preventDefault(); toggleLog(false); }
      return;
    }
    const k = { c: "codex", n: "go-N", s: "go-S", e: "go-E", w: "go-W", x: "next", f: "fight", t: "talk", i: "invoke", l: "log", b: "backup", r: "reset", 
      a: "search", arrowleft: "left", arrowright: "right" }[key];
    if (k) { e.preventDefault(); act(k); }
  });

  start();
  // Live clock: redraw the moment the minute turns over (the colon blinks on its own),
  // and catch up with the real date so midnight brings the new day.
  let shownMinute = SMT.now().getMinutes();
  setInterval(() => {
    const m = SMT.now().getMinutes();
    if (m !== shownMinute) { shownMinute = m; tick(); draw(); }
  }, 1000);
</script>
</body>
</html>
