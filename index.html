<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Daily Digital Demon Dungeon</title>
<style>
  /* VT323, self-hosted (fonts/OFL.txt has its license). */
  @font-face { font-family: "VT323"; src: url("fonts/VT323-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
  :root {
    --bg: #07090a;
    --fg: #e4e4df;
    --dim: #4f5d52;
    --trail: #8f8f8a;
    --bright: #ffffff;
    --demon: #e0564a;
    --gold: #e3b341;
    --moon: #9fc4ff;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { -webkit-user-select: none; user-select: none; }      /* clicks never highlight the screen text */
  textarea, input, #log pre { -webkit-user-select: text; user-select: text; }   /* but the password box and the log can still be selected and copied */
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    font-family: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-variant-ligatures: none;      /* VT323 joins fl, fi and ff into one cell, which pulls that row's border a column left */
  }
  .frame { max-width: 100%; overflow-x: auto; }
  pre {
    margin: 0; font-family: inherit; line-height: 1.05;
    font-size: clamp(6px, calc((100vw - 32px) / 49), 22px); white-space: pre;
    text-shadow: 0 0 4px rgba(228, 228, 223, 0.2);
  }
  @media (max-width: 700px) {   /* phones: the screen fills the width (80 columns of VT323 are 32 text-widths across) */
    body { padding: 16px 4px; }
    pre { font-size: calc((100vw - 8px) / 32.5); }
  }
  .you { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .demon { color: var(--demon); }
  .gold { color: var(--gold); }
  .moon { color: var(--moon); }
  /* The clock's colon blinks slowly (1s on, 1s off); hidden, it still keeps its space. */
  .colon { animation: blink 2s steps(1) infinite; }
  /* The weekday kanji takes exactly two character cells, so the frame stays straight. */
  /* Like .cell: the box keeps the screen font so 2ch is two grid cells; only the glyph switches font. */
  .kanji { display: inline-block; width: 2ch; text-align: center; overflow: visible; white-space: nowrap; }
  .kanji .g { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "MS Gothic", sans-serif; line-height: 0; font-size: 0.8em; }   /* a little smaller than the letters, still centered in its two cells */
  @keyframes blink { 50% { opacity: 0; } }   /* opacity (not visibility) so a blinking button still takes clicks while it is dark */
  .stairs { color: var(--moon); }
  .goal { color: var(--gold); text-shadow: 0 0 6px var(--gold); }
  /* Map symbols like □ ⋰ ⋱ ↑ ↓ can be wider or narrower than letters in some fonts.
     Boxing each one to exactly one character keeps the grid lined up. */
  /* .cell keeps the screen's own font so 1ch equals exactly one character of the grid;
     only the glyph inside it switches to a font that has the symbol. */
  .cell { display: inline-block; width: 1ch; text-align: center; overflow: visible; white-space: nowrap; }
  /* The moon strip: shorter blocks, so the row is not taller than its neighbours. */
  .ph .g { display: inline-block; transform: scale(1.3, 0.62); }
  .mk { position: relative; z-index: 1; }
  .wm .g { display: inline-block; transform: scale(0.82, 1); }   /* the wordmark's blocks: the fallback font's are wider than a cell */
  .cell .g { font-family: "DejaVu Sans Mono", Menlo, Consolas, "Segoe UI Symbol", monospace; line-height: 0; }
  .room { color: var(--trail); }
  .door { color: var(--trail); }
  .door.focus { color: #ffffff; text-shadow: none; }   /* the locked door KURA faces: flat white, no glow */
  .door .g { position: relative; left: -0.1em; }   /* the fallback font draws || a touch right of its cell */
  .wall { color: var(--dim); opacity: 0.6; }
  .btn { cursor: pointer; color: var(--bright); }
  .btn.gold { color: var(--gold); }
  .btn:hover { background: var(--fg); color: var(--bg); }
  .btn.off { color: var(--dim); }
  .btn.armed { background: var(--gold); color: var(--bg); }
  .btn.flee { color: var(--bright); animation: blink 1.2s steps(1) infinite; }
  .unsaved { color: var(--gold); }
  .frame { position: relative; }
  /* The title logo: an image over the banner's rows, sized in the screen's own units (same font size as the pre), so it
     scales with the text. Half a row down from the banner's top, eight rows tall; the column comes from SMT.LOGO. */
  .titlelogo { position: absolute; pointer-events: none; font-size: clamp(6px, calc((100vw - 32px) / 49), 22px);
    top: calc(6.5 * 1.05em); height: calc(8 * 1.05em); width: auto; }
  @media (max-width: 700px) { .titlelogo { font-size: calc((100vw - 8px) / 32.5); } }
  html, body { touch-action: pan-x pan-y; }   /* scrolling only: no pinch zoom, no double-tap zoom ('manipulation' still allowed pinch) */
  @media (max-height: 500px) and (orientation: landscape) {   /* a phone on its side: size the screen by whichever of width and height is smaller, so it never scrolls */
    body { padding: 8px 4px; }
    pre, .titlelogo { font-size: min(calc((100vw - 8px) / 32.5), calc((100vh - 16px) / 35)); }
  }
  .logview { position: absolute; inset: 0; background: rgba(7, 9, 10, 0.96); overflow: auto; cursor: pointer;
    border: 1px solid var(--trail); box-sizing: border-box; padding: 1.5em 2ch; }
  .logview pre { white-space: pre-wrap; }
  .logview .sel { color: var(--bright); }
  /* INVOKE opens inside the 3D view (rows 6-22, columns 1-47); placeInView() sizes it to that area. */
  .viewpop { position: absolute; background: var(--bg); overflow: auto; cursor: pointer; box-sizing: border-box;
    outline: 1px solid var(--trail); }
  .viewpop pre { white-space: pre; display: flex; flex-direction: column; min-height: 100%; margin: 0; }
  .viewpop pre > div { flex: none; }
  .viewpop pre > div:last-child { margin-top: auto; position: sticky; bottom: 0; background: var(--bg); }   /* the [ENTER] use row sits at the foot, so it never moves when the list or the box changes size */
  .logview .dim { color: var(--trail); }
  .viewpop .dim { color: var(--trail); }
  .foundbox { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); background: var(--bg);
    border: 1px solid var(--gold); padding: 1em 3ch; cursor: pointer; }   /* a gold border and no glow around it: no box in the game has one */
  /* A search result's color, by what it turned up. No glow on any of them. */
  .q-plain { color: #a3a3a3; }        /* nothing, or a common or uncommon thing: a plain light grey (v1.05.1; sand in v1.04.4) */
  .q-silver { color: #d6e8ff; }       /* SILVER: cooler and brighter than the log's own off-white */
  .q-rare { color: #6aa6e8; }         /* rare: blue */
  .q-mythic { color: #f5c542; }       /* mythic, and the deep find: a bright gold */
  .q-moon { color: #c9b6ff; }         /* a moon thing: lavender */
  .q-aura { color: #e3a6c4; }         /* what an AURA read turned up: soft pink, KURA's own (v1.05.3: slides with her lean, see auraColor) */
  #ticker { display: inline-block; width: 76ch; overflow: hidden; white-space: pre; vertical-align: top; }
  .foundbox pre { white-space: pre; text-align: center; }
  .foundbox .gold { color: var(--gold); }
  /* (v1.36) The USER page sits in the 3D view like the bag, and scrolls; its title and message stay at the top. */
  .foundbox[data-mode="pass"] { overflow: auto; }
  .foundbox[data-mode="pass"] pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  .foundbox[data-mode="pass"] .top { position: sticky; top: 0; background: var(--bg); }
  .foundbox[data-mode="pass"] .code { -webkit-user-select: text; user-select: text; }
  .foundbox[data-mode="pass"] .btn { display: inline-block; }
  .codebox { background: var(--bg); color: var(--fg); border: 1px solid var(--trail); font: inherit; width: 29ch; padding: 0 4px; text-transform: uppercase; }
  .nameinput { background: var(--bg); color: var(--fg); border: 1px solid var(--trail); font: inherit; width: 11ch; padding: 0 4px; text-transform: uppercase; }
  .nameinput.bad { border-color: var(--demon); }
  #board .auto { color: var(--trail); }
  .passfield { display: block; width: 100%; box-sizing: border-box; background: var(--bg); color: var(--fg); border: 1px solid var(--trail); font: inherit; resize: none; margin: 4px 0; }
  /* The fight box sits inside the 3D view (rows 6-20, columns 1-47), like the bag, so the party and map stay in sight. */
  .foundbox.inframe { left: auto; top: auto; transform: none; border: none; outline: 1px solid var(--trail); box-shadow: none;
    box-sizing: border-box; overflow: hidden; cursor: default; }
  .foundbox.inframe pre { text-align: left; }
  .foundbox.fight pre { padding: 0 2ch; }   /* the fight box's text sits in from the edge */
  .foundbox.inframe .brow { display: flex; justify-content: space-between; }
  .foundbox .artframe { color: var(--trail); }
  .bdot { transform: scale(1.5); transform-origin: 50% 70%; }   /* the breath dots over the bar (v1.01.1): a little bigger, in place */
  .foundbox .arrow { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  /* Rarity colors, Diablo-style. */
  .lit { color: var(--moon); text-shadow: 0 0 6px var(--moon); animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.55; text-shadow: 0 0 2px var(--moon); } }
  .mframe { color: var(--trail); }
  .cres { color: var(--moon); }
  .logline { display: inline-block; width: 78ch; overflow: hidden; vertical-align: top; white-space: pre; }
  .wait { animation: blink 1s steps(1) infinite; }   /* the _ that waits for a click */
  .caret2 { display: inline-block; transform: scale(1.35); transform-origin: 50% 62%; }   /* the action button's caret: a little bigger, without moving anything */
  .caret { display: inline-block; position: relative; left: calc(-1ch / 6); width: calc(1ch / 1.5); font-size: 1.5em; line-height: 0.6; vertical-align: middle; text-shadow: none; }   /* just the ^ is bigger; its cell stays one column wide */
  .btn.nudge { animation: blink 0.35s steps(1) 2; }   /* two flashes when keys are pressed while a question waits */
  /* The build number, small, under the screen's lower right corner. */
  .ver { white-space: pre-line; text-align: right; font-size: 12px; line-height: 14px; color: var(--trail); padding: 2px 1ch 0 0; letter-spacing: 0.05em; }
  .cheat { text-align: left; padding: 2px 0 0 1ch; margin-top: -16px; }   /* the X cheat menu: three lines, left-justified; the build number stays at the right */
  .cheat:empty { display: none; }
  .flash { animation: voiceflash .35s ease-out; } @keyframes voiceflash { 0% { color: #ffffff; } }   /* (v1.08) a blow lands: a quick brighten, no glow */
  .sky-rule { color: #2c3236; } .skystar .g { display: inline-block; transform: scale(0.72); } .sky-mid { color: #8a9196; } .sky-far { color: #4d5357; } .sky-moon { color: #ece6cc; text-shadow: 0 0 6px rgba(236, 230, 204, 0.5); }   /* (v1.07) the night sky */
  .skystamp-at { display: inline-block; position: relative; width: 0; height: 1em; vertical-align: top; }
  .skystamp { position: absolute; right: 0; bottom: -0.55em; font-size: 0.6em; white-space: nowrap; color: #8b9499; text-shadow: none; }
  .pull { color: var(--bright); text-shadow: 0 0 6px var(--bright); }
  .t-ICHOR { color: var(--demon); }
  .foundbox .demon { color: var(--demon); }
  .facing { color: var(--bright); }
  .saved { color: var(--fg); }
</style>
</head>
<body>
  <div class="frame"><pre id="screen">LOADING...</pre><img id="logo" class="titlelogo" src="title-logo.png" alt="Daily Digital Demon Dungeon" hidden>
    <div id="log" class="logview" role="dialog" aria-modal="true" aria-label="Adventure log" hidden><pre></pre></div>
    <div id="inv" class="viewpop" role="dialog" aria-modal="true" aria-label="Invoke: your bag" hidden><pre></pre></div>
    <div id="codex" class="logview" role="dialog" aria-modal="true" aria-label="Codex" hidden><pre></pre></div>
    <div id="board" class="logview" role="dialog" aria-modal="true" aria-label="Leaderboard" hidden><pre></pre></div>
    <div id="about" class="logview" role="dialog" aria-modal="true" aria-label="About" hidden><pre></pre></div>
    <div id="ver" class="ver"></div>
    <div id="cheat" class="ver cheat"></div>
    <div id="found" class="foundbox" role="dialog" aria-modal="true" aria-live="polite" hidden><pre></pre></div></div>
<script src="sky.js"></script>
<script src="screen.js"></script>
<script src="floor.js"></script>
<script src="items.js"></script>
<script src="rules.js"></script>
<script src="act.js"></script>
<script>
  var PERIOD_STOP = 1000;   // (v1.08.1) a period is a full one-second stop wherever text types out (var: used before this script finishes running)
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let save = null;
  // TITLE SCREEN: shown first on every load (even over a save in progress -- CONTINUE is the explicit
  // resume). atTitle gates the click/keydown handlers over at the bottom of this file.
  let worldLines = [];                 // the title feed's lines, lent to the run's status line now and then (see RULES report)
  let atTitle = true, titleTimer = null, titleOffset = 0, titleCards = [], titleLean = null, titleDeep = null, titleStats = null, titleEvents = [];

  // Color only the minimap rows (right panel) and the moon marker.
  // (v1.05.3) An AURA result's color slides with KURA's lean (-6 LAW to +6 CHAOS): violet, through soft pink, to hot pink.
  function auraColor() {
    const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), NEU = hex("#e3a6c4");
    const t = save && save.align === "LAW" ? -1 : save && save.align === "CHAOS" ? 1 : 0, end = hex(t < 0 ? "#a990f5" : "#ff7aa8");
    return "#" + NEU.map((v, i) => Math.round(v + (end[i] - v) * Math.abs(t)).toString(16).padStart(2, "0")).join("");
  }
  // (v1.07) THE NIGHT SKY, when KURA looks up: the view's columns (screen rows 6-20) get their stars colored, the
  // guide's names in their pastels. (v1.07.1: the place-and-time stamp is gone; the header already has the time.)
  function skyLeft(line, i) {
    const sky = save && save.look && SMT.lastSky, y = i - 6;
    if (!sky || y < 0 || y >= sky.rows.length) return null;
    let out = esc(line[0]);
    const guideAt = {}; for (const g of sky.guide) if (g.y === y) guideAt[g.x] = g;
    for (let x = 0; x < 47; x++) {
      const ch = line[1 + x] || " ", g = guideAt[x];
      if (g) { const t = line.slice(1 + x, 1 + x + g.len); out += `<span style="color:${g.color};text-shadow:none"><span class="cell"><span class="g">${esc(t[0])}</span></span>${esc(t.slice(1))}</span>`; x += g.len - 1; continue; }
      const col = sky.color[y + "," + x];
      if (!col) out += esc(ch);
      else if (col[0] === "#") out += `<span class="cell skystar" style="color:${col};text-shadow:0 0 6px ${col}"><span class="g">${esc(ch)}</span></span>`;
      else out += `<span class="${col}">${esc(ch)}</span>`;
    }
    return out + esc(line[48] || "");
  }
  function colorize(text) {
    const lines = text.split("\n");
    return lines.map((line, i) => {
      if (i >= 15 && i <= 19) {
        const left = skyLeft(line, i) || esc(line.slice(0, 49)), right = line.slice(49);
        // [^] and [v] inside brackets are stairs; a bare ^ v < > next to @ is KURA's facing arrow.
        // The locked door KURA faces gets a slightly brighter #: it sits in the gap beside her @ on that side.
        const ctr = (lines[17] || "").slice(49).indexOf("@"), face = save && save.facing;
        const focus = ctr < 0 ? null : face === "N" ? [16, ctr] : face === "S" ? [18, ctr] : face === "E" ? [17, ctr + 2] : face === "W" ? [17, ctr - 2] : null;
        // (v1.12) After an AURA read the brackets of the rooms it felt warm from yellow to red (the rules send the heat as save.mapHeat, and it fades out).
        const ov = (save && save.mapHeat && save.mapHeat[i - 15]) || "", fade = save && save.heatFade != null ? save.heatFade : 1;
        const tint = (ch, k) => {
          const heat = ov[k] && ov[k] !== " " ? ov.charCodeAt(k) - 48 : 0;
          if (heat < 2) return ch;
          // A gradient: pastel yellow at the lowest, deepening through peach and orange, full red only at the hottest.
          const t = Math.min(1, (heat - 1) / 19), hue = Math.round(55 - 55 * t), sat = Math.round(45 + 50 * t), lit = Math.round(88 - 30 * t);
          return `<span style="color:hsl(${hue},${sat}%,${lit}%);opacity:${(0.35 + 0.65 * fade).toFixed(2)}">${ch}</span>`;
        };
        const map = right.replace(/[\[)][\^v][\](]|[@^v<>&$?□=‖#+\-|\[\]]/g, (m, at) => {
          if (m === "[" || m === "]") return tint(m, at);
          // The outline walls (+ - |) are dim; a # is a locked door and stays bright. The panel's own edges are left alone.
          if (/[+\-|]/.test(m)) {
            if (at === 0 || at === right.length - 1) return m;
            const l = right[at - 1], r = right[at + 1], gap = c => c === " " || c === "[" || c === "]";
            return `<span class="wall">${m}</span>`;
          }
          if (m.length === 3) return tint(m[0], at) + `<span class="cell stairs">${m[1]}</span>` + tint(m[2], at + 2);
          const ch = m;
          const cls = { "@": "you", "^": "you", "v": "you", "<": "you", ">": "you",
            "&": "demon", "$": "gold", "?": "goal", "□": "room", "=": "door", "‖": "door", "#": "door" }[ch];
          // Plain keyboard characters (? > < ^ v $ &) stay in the screen font;
          // only real Unicode symbols switch to the fallback symbol font.
          const inner = ch.charCodeAt(0) < 128 ? esc(ch) : `<span class="g">${esc(ch)}</span>`;
          const lit = ch === "#" && focus && i === focus[0] && at === focus[1] ? " focus" : "";
          return `<span class="cell ${cls}${lit}">${inner}</span>`;
        });
        return left + map;
      }
      // Turn controls under the 3D view (only the left 48 columns, so the map is never touched).
      if (i === 21 || i === 22) {
        const left = esc(line.slice(0, 48))
          .replace("[ &lt; ]", `<span class="btn${save && save.encounter ? " off" : ""}" data-act="left">[ &lt; ]</span>`)
          .replace("[ &gt; ]", `<span class="btn${save && save.encounter ? " off" : ""}" data-act="right">[ &gt; ]</span>`)
          // [^] takes the day's step forward; dim when that way is a wall or the step is spent, and in a fight
          // (running is a button in the fight box).
          .replace("[  ^  ]", `<span class="btn" data-act="forward">[  <span class="caret">^</span>  ]</span>`)
          .replace(/(<\/span>)(\s+)([NESWU?])(\s+)(<span)/, '$1$2<span class="facing">$3</span>$4$5');
        // The moon strip (row 21, right panel): each block glyph boxed to one cell, like the moon icon.
        // The moon strip (the breath bar) on row 21; at its right end, the seconds until the next breath is back.
        const glyphs = s => esc(s).replace(/[░▒▓█]/g, ch => `<span class="cell ph"><span class="g">${ch}</span></span>`)
          // the > and < that press on the bar after a search: kept above the bar and a little outside it, so the bar's wider blocks never cover them
          .replace("&gt;", '<span class="mk" style="left:-.25ch;top:-1px">&gt;</span>').replace("&lt;", '<span class="mk" style="left:calc(.5ch + 2px);top:-1px">&lt;</span>');
        // (v1.00.2: the bar sits about two thirds of a column left of the panel's middle in text columns, so its row is nudged right by that much.)
        const tail = i === 21 ? esc(line.slice(48, 49)) + `<span style="position:relative;left:.65ch">${glyphs(line.slice(49, 73))}</span>` + `<span id="breathT">${breathTimer()}</span>` + esc(line.slice(78)) : glyphs(line.slice(48));
        return left + tail;
      }
      // The v over today's phase (row 20, right panel).
      // The breath dots over the bar (row 20): nudged the same .65ch as the bar below them, so they sit centered over it.
      // Drawn half again as big (scaled in place, so the row keeps its 80 columns); an odd count is nudged half a column more (see screen.js).
      if (i === 20) { const odd = ((line.slice(48).match(/\./g) || []).length) % 2 === 1;
        return (skyLeft(line, i) ? skyLeft(line, i).slice(0, -esc(line[48] || "").length || undefined) : esc(line.slice(0, 48))) + esc(line.slice(48)).replace(/\./g, `<span class="cell bdot" style="position:relative;left:${odd ? "1.15ch" : ".65ch"}">.</span>`); }
      // The block moon (rows 1-4): each box or shade glyph boxed to one cell; the lit part glows and breathes.
      const moonBox = t => t.replace(/[╭╮╰╯─│░▒▓█]/g, ch => `<span class="cell ${/[░▒▓█]/.test(ch) ? "lit" : "mframe"}"><span class="g">${ch}</span></span>`);
      if (i === 1) return moonBox(esc(line)).replace(/(\d\d):(\d\d)/, '$1<span class="colon">:</span>$2')
        .replace(/([一-鿿])/g, '<span class="kanji"><span class="g">$1</span></span>');
      if (i === 2 || i === 3) return moonBox(esc(line));
      if (i === 4) return moonBox(esc(line)).replace("^^^", '<span class="moon">^^^</span>');
      // The three log lines: their text sits in a box exactly 78 cells wide, so the right border stays
      // straight even if a glyph in the font (an apostrophe, say) isn't exactly one cell wide.
      // Line 2 glows gold right after using an item.
      if (i >= lines.length - 6 && i <= lines.length - 4) {
        let inner = esc(line.slice(1, -1)); const gold = false;
        // A party member's question: [Y]ES and [N]O sit at the right end of the top line and answer it.
        // The bottom line is the ticker: the status report, this run's news and word of everyone else, typed out a line at a time.
        if (i === lines.length - 4) return `|<span class="logline"> <span id="ticker">${tickerHtml()}</span> </span>|`;
        if (i === lines.length - 6) inner = inner
          .replace(/\[1\]([A-Za-z' ]+?)(?= \[2\])/, m => `<span class="btn ask" data-act="qyes">${m}</span>`)
          .replace(/\[2\]([A-Za-z']+)/, m => `<span class="btn ask" data-act="qno">${m}</span>`)
          .replace("[Y]ES", '<span class="btn ask" data-act="qyes">[Y]ES</span>')
          .replace(/\[N\]O(?![A-Z])/, '<span class="btn ask" data-act="qno">[N]O</span>');
        // The middle line, after a search: "KURA searches the WEST wall..." stays as it is, and what came of it follows
        // in its quality's color (grey for nothing or a common or uncommon thing, silver for SILVER, blue for a rare
        // thing, gold for a mythic one or the deep find, lavender for a moon thing).
        if (i === lines.length - 5) {
          const m = /^( &gt; KURA (?:searches|scries) the [^.]+\.+) (.+?)(\s*)$/.exec(inner);
          if (m) inner = `${m[1]} <span class="${resultClass(m[2])}">${m[2]}</span>${m[3]}`;
          const a = !m && /^( &gt; KURA (?:feels|tunes into|checks the vibe|takes the room)[^.]*\.\.\.) (.+?)(\s*)$/.exec(inner);
          if (a) inner = `${a[1]} <span class="q-aura" style="color:${auraColor()}">${a[2]}</span>${a[3]}`;
        }
        return `|<span class="logline${gold ? " " + gold : ""}">${inner}</span>|`;
      }
      if (i === lines.length - 2) {
        // Daily actions dim once used (or when there's no door that way).
        const can = save ? RULES.available(save) : {};
        const b = (txt, act, ok) => `<span class="btn${ok ? "" : " off"}" data-act="${act}">${txt}</span>`;
        return esc(line)
          .replace("[F]IGHT", '<span class="btn" data-act="fight">[F]IGHT</span>')
          .replace("[T]ALK", '<span class="btn" data-act="word">[T]ALK</span>')
          .replace("[I]NVOKE", '<span class="btn" data-act="invoke">[I]NVOKE</span>')
          .replace(/\[S\]EARCH|\[S\]CRY/, m => b(m, "search", can.search))
          .replace("[M]OON", b("[M]OON", "look", !!save && !save.encounter && !save.dead))
          .replace(/\[([NSEW])\](ORTH|OUTH|AST|EST)/g, (m, x) =>
            b(m, "go-" + x, can[x]).replace('class="btn', 'class="btn' + (armed === x ? " armed" : save && save.encounter && can[x] ? " flee" : "")));
      }
      if (i === lines.length - 1) return esc(line)
        // SAVED / NOT SAVED shows for a few seconds after each action, then fades back into the border.
        .replace(/ (NOT SAVED|SAVED \d{4}-\d\d-\d\d) /, (m, t) => Date.now() < statusUntil
          ? ` <span class="${t === "NOT SAVED" ? "unsaved" : "saved"}">${t}</span> ` : "=".repeat(m.length))
        .replace("[?]", '<span class="btn" data-act="about">[?]</span>')
        .replace("[L]OG", '<span class="btn" data-act="log">[L]OG</span>')
        .replace("[R]ESET", '<span class="btn" data-act="reset">[R]ESET</span>');
      const sl = skyLeft(line, i); if (sl) return sl + esc(line.slice(49));      // (v1.07) the night sky's rows
      return esc(line);
    }).join("\n")
      // The ALIGN arrow (which way the last action pulled KURA) glows white.
      .replace(/&lt;( ?\[(?:KPT|STR|FRL)\])/, '<span class="pull">&lt;</span>$1')
      .replace(/(\[(?:KPT|STR|FRL)\] ?)&gt;/, '$1<span class="pull">&gt;</span>');
  }
  // The title screen's own colorizer: the header (rows 0-5) is identical to the in-run screen's and
  // gets the same treatment; everything below it is new (no minimap, no party, no [Y]/[N] questions).
  function colorizeTitle(text) {
    const lines = text.split("\n");
    const moonBox = t => t.replace(/[╭╮╰╯─│░▒▓█]/g, ch => `<span class="cell ${/[░▒▓█]/.test(ch) ? "lit" : "mframe"}"><span class="g">${ch}</span></span>`);
    return lines.map((line, i) => {
      if (i === 1) return moonBox(esc(line)).replace(/(\d\d):(\d\d)/, '$1<span class="colon">:</span>$2')
        .replace(/([一-鿿])/g, '<span class="kanji"><span class="g">$1</span></span>');
      if (i === 2 || i === 3) return moonBox(esc(line));
      if (i === 4) return moonBox(esc(line)).replace("^^^", '<span class="moon">^^^</span>');
      // The banner (rows 6 to 14): each block glyph boxed to one cell, like the moon's, so the letters hold their shape.
      if (i >= 6 && i <= 14) {
        const wm = t => esc(t).replace(/[▀▄█▓▌▐]/g, ch => `<span class="cell wm"><span class="g">${ch}</span></span>`);
        const C = SMT.CRES, b = i - 6 - C.row;
        if (b < 0 || b >= C.rows) return wm(line);
        // the crescent's cells: blue, flat (no glow), the dotted block boxed like the lettering's own
        const moon = line.slice(1 + C.col, 1 + C.col + C.w).replace(/[▀▄█▓]/g, ch => `<span class="cell cres${ch === "▓" ? " wm" : ""}"><span class="g">${ch}</span></span>`);
        return wm(line.slice(0, 1 + C.col)) + moon + wm(line.slice(1 + C.col + C.w));
      }
      // WEEK / EPOCH / LEAN: the same three rows the in-run log box occupies.
      if (i >= lines.length - 6 && i <= lines.length - 4) return `|<span class="logline">${esc(line.slice(1, -1))}</span>|`;
      // The menu bar: [N]EW RUN [C]ONTINUE [B]OARD [U]SER [?] ABOUT, same bracket convention as the real bar.
      if (i === lines.length - 2) {
        const b = (txt, act, ok) => `<span class="btn${ok ? "" : " off"}" data-act="${act}">${txt}</span>`;
        return esc(line)
          .replace("[N]EW RUN", b("[N]EW RUN", "title-new", true))
          .replace("[C]ONTINUE", b("[C]ONTINUE", "title-continue", titleCanContinue()))
          .replace("[B]OARD", b("[B]OARD", "title-board", !!LEADERBOARD_URL))
          .replace("[U]SER", b("[U]SER", "title-user", true))
          .replace("[?] ABOUT", b("[?] ABOUT", "title-about", true));
      }
      return esc(line).replace(/([一-鿿])/g, '<span class="kanji"><span class="g">$1</span></span>');      // (the level's heading carries the quarter's kanji)
    }).join("\n");
  }

  // Line 3 (voices, flavor, clues) stays put for at least 2 actions and 2 seconds before the next one replaces it,
  // so a quick run of clicks can't skip past it. Anything urgent (a warning, a hit, a new demon) takes over at once.
  // Only what's drawn is held: the save and the LOG still get every line.
  let heldExtra = null;                     // { text, steps, t }: the line on screen, and when it went up
  const EXTRA_URGENT = /closes tonight|GAME OVER|TRIPPING|comes down|-\d+ HP|appears|blocks the way|comes to see what broke|FALLS|calendar|joins the party|^> She wants/i;   // (the last is the Moon's wish: the answer to pressing [M]OON, so it never waits)
  function extraToShow() {
    const want = save.extra || "", now = Date.now(), steps = save.steps || 0, h = heldExtra;
    const take = () => { if (!h || h.text !== want || steps < h.steps) heldExtra = { text: want, steps, t: now }; return want; };
    if (!h || steps < h.steps || want === h.text || save.dead || save.question || save.extraUrgent || EXTRA_URGENT.test(want)) return take();
    if (steps - h.steps >= 2 && now - h.t >= 2000) return take();
    if (steps - h.steps >= 2) setTimeout(draw, h.t + 2000 - now + 30);   // the turns are up: wait out the clock
    return h.text;
  }
  // Put back the fight box that belongs to the run (after a cancelled question, a loaded password...).
  function restoreBoxes() { if (save) { encounterBox(); } }
  function draw() {
    if (atTitle) return drawTitle();               // a stray redraw (the clock, a closing box) must never paint the run over the title
    if (!save) return;
    try {
      // Any breath spent (a search, a step, something used) presses the bar for a second; so does being refused for want of one.
      const bn = save.breathNow, refused = bn === 0 && save.log !== seenLog && /out of breath|catches her breath|needs a moment/.test(save.log || "");
      if (typeof bn === "number") { if ((seenBreath !== null && bn < seenBreath) || refused) squeeze(); seenBreath = bn; }
      seenLog = save.log;
      if (Date.now() < squeezeUntil) save.squeeze = true;      // (only for this frame: never saved)
      const html = colorize(SMT.renderScreen(save, beatLine1 || extraToShow())); delete save.squeeze;
      document.getElementById("screen").innerHTML = html;
    }
    catch (err) {                                  // never freeze on a bad frame: say so, and keep the keys working
      console.error(err);
      document.getElementById("screen").textContent = "The screen could not be drawn. [R] begins a new run, [P] opens the account page.";
    }
    // While the infinite-steps cheat is on, the line under the screen shows the room and the counters.
    document.getElementById("cheat").textContent = save.freeSteps ? RULES.debugInfo(save) : "";
    document.getElementById("ver").textContent = SMT.VERSION;
    bagBox();
    raiseBox();
    judgedBox();
    offerBox();
    boxTick();
    tallyTick();
    registryTick(); goneTick(); visitorTick();
  }
  // The door she just opened, for the signal rooms' scratches (fire and forget: a mark that doesn't land costs nothing).
  function tallyTick() {
    if (SERVER) return;                                // (v1.22) the server sends what the rules queued
    if (!save || !save.tally) return;
    const t = save.tally; delete save.tally; persist();
    try { fetch(LEADERBOARD_URL + "/tally", { method: "POST", keepalive: true, headers: { "content-type": "application/json" }, body: JSON.stringify(t) }).catch(() => {}); } catch (e) {}
  }
  // THE SHARED REGISTRY (v1.14): items she gained (save.finds, queued by the rules) become numbered copies for a signed-in
  // player. Not signed in, or not on the game's own address: the queue is dropped. A send that fails stays queued (50 at most).
  let regBusy = false;
  function registryTick() {
    if (SERVER) return;                                // (v1.22) the server registers finds itself
    if (!save || !save.finds || !save.finds.length || regBusy) return;
    let tok = ""; try { tok = localStorage.getItem("dd-token") || ""; } catch (e) {}
    if (!tok || !ACCOUNT_HOST) { delete save.finds; persist(); return; }
    regBusy = true;
    const batch = save.finds.slice(0, 50), sent = new Set(batch.map(f => f.key));
    fetch(LEADERBOARD_URL + "/found", { method: "POST", headers: { authorization: "Bearer " + tok, "content-type": "application/json" }, body: JSON.stringify({ finds: batch }) })
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d && Array.isArray(d.copies)) {
        const idOf = new Map(batch.map(f => [f.key, f.id]));      // remember which copy is which, so a loss can use up the right one
        save.regCopies = (save.regCopies || []).concat(d.copies.filter(c => idOf.has(c.key)).map(c => ({ id: idOf.get(c.key), copy: c.copy }))).slice(-100);
        save.finds = (save.finds || []).filter(f => !sent.has(f.key)); persist(); } })
      .catch(() => {})
      .finally(() => { regBusy = false; });
  }
  // (v1.15) A thing that left the bag for good (the rules queue its name in save.gone) is a copy used up in the registry. The
  // newest copy of that item from this run is the one that goes. A name with no copy yet waits while its find is still queued.
  let goneBusy = false;
  function goneTick() {
    if (SERVER) return;                                // (v1.22) the server uses them up in the registry itself
    if (!save || !save.gone || !save.gone.length || goneBusy) return;
    let tok = ""; try { tok = localStorage.getItem("dd-token") || ""; } catch (e) {}
    if (!tok || !ACCOUNT_HOST) { delete save.gone; persist(); return; }
    const copies = (save.regCopies || []).slice(), send = [], keep = [];
    for (const name of save.gone) {
      const id = RULES.itemId(name), i = copies.map(c => c.id).lastIndexOf(id);
      if (id && i >= 0) { send.push(copies[i]); copies.splice(i, 1); }
      else if (id && (save.finds || []).some(f => f.id === id)) keep.push(name);      // its find hasn't been registered yet: try again later
    }
    save.gone = keep;
    if (!keep.length) delete save.gone;
    if (!send.length) { persist(); return; }
    goneBusy = true;
    fetch(LEADERBOARD_URL + "/spent", { method: "POST", headers: { authorization: "Bearer " + tok, "content-type": "application/json" }, body: JSON.stringify({ items: send.map(c => ({ itemId: c.id, copy: c.copy })) }) })
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        const done = new Set(((d && d.done) || []).map(c => c.itemId + ":" + c.copy));
        save.regCopies = (save.regCopies || []).filter(c => !done.has(c.id + ":" + c.copy)); persist();
      })
      .catch(() => {})
      .finally(() => { goneBusy = false; });
    persist();
  }
  // (v1.15) VISITORS: at the first look of each new day, and whenever the bag is opened, a signed-in player's visiting 88x31
  // buttons come into the bag (one each, while there is room). They are guests: they can't break, they can
  // change hands in a run without being used up, and they come back to the bag if a demon walks off with one.
  let visitBusy = false, visitLast = 0;
  function visitorTick(force) {
    if (!save || save.dead || atTitle || !save.dungeon || visitBusy || save.encounter) return;
    if (force) { if (Date.now() - visitLast < 30000) return; }           // opening the bag asks too, at most every half minute
    else if (save.visitDay === save.day) return;                         // otherwise once at the first look of each day
    visitLast = Date.now();
    let tok = ""; try { tok = localStorage.getItem("dd-token") || ""; } catch (e) {}
    if (!tok || !ACCOUNT_HOST) return;
    visitBusy = true;
    fetch(LEADERBOARD_URL + "/inventory", { headers: { authorization: "Bearer " + tok } })
      .then(r => r.ok ? r.json() : null)
      .then(async d => {
        if (!d || !Array.isArray(d.items) || !save || save.dead) return;
        for (const it of d.items) if (it.from === "88x31") {
          const before = (save.items || []).length;
          save = await play({ t: "welcomeVisitor", info: { name: it.name, itemId: it.itemId, copy: it.copy, rarity: it.rarity, note: it.note, align: it.align, nature: it.nature } });
          if ((save.items || []).length > before && !(save.regCopies || []).some(c => c.id === it.itemId && c.copy === it.copy)) save.regCopies = (save.regCopies || []).concat({ id: it.itemId, copy: it.copy }).slice(-100);
        }
        save.visitDay = save.day; persist(); draw();
      })
      .catch(() => {})
      .finally(() => { visitBusy = false; });
  }
  // THE GIFT BOX (v1.10): the rules say a box is here (save.box) or a swap is waiting on the server (save.boxPending);
  // the page does the asking, and tells the rules what came back. A box it cannot reach just isn't there this time.
  let boxBusy = false;
  async function boxTick() {
    if (boxBusy || !save || save.dead || atTitle) return;
    const look = save.box && save.box.state === "ask" && !save.offer && !save.encounter, swap = save.boxPending;
    if (!look && !swap) return;
    boxBusy = true;
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 5000);
    try {
      if (swap) {
        const r = await fetch(LEADERBOARD_URL + "/gift", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ k: swap.k, give: swap.give }), signal: ctl.signal });
        const j = r.ok ? await r.json() : null;
        save = await play({ t: "boxDone", ok: !!(j && j.ok), got: j ? j.got : null });
      } else {
        const r = await fetch(LEADERBOARD_URL + "/gift?k=" + encodeURIComponent(save.box.k), { signal: ctl.signal });
        const j = r.ok ? await r.json() : null;
        save = await play(j ? { t: "boxFound", item: j.item, marks: j.marks } : { t: "boxCancel" });
      }
    } catch (err) {
      save = await play(swap ? { t: "boxDone", ok: false } : { t: "boxCancel" });
    }
    clearTimeout(timer);
    boxBusy = false;
    persist(); draw();
  }
  // A PARTY MEMBER'S OFFER (v1.06): one of two things from their pockets, or one of two from KURA's bag for them.
  // [1] or [2] takes it; [ESC] leaves it (they keep their things). With a full bag, taking one opens the bag to
  // choose what goes back to them. (A demon's offer is in the fight box instead.)
  function offerBox() {
    const box = document.getElementById("found");
    const v = save && !save.encounter && !save.dead && save.offer ? RULES.offerView(save) : null;
    if (!v) { if (box.dataset.mode === "offer") { box.hidden = true; box.dataset.mode = ""; box.querySelector("pre").innerHTML = ""; } return; }
    if (atTitle || replayTimer || (!box.hidden && box.dataset.mode !== "offer")) return;
    if (["inv", "log", "board", "codex", "about"].some(id => { const el = document.getElementById(id); return el && !el.hidden; })) return;
    const pre = box.querySelector("pre");
    box.className = "foundbox inframe"; box.removeAttribute("style"); box.hidden = false;
    placeInView(box, v.moon ? 8 : 15);
    if (v.moon) { const scr = document.getElementById("screen"), rh = scr.getBoundingClientRect().height / scr.textContent.split("\n").length; box.style.top = scr.offsetTop + 15 * rh + "px"; }   // her offer sits low, under the moon
    box.dataset.mode = "offer";
    pre.innerHTML = "";
    const add = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; pre.appendChild(d); return d; };
    const opt = (label, act) => { const d = document.createElement("div"), b = document.createElement("span"); b.textContent = label.slice(0, 41); b.className = "btn"; b.dataset.off = act; d.appendChild(b); pre.appendChild(d); };
    const said = (save.extra || "").replace(/^> /, ""), words = said.split(" "), rows = [""];      // (wrapped here: this can run before the page's wrapText exists)
    for (const w of words) { if ((rows[rows.length - 1] + " " + w).trim().length > 41) rows.push(w); else rows[rows.length - 1] = (rows[rows.length - 1] + " " + w).trim(); }
    rows.forEach(w => add(w, "gold"));
    add(" ");
    if (v.leave) {                                       // the moon's offer is now or never: leaving it asks first
      add("LEAVE HER OFFER?"); add("SHE WON'T ASK TWICE."); add(" ");
      const d = document.createElement("div"), y = document.createElement("span"), n = document.createElement("span");
      y.textContent = "[Y]ES"; y.className = "btn"; y.dataset.off = "oleave-yes"; n.textContent = "[N]O"; n.className = "btn"; n.dataset.off = "oleave-no";
      d.append(y, "   ", n); pre.appendChild(d);
      return;
    }
    if (v.box && v.wait) { add("..."); return; }
    if (v.trade) {
      add((v.box && v.empty ? "Leave what in the box?" : v.box ? `Leave what for ${v.items[v.picked]}?` : `Give what for ${v.items[v.picked]}?`).toUpperCase().slice(0, 41));
      v.bag.forEach((it, i) => opt(`[${i + 1}] ${it.toUpperCase()}`, "otrade-" + i));
      opt("[ESC] BACK", "otrade-none");
      return;
    }
    v.items.forEach((it, i) => opt(`[${i + 1}] ${it.toUpperCase()}`, "opick-" + i));
    add(" ");
    opt(v.box ? "[ESC] CLOSE IT" : "[ESC] LEAVE IT", "opick-none");
  }
  // THE BAG IS FULL (v1.05.1): a thing that came to a full bag waits (save.overflow) until KURA picks what to leave
  // behind: 1-9 leaves that thing, N leaves the new one where it lay. It waits for every other box to close first.
  function bagBox() {
    const box = document.getElementById("found");
    if (atTitle || !save || save.dead || !(save.overflow || []).length || !box.hidden || replayTimer) return;
    if (["inv", "log", "board", "codex", "about"].some(id => { const el = document.getElementById(id); return el && !el.hidden; })) return;
    const pre = box.querySelector("pre"), it = save.overflow[0];
    box.className = "foundbox inframe"; box.removeAttribute("style"); box.hidden = false;
    placeInView(box, 15);
    box.dataset.mode = "bag";
    pre.innerHTML = "";
    const add = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; pre.appendChild(d); return d; };
    const opt = (label, i) => { const d = document.createElement("div"), b = document.createElement("span"); b.textContent = label; b.className = "btn"; b.dataset.bag = i; d.appendChild(b); pre.appendChild(d); };
    add(`KURA found ${it}.`.slice(0, 41), "gold");
    add("THE BAG IS FULL. Leave something behind?");
    add(" ");
    (save.items || []).forEach((n, i) => opt(`[${i + 1}] ${n.toUpperCase()}`.slice(0, 41), i));
    opt("[N]O THANKS", "none");
  }
  // (v1.26) THE SEALED STAIRS: KURA shows up to two things from the bag to the moon (or nothing). A + marks a thing
  // with something she wants. Numbers pick (again unpicks), S shows them, Esc steps back.
  function raiseBox() {
    const box = document.getElementById("found");
    const v = save && !save.dead && RULES.raiseView(save);
    if (!v) { if (box.dataset.mode === "raise") { box.hidden = true; box.dataset.mode = ""; box.querySelector("pre").innerHTML = ""; } return; }
    if (atTitle || replayTimer || (!box.hidden && box.dataset.mode !== "raise")) return;
    if (["inv", "log", "board", "codex", "about"].some(id => { const el = document.getElementById(id); return el && !el.hidden; })) return;
    const pre = box.querySelector("pre");
    box.className = "foundbox inframe"; box.removeAttribute("style"); box.hidden = false;
    placeInView(box, 17);
    box.dataset.mode = "raise";
    pre.innerHTML = "";
    const add = (t, cls) => { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; pre.appendChild(d); return d; };
    const btn = (t, a) => { const b = document.createElement("span"); b.textContent = t; b.className = "btn"; b.dataset.raise = a; return b; };
    add("THE STAIRS ARE SEALED", "gold");
    add(" ");
    v.bag.forEach((it, i) => { const d = add(""), on = v.picks.includes(i);
      d.append(btn(`${on ? ">" : " "} ${i + 1}  ${it.name}`.slice(0, 40).padEnd(41) + (it.pip ? "+" : " "), String(i))); });
    if (!v.bag.length) add("  The bag is empty.", "dim");
    add(" ");
    const names = v.picks.map(i => v.bag[i] && v.bag[i].name).filter(Boolean);
    for (const w of wrapText("Your offering: " + (names.length ? names.join(", ") : "nothing") + ".", 44)) add(w, "");
    add(" ");
    const f = add(""); f.append("[1-9] pick  ", btn("[S]HOW", "go"), "  ", btn("[ESC] BACK", "back"));
  }
  async function raiseAct(a) {
    if (!save || !save.raise || waiting) return;
    save = await play(a === "go" ? { t: "raiseGo" } : a === "back" ? { t: "raiseCancel" } : { t: "raisePick", i: Number(a) });
    persist(); draw();
  }
  // Her judgment, once, as a popup to click through.
  function judgedBox() {
    const J = save && save.judged, mem = save && (save.logged = save.logged || {});
    if (!J || !mem || mem.judged === J.k || atTitle || save.raise) return;
    const box = document.getElementById("found");
    if (!box.hidden) return;
    mem.judged = J.k; persist();
    noticeBox(J.lines);
  }
  async function bagPick(i) {
    if (!save || !(save.overflow || []).length || waiting) return;
    const box = document.getElementById("found");
    save = await play({ t: "keep", i: i === "none" ? null : Number(i) });
    box.hidden = true; box.dataset.mode = ""; box.querySelector("pre").innerHTML = "";
    persist(); draw();
  }

  // Every player's run lives in their own browser and saves itself after every action.
  // (The repo's save.json is the chat run, played with /smt-screen; the page doesn't touch it.)
  const KEY = "daily-dungeon-run";
  let statusUntil = 0;
  function flashStatus() { statusUntil = Date.now() + 4000; setTimeout(draw, 4100); }
  const hstDate = () => SMT.localISO(save && save.tz);

  // The adventure log: every line that starts with "Day N." (steps, searches, new days, descents).
  function remember(before) {
    // Everything the player reads goes in the log: the day's omen (once), line 2 (every action, even a
    // repeat), what happened in a fight or a talk (the box lines), and line 3 when it changes.
    // Hidden numbers never go in. Follow-up lines are indented under the action they belong to.
    if (!save) return;
    const h = save.history = save.history || [];

  // NEW RUN with nothing to lose skips the confirm; CONTINUE only fires with something real to resume.

  }
  async function titleAction(name) {

  // LOG: the run's adventure log, newest first. [C]LOSE, L or Escape closes it.

  let logText = "";
  function downloadLog() {
    const a = document.createElement("a");

    a.download = `daily-dungeon-log-${hstDate()}.txt`;

  }
  function copyLog(btn) {
    const done = ok => { if (btn) { btn.textContent = ok ? "COPIED" : "COPY FAILED"; setTimeout(() => btn.textContent = "C[O]PY", 1500); } };
    if (navigator.clipboard) navigator.clipboard.writeText(logText).then(() => done(true), () => done(false));
    else done(false);

  // LEADERBOARD: post this run's score once, and read the top of the board. Ranked by floor, then days; TURNS are shown only.
  // THE NAME: a run starts with a placeholder (RULES.named) and never waits for one. It is only the player's handle for
  // the board (the character is always KURA): it is typed, if at all, in the post row at the end of a run.
  const nameProblem = v => !v ? "TYPE A NAME FIRST." : v.length < 3 ? "TOO SHORT: AT LEAST 3 CHARACTERS." : v.length > 10 ? "TOO LONG: 10 CHARACTERS AT MOST." : "LETTERS, NUMBERS, SPACE _ . - ONLY.";
  // A name field keeps its keys to itself (so typing B or C is a letter, not a command): Enter and Escape do its two jobs.
  function nameField(inp, onEnter, onEscape) {
    inp.className = "nameinput"; inp.maxLength = 10; inp.spellcheck = false; inp.autocomplete = "off"; inp.value = (save && save.playerName) || "";
    inp.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") { e.preventDefault(); onEnter(); } else if (e.key === "Escape") { e.preventDefault(); onEscape(); } });
    inp.addEventListener("input", () => inp.classList.remove("bad"));
    return inp;
  }
  async function submitScore() {
    const msg = document.getElementById("scoremsg");
    if (!LEADERBOARD_URL || !save || !save.dead || save.submitted || !msg) return;
    if (save.cheated) { msg.textContent = "THIS RUN USED A TESTING CHEAT, SO IT CAN'T BE POSTED."; return; }
    const field = document.getElementById("postname");     // the post row's name: a rename right before posting
    if (field) {
      const next = await play({ t: "setName", name: field.value });
      if (next === save) { msg.textContent = nameProblem(field.value.trim()); field.focus(); return; }
      save = next; persist();
    }
    const name = save.playerName || "";
    if (!/^[A-Za-z0-9 _.\-]{3,10}$/.test(name)) { msg.textContent = "NO NAME ON THIS RUN."; return; }
    msg.textContent = "SENDING...";
    try {
      let tok = ""; try { tok = localStorage.getItem("dd-token") || ""; } catch (e) {}   // (v1.36) so the board can read this run's own numbers on the server
      const r = await fetch(LEADERBOARD_URL + "/score", { method: "POST", headers: { "content-type": "application/json", ...(tok ? { authorization: "Bearer " + tok } : {}) },
        body: JSON.stringify({ ...RULES.score(save), name, version: SMT.VERSION }) });
      let d = {}; try { d = await r.json(); } catch (e) {}
      if (!r.ok || !d.ok) {
        msg.textContent = d.error === "origin" ? `THE BOARD DOES NOT ALLOW THIS PAGE (${d.seen || location.origin}). ADD IT TO ALLOW_ORIGIN.`
          : d.error === "slow down" ? "TOO MANY POSTS. TRY LATER." : d.error === "name" ? "THAT NAME IS NOT ALLOWED."
          : d.error === "invalid" ? "THE BOARD DID NOT LIKE THIS SCORE." : `THE BOARD ANSWERED ${r.status}.`;
        return;
      }

      toggleLog(true);
    } catch (e) { msg.textContent = "COULD NOT REACH THE BOARD. IS THE WORKER DEPLOYED WITH THE LATEST CODE?"; }
  }
  // In X mode (the infinite-steps cheat) the board becomes an admin list: up/down pick a row, D deletes it (needs the Worker's ADMIN_KEY).
  let boardData = null, boardSel = 0, boardView = "board";
  function boardHead(pre, rest) {                  // "LEADERBOARD ... [C]LOSE", the close as a real button
    const c = document.createElement("span"); c.className = "btn"; c.dataset.close = "1"; c.textContent = "[C]LOSE";
    pre.textContent = ""; pre.append("LEADERBOARD".padEnd(41), c, "\n", ...[].concat(rest));
  }
  function renderBoard() {
    const pre = document.querySelector("#board pre"), d = boardData, admin = !!(save && save.freeSteps);

    const lines = ["", "  RANK  NAME        LEVELS DAYS  DEMONS   TURNS", ""];
    d.rows.forEach((x, i) => lines.push(row(i + 1, x, admin && i === boardSel)));

    const auto = new Set([...d.rows, ...(d.you ? [d.you] : [])].filter(x => RULES.isAutoName(x.name)).map(x => x.name.toUpperCase()));
    boardHead(pre, lines.map((l, i) => {
      const nm = l.slice(7, 17).trim();

  // X MODE, [H]ERE (v1.01.1): every device seen this moon, from the Worker's /admin/here (the admin key only).
  // Players only ever see counts; this is the admin's look at the rows behind them. No names, no addresses.
  async function showPresence() {
    const pre = document.querySelector("#board pre");
    boardView = "here"; boardHead(pre, "\nLOADING...");

    try {
      const r = await fetch(LEADERBOARD_URL + "/admin/here", { headers: { "x-admin-key": key } });

      const ago = t => (t < 60 ? `${t}s` : t < 3600 ? `${Math.floor(t / 60)}m` : t < 86400 ? `${Math.floor(t / 3600)}h` : `${Math.floor(t / 86400)}d`) + " ago";
      const lines = ["", `  RIGHT NOW ${d.now} (no bots)   TODAY ${d.today}   THIS MOON ${d.month}`, "", "  DEVICE   LEVEL  SEEN", ""];
      for (const x of d.rows) lines.push(`  ${x.id.padEnd(8)} ${lvl(x.level).padEnd(6)} ${ago(x.ago).padEnd(9)}${x.bot ? " bot" : ""}`);

  async function loadBoard() {

  async function deleteEntry() {

    let key = ""; try { key = localStorage.getItem("dd-admin") || ""; } catch (e) {}
    if (!key) { key = prompt("Admin key:") || ""; if (!key) return; }

  async function toggleBoard(force) {

        `${(save.log || "").replace(/^> (Day \d+\. )?/, "")}\n\n` +

        "\n\n" : "";

        // Newest first, but each action keeps its follow-up lines underneath it.
        (h.length ? h.reduce((g, l) => (/^ /.test(l) && g.length ? g[g.length - 1].push(l) : g.push([l]), g), [])
          .reverse().map(g => g.join("\n")).join("\n") : "Nothing yet.") + (save && save.dead ? "\n\n[R]ESET begins a new run." : "");

  // The USER page (the account) opens from [U] and the title screen's [U]SER.

  const acctApi = async (path, body, keep) => {
    let tok = ""; try { tok = localStorage.getItem("dd-token") || ""; } catch (e) {}

      const r = await fetch(LEADERBOARD_URL + path, body === undefined ? { headers } : { method: "POST", keepalive: !!keep, headers: { ...headers, "content-type": "application/json" }, body: JSON.stringify(body) });

  };

      e.preventDefault(); if (e.repeat) return;
      const v = save && RULES.offerView(save);
      if (!v) return;
      if (v.leave) { act(key === "y" || key === "enter" ? "oleave-yes" : "oleave-no"); return; }      // only Enter or Y leaves it
      if (v.trade) { if (/^[1-9]$/.test(key) && Number(key) <= v.bag.length) act("otrade-" + (Number(key) - 1)); else if (key === "escape" || key === "b") act("otrade-none"); }
      else if (key === "1" || key === "2") act("opick-" + (Number(key) - 1));
      else if (key === "escape") act("opick-none");
      return;
    }
    if (!fbox.hidden && fbox.dataset.mode === "raise") {       // (v1.26) the sealed stairs: numbers pick, S shows them to her, Esc steps back
      e.preventDefault(); if (e.repeat) return;
      if (/^[1-9]$/.test(key) && Number(key) <= (save.items || []).length) raiseAct(String(Number(key) - 1));
      else if (key === "s" || key === "enter") raiseAct("go");
      else if (key === "escape") raiseAct("back");
      return;
    }
    if (!fbox.hidden && fbox.dataset.mode === "bag") {         // the full bag's question: a number leaves that thing, N leaves the new one
      e.preventDefault(); if (e.repeat) return;
      if (/^[1-9]$/.test(key) && Number(key) <= (save.items || []).length) bagPick(Number(key) - 1);
      else if (key === "n") bagPick("none");
      return;
    }
    if (!fbox.hidden) {
      if (!/^(tab|f\d+)$/.test(key)) e.preventDefault();
      if (e.repeat) return;                        // holding a key can't answer a box
      if (fbox.dataset.mode === "confirm") {
        answerConfirm(key === "enter" || key === "y" || (key === "arrowup" && !!armed));     // anything else is NO
        return;
      }
      if (fbox.dataset.mode === "encounter" && replayAdvance && (key === "enter" || key === " ")) { e.preventDefault(); replayAdvance(); return; }
      if (fbox.dataset.mode === "encounter") {
        const st2 = save.encounter && save.encounter.stage;
        let k;
        if (st2 === "offer") k = key === "1" || key === "2" ? "opick-" + (Number(key) - 1) : { escape: "opick-none" }[key];
        else if (st2 === "trade") k = /^[1-9]$/.test(key) && Number(key) <= (save.items || []).length ? "otrade-" + (Number(key) - 1) : { escape: "otrade-none", b: "otrade-none" }[key];
        else if (st2 === "leave") k = key === "y" || key === "enter" ? "oleave-yes" : "oleave-no";          // only Enter or Y leaves it: anything else is NO
        else if (st2 === "join") k = { y: "yes", enter: "yes", n: "no", escape: "no" }[key];
        else if (st2 === "swap") k = { "2": "swap-1", "3": "swap-2", "4": "swap-3", n: "swap-none", escape: "swap-none" }[key];
        else k = { f: "fight", t: "word", i: "invoke", r: "run" }[key];
        if (k) act(k);
      } else if (fbox.dataset.mode === "found" || fbox.dataset.mode === "done") { if (key === "enter") closeFound(); }   // a find only closes on its [ OK ] (Enter or a click), never by a stray key
      else if (key === "enter" || key === " " || key === "escape") closeFound();
      return;
    }
    if (!document.getElementById("about").hidden) {
      e.preventDefault();
      if (key === "?" || key === "escape") showAbout(false);
      else if (key === "c") { showAbout(false); codexSel = -1; showCodex(true); }
      else if (key === "b" && LEADERBOARD_URL) { showAbout(false); toggleBoard(true); }
      else if (key === "u") { showAbout(false); backup(); }
      return;
    }
    if (!document.getElementById("codex").hidden) {
      e.preventDefault();
      if (key === "c" || key === "escape") showCodex(false);
      else if (key === "d" || key === "i") { codexTab = key === "d" ? "demons" : "items"; codexSel = -1; showCodex(true); }
      else if (key === "arrowdown" || key === "arrowup") { codexSel += key === "arrowdown" ? 1 : -1; showCodex(true); }
      else if (key === "arrowleft" || key === "arrowright") { codexTab = codexTab === "demons" ? "items" : "demons"; codexSel = -1; showCodex(true); }
      return;
    }
    if (!document.getElementById("inv").hidden) {
      if (invReg) { e.preventDefault(); if (key === "escape" || key === "c" || key === "i" || key === "m" || key === "backspace") { invReg = null; showInv(true); } return; }
      if (invHist) { e.preventDefault(); if (key === "escape" || key === "c" || key === "i" || key === "h" || key === "backspace") histAct("back"); else if (key === "l") histAct("ledger"); return; }
      if (ichorPick >= 0) {
        e.preventDefault();
        const n = save.party.length;
        if (key === "escape") ichorPick = -1;
        else if (key === "arrowdown" || key === "arrowup") ichorPick = (ichorPick + (key === "arrowdown" ? 1 : n - 1)) % n;
        else if (/^[1-9]$/.test(key) && Number(key) <= n) ichorPick = Number(key) - 1;
        else if (key === "enter") return useInv(invSel, ichorPick || "0");
        return showInv(true);
      }
      if (key === "i" || key === "c" || key === "escape") { e.preventDefault(); showInv(false); if (save && save.encounter) encounterBox(); }
      else if (key === "h") { e.preventDefault(); openHist(); }
      else if (key === "u") { e.preventDefault(); useInv(invSel); }
      else if (key === "m") { e.preventDefault(); invReg = { page: 0, items: null, msg: "", err: "", loading: false }; showInv(true); }
      else if ((key === "arrowleft" || key === "arrowright") && invSel === 0 && invList.length && invList[0].ichor) { e.preventDefault(); topSel = key === "arrowright" ? 1 : 0; showInv(true); }
      else if (key === "arrowleft" || key === "arrowright") { e.preventDefault(); pageInv(key === "arrowright" ? 1 : -1); }
      else if (/^[0-9]$/.test(key)) { e.preventDefault(); if (key === "0") topSel = 0; const ich = invList.length && invList[0].ichor ? 1 : 0, n = Number(key);   // 0 is ICHOR, 1-9 the bag
        if (n === INV_PER + 1 && invPage === 0 && invList.length - ich > INV_PER) return pageInv(1);   // (v1.33) 6 (v1.36) on the first page is its "next page" row
        if (n === 0 ? ich : n <= invList.length - ich) { invSel = n === 0 ? 0 : n - 1 + ich; showInv(true); useInv(invSel); } }   // (v1.06.1) pressing the number uses it
      else if (key === "arrowdown" || key === "arrowup") { e.preventDefault(); invSel += key === "arrowdown" ? 1 : -1; showInv(true); }
      else if (key === "enter") { e.preventDefault(); useInv(invSel); }
      return;
    }
    if (!document.getElementById("board").hidden) {
      e.preventDefault();
      if (key === "c" || key === "b" || key === "escape") toggleBoard(false);
      else if (save && save.freeSteps && boardData && boardView === "board" && (key === "arrowdown" || key === "arrowup")) { boardSel = (boardSel + (key === "arrowdown" ? 1 : boardData.rows.length - 1)) % Math.max(1, boardData.rows.length); renderBoard(); }
      else if (key === "d" && save && save.freeSteps && boardView === "board") deleteEntry();
      else if (key === "h" && save && save.freeSteps) { if (boardView === "here") { boardView = "board"; boardData ? renderBoard() : loadBoard(); } else showPresence(); }
      return;
    }
    if (!document.getElementById("log").hidden) {
      if (key === "l" || key === "c" || key === "escape") { e.preventDefault(); toggleLog(false); }
      else if (key === "enter" || key === "p") { e.preventDefault(); submitScore(); }
      else if (key === "o") { e.preventDefault(); copyLog(document.querySelector("#log [data-copy]")); }
      else if (key === "d") { e.preventDefault(); downloadLog(); }
      return;
    }
    if (atTitle) {
      const a = { n: "title-new", c: "title-continue", b: "title-board", u: "title-user", "?": "title-about" }[key];
      if (a) { e.preventDefault(); titleAction(a); }      // every other key (F5, Tab, F12...) is left to the browser
      return;
    }
    // S is SEARCH now; the day's step is [^] or the up arrow (the compass keys are gone with the NSEW buttons).
    if (save && save.question && (key === "y" || key === "n" || (save.question.lab && (key === "1" || key === "2")))) { e.preventDefault(); return act(key === "y" || key === "1" ? "qyes" : "qno"); }
    const k = { "?": "about", c: "codex", f: "fight", t: "word", i: "invoke", l: "log", b: "board", u: "backup", r: "reset",
      s: "search", m: "look", arrowdown: save && save.look ? "look" : null, arrowup: "forward", arrowleft: "left", arrowright: "right" }[key];
    if (key === "x") {   // testing cheats, behind the admin key: X toggles infinite steps, Shift+X jumps a day
      e.preventDefault(); if (gating) return;
      const shift = e.shiftKey; gating = true;
      adminGate().then(ok => { gating = false; if (ok) act(shift ? "next" : "freesteps"); }, () => { gating = false; });
      return;
    }
    if (k) { e.preventDefault(); RULES.holding(e.repeat); try { act(k); } finally { RULES.holding(false); } }
  });

  Promise.resolve(start()).then(() => reloadRun());
  // Live clock: redraw the moment the minute turns over (the colon blinks on its own),
  // and catch up with the real date so midnight brings the new day.
  let shownMinute = SMT.now().getMinutes();
  // The moon strip opens again as KURA gets her breath back: redraw when the count changes.
  setInterval(() => {
    if (atTitle || !save || !save.dungeon || save.breathNow === undefined) return;
    const n = RULES.breath(save);
    if (n !== save.breathNow) { save.breathNow = n; draw(); }
  }, 250);
  // Live presence (see pingHere): any key or click counts as being here; check every 30 seconds, and as the tab comes back.
  const touched = () => { lastInput = Date.now(); };
  document.addEventListener("keydown", touched, true);
  document.addEventListener("pointerdown", touched, true);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pingLive(); });
  setInterval(pingLive, 30000);
  setInterval(() => {
    const m = SMT.now().getMinutes();
    if (m !== shownMinute && !searchBeat) { shownMinute = m; if (!atTitle) tick(); draw(); }   // on the title, only the title redraws; the run waits for CONTINUE
  }, 1000);
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });   // two fingers never zoom
  for (const g of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(g, e => e.preventDefault());   // iOS pinch zoom
</script>
</body>
</html>
